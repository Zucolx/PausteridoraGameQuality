    return s;
  }

  // Cinco riesgos: al menos uno de cada tipo y el quinto al azar.
  function pickHazards(rng) {
    const types = Object.keys(M.HAZARDS);
    const chosen = [];
    for (const type of types) chosen.push(D.shuffle(rng, SPOTS.filter((p) => p.type === type))[0]);
    const rest = D.shuffle(
      rng,
      SPOTS.filter((p) => !chosen.includes(p))
    );
    while (chosen.length < TARGETS) chosen.push(rest.shift());
    return chosen.map((p, i) => ({ id: i, type: p.type, x: p.x, y: p.y, seen: false, found: false, firstTry: true }));
  }

  function lightRadius(s) {
    return s.cfg.light * s.flick;
  }

  function mistake(s, msg) {
    B.say(s.bubble, msg);
    s.stats.errors++;
    if (s.cfg.penalty) {
      s.timeLeft -= s.cfg.penalty;
      D.floatAdd(s.floats, s.player.x, s.player.y - 70, `−${s.cfg.penalty} s`, T.red, 20);
    }
  }

  function nearbyTarget(s) {
    const p = s.player;
    let best = null;
    let bestD = REACH;
    for (const h of s.hazards) {
      if (h.found) continue;
      const d = Math.hypot(h.x - p.x, h.y - p.y);
      if (d <= bestD && d <= lightRadius(s)) {
        best = { kind: 'hazard', ref: h };
        bestD = d;
      }
    }
    for (const dc of s.decoys) {
      if (dc.checked) continue;
      const d = Math.hypot(dc.x - p.x, dc.y - p.y);
      if (d <= bestD && d <= lightRadius(s)) {
        best = { kind: 'decoy', ref: dc };
        bestD = d;
      }
    }
    return best;
  }

  function update(s, dt, input) {
    if (s.over) return;
    s.time += dt;
    s.timeLeft -= dt;
    B.update(s.bubble, dt);
    s.floats = D.floatsUpdate(s.floats, dt);
    D.tickBanner(s, dt);
    s.tool.shake = Math.max(0, s.tool.shake - dt);
    if (s.fact) {
      s.fact.life -= dt;
      if (s.fact.life <= 0) s.fact = null;
    }
    // La linterna parpadea en difícil.
    s.flick = s.cfg.flicker && Math.sin(s.time * 1.7) > 0.93 ? 0.55 : 1;
    if (s.endT > 0) {
      s.endT -= dt;
      if (s.endT <= 0) s.over = true;
      return;
    }
    if (s.timeLeft <= 0) {
      s.timeLeft = 0;
      s.over = true;
      return;
    }
    // Revelado: lo que entra en la luz UV queda marcado.
    const R = lightRadius(s);
    for (const h of s.hazards) {
      if (!h.found && Math.hypot(h.x - s.player.x, h.y - s.player.y) < R) {
        if (!h.seen) {
          h.seen = true;
          D.sfx('alarm');
        }
      }
    }

    const P = input.pressed;
    if (s.target) {
      if (P.includes('cancel') || (P.includes('interact') && s.tool.phase === 'choose')) {
        s.target = null;
        return;
      }
      updateTool(s, dt, input);
      return;
    }
    W.move(WORLD, s.player, input, dt);
    if (P.includes('interact')) {
      const t = nearbyTarget(s);
      if (!t) return;
      if (t.kind === 'decoy') {
        t.ref.checked = true;
        s.stats.decoys++;
        B.say(s.bubble, 'Falsa alarma: es solo condensación limpia que brilla con la UV. Sigue buscando.', { kind: 'tip' });
        return;
      }
      s.target = t.ref;
      s.tool = { sel: 0, phase: 'choose', progress: 0, shake: 0 };
      D.sfx('enter');
    }
  }

  function toolCards() {
    const a = D.modalArea(H_TOOL);
    const w = 132;
    const gap = 12;
    const x0 = a.x + (a.w - (4 * w + 3 * gap)) / 2;
    return M.TOOL_ORDER.map((id, i) => ({ id, x: x0 + i * (w + gap), y: a.y + 70, w, h: 130 }));
  }

  function choose(s, toolId) {
    const h = s.target;
    const hz = M.HAZARDS[h.type];
    if (toolId === hz.tool) {
      s.tool.phase = 'clean';
      s.tool.progress = 0;
      D.sfx('blip');
    } else {
      h.firstTry = false;
      s.tool.shake = 0.4;
      mistake(s, `${hz.error} (${M.TOOLS[toolId].name} no sirve aquí.)`);
    }
  }

  function updateTool(s, dt, input) {
    const P = input.pressed;
    const tool = s.tool;
    if (tool.phase === 'choose') {
      if (P.includes('left')) tool.sel = (tool.sel + 3) % 4;
      if (P.includes('right')) tool.sel = (tool.sel + 1) % 4;
      for (const d of ['1', '2', '3', '4']) {
        if (P.includes(d)) {
          tool.sel = +d - 1;
          choose(s, M.TOOL_ORDER[tool.sel]);
          return;
        }
      }
      for (const c of input.clicks || []) {
        const hit = toolCards().find((r) => c.x >= r.x && c.x <= r.x + r.w && c.y >= r.y && c.y <= r.y + r.h);
        if (hit) {
          tool.sel = M.TOOL_ORDER.indexOf(hit.id);
          choose(s, hit.id);
          return;
        }
      }
      if (P.includes('space') || P.includes('confirm')) choose(s, M.TOOL_ORDER[tool.sel]);
      return;
    }
    // Aplicar la herramienta: mantener ESPACIO (o el ratón).
    if (input.space || (input.mouse && input.mouse.down)) tool.progress += dt;
    if (tool.progress >= 1.1) {
      const h = s.target;
      h.found = true;
      s.stats.found++;
      if (h.firstTry) s.stats.firstTry++;
      const pool = M.FACTS[h.type].concat(M.FACTS.general);
      const text = pool[Math.floor(s.rng() * pool.length)];
      s.fact = { title: M.HAZARDS[h.type].name, text, life: 9, max: 9 };
      D.floatAdd(s.floats, h.x, h.y - 30, '✔ Riesgo eliminado', T.ok, 18);
      D.sfx('resolved');
      s.target = null;
      if (s.stats.found >= TARGETS) {
        s.banner = D.makeBanner('¡ZONA SEGURA!', T.ok, 'Encontraste los 5 focos de contaminación', 2);
        s.endT = 1.8;
        D.sfx('end');
      }
    }
  }

  // ------------------------------------------------------------ Dibujo

  let dark = null;

  function draw(s, r) {
    const ctx = r.ctx;
    const t = r.t;
    D.begin(r);
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, D.VIEW.hud, D.VIEW.mapWidth, D.VIEW.height - D.VIEW.hud);
    ctx.clip();
    D.floor(ctx, D.MAP_BOUNDS, { floorColor: '#140d12', line: '#1d141b', stripe: '#5a2a7a' });
    for (const m of MACHINES) drawMachine(ctx, m, t);
    for (const dc of s.decoys) if (!dc.checked) drawDecoyBase(ctx, dc);
    D.player(ctx, s.player, { tool: 'flashlight', t });
    drawDarkness(s, r, ctx);

    // Fluorescencia: lo que la luz UV toca brilla por encima de la oscuridad.
    const R = lightRadius(s);
    for (const h of s.hazards) {
      if (h.found) {
        D.text(ctx, '✔', h.x, h.y + 6, { size: 18, weight: 800, color: T.ok, align: 'center' });
        continue;
      }
      const d = Math.hypot(h.x - s.player.x, h.y - s.player.y);
      const alpha = Math.max(0, Math.min(1, (R - d) / (R * 0.35)));
      if (alpha > 0) monster(ctx, h.type, h.x, h.y, 22, t, alpha);
      else if (h.seen && s.cfg.keepPins) pin(ctx, h.x, h.y, t);
    }
    for (const dc of s.decoys) {
      if (dc.checked) continue;
      const d = Math.hypot(dc.x - s.player.x, dc.y - s.player.y);
      const alpha = Math.max(0, Math.min(1, (R - d) / (R * 0.35)));
      if (alpha > 0) decoyGlow(ctx, dc, t, alpha);
    }
    if (s.cfg.guide && !s.target) {
      const rem = s.hazards.filter((h) => !h.found).sort((a, b) => Math.hypot(a.x - s.player.x, a.y - s.player.y) - Math.hypot(b.x - s.player.x, b.y - s.player.y))[0];
      if (rem) D.guide(ctx, s.player, rem, t, ACCENT);
    }
    const near = !s.target && nearbyTarget(s);
    if (near) D.prompt(ctx, s.player, near.kind === 'hazard' ? 'limpiar' : 'revisar', ACCENT);
    D.floatsDraw(ctx, s.floats);
    if (s.target) drawToolModal(s, ctx, t);
    if (!s.target) B.marker(ctx, s.bubble, s.player, t);
    ctx.restore();

    D.hud(ctx, t, {
      title: 'EL CAZADOR DE RIESGOS',
      diff: s.diff,
      timeLeft: s.timeLeft,
      duration: s.duration,
      accent: ACCENT,
      stats: [
        { label: 'Riesgos', value: `${s.stats.found}/${TARGETS}`, color: T.ok, width: 130 },
        { label: 'Errores', value: s.stats.errors, color: s.stats.errors ? T.red : T.ink, width: 110 },
      ],
    });
    drawSidebar(s, ctx, t);
  }

  function drawMachine(ctx, m, t) {
    ctx.fillStyle = '#2a2228';
    D.roundRect(ctx, m.x, m.y, m.w, m.h, 8);
    ctx.fill();
    ctx.strokeStyle = '#0b070a';
    ctx.lineWidth = 2;
    ctx.stroke();
    const cx = m.x + m.w / 2;
    const cy = m.y + m.h / 2;
    if (m.kind === 'filler') {
      ctx.fillStyle = '#4a4248';
      ctx.beginPath();
      ctx.arc(cx, cy, 86, 0, Math.PI * 2);
      ctx.fill();
      for (let i = 0; i < 14; i++) {
        const a = (i / 14) * Math.PI * 2;
        ctx.fillStyle = '#7a7078';
        ctx.beginPath();
        ctx.arc(cx + Math.cos(a) * 66, cy + Math.sin(a) * 66, 9, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (m.kind === 'star') {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(t * 0.4);
      ctx.fillStyle = '#6a6068';
      ctx.beginPath();
      for (let i = 0; i < 16; i++) {
        const rr = i % 2 ? 26 : 42;
        const a = (i / 16) * Math.PI * 2;
        ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    } else if (m.kind === 'conveyor') {
      ctx.fillStyle = '#3a3238';
      for (let x = m.x + 6; x < m.x + m.w - 6; x += 22) ctx.fillRect(x, m.y + 8, 12, m.h - 16);
      ctx.fillStyle = '#8a7e86';
      ctx.fillRect(m.x, m.y - 3, m.w, 4);
      ctx.fillRect(m.x, m.y + m.h - 1, m.w, 4);
    } else if (m.kind === 'tubes') {
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = ['#5a5258', '#6a6268', '#5a5258'][i];
        ctx.fillRect(m.x + 6 + i * 15, m.y + 4, 11, m.h - 8);
      }
    } else if (m.kind === 'valves') {
      for (let i = 0; i < 4; i++) {
        ctx.fillStyle = '#8a3a2a';
        ctx.beginPath();
        ctx.arc(m.x + 26 + i * 40, cy, 15, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#2a1410';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(m.x + 14 + i * 40, cy);
        ctx.lineTo(m.x + 38 + i * 40, cy);
        ctx.stroke();
      }
    } else if (m.kind === 'tank') {
      const g = ctx.createLinearGradient(m.x, 0, m.x + m.w, 0);
      g.addColorStop(0, '#3a3238');
      g.addColorStop(0.5, '#6a6068');
      g.addColorStop(1, '#3a3238');
      ctx.fillStyle = g;
      D.roundRect(ctx, m.x + 6, m.y + 6, m.w - 12, m.h - 12, 14);
      ctx.fill();
    }
    D.text(ctx, m.label, cx, m.kind === 'conveyor' ? m.y - 10 : m.y + m.h + 16, { size: 12, weight: 700, color: '#6a5a66', align: 'center' });
  }

  function drawDecoyBase(ctx, dc) {
    ctx.fillStyle = 'rgba(120,140,160,0.25)';
    ctx.beginPath();
    ctx.ellipse(dc.x, dc.y, 14, 8, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawDarkness(s, r, ctx) {
    const k = r.dpr * r.scale;
    const w = Math.ceil(D.VIEW.width * k);
    const h = Math.ceil(D.VIEW.height * k);
    if (!dark) dark = document.createElement('canvas');
    if (dark.width !== w || dark.height !== h) {
      dark.width = w;
      dark.height = h;
    }
    const o = dark.getContext('2d');
    o.setTransform(1, 0, 0, 1, 0, 0);
    o.clearRect(0, 0, w, h);
    o.setTransform(k, 0, 0, k, 0, 0);
    o.globalCompositeOperation = 'source-over';
    o.fillStyle = 'rgba(3,1,6,0.95)';
    o.fillRect(0, D.VIEW.hud, D.VIEW.mapWidth, D.VIEW.height - D.VIEW.hud);
    o.globalCompositeOperation = 'destination-out';
    const p = s.player;
    const R = lightRadius(s);
    const g = o.createRadialGradient(p.x, p.y, R * 0.25, p.x, p.y, R);
    g.addColorStop(0, 'rgba(0,0,0,1)');
    g.addColorStop(0.7, 'rgba(0,0,0,0.85)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    o.fillStyle = g;
    o.beginPath();
    o.arc(p.x, p.y, R, 0, Math.PI * 2);
    o.fill();
    o.globalCompositeOperation = 'source-over';
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(dark, Math.round(r.dpr * r.ox), Math.round(r.dpr * r.oy));
    ctx.restore();
    // Tinte violeta de la luz UV.
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const u = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, R);
    u.addColorStop(0, 'rgba(120,60,200,0.22)');
    u.addColorStop(1, 'rgba(120,60,200,0)');
    ctx.fillStyle = u;
    ctx.beginPath();
    ctx.arc(p.x, p.y, R, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function pin(ctx, x, y, t) {
    ctx.globalAlpha = 0.5 + 0.3 * Math.sin(t * 4);
    ctx.fillStyle = ACCENT;
    ctx.beginPath();
    ctx.arc(x, y, 10, 0, Math.PI * 2);
    ctx.fill();
    D.text(ctx, '?', x, y + 6, { size: 15, weight: 800, color: '#140d12', align: 'center' });
    ctx.globalAlpha = 1;
  }

  function decoyGlow(ctx, dc, t, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha * (0.6 + 0.3 * Math.sin(t * 5));
    ctx.shadowColor = '#bfe8ff';
    ctx.shadowBlur = 16;
    ctx.fillStyle = '#d8f0ff';
    ctx.beginPath();
    ctx.ellipse(dc.x, dc.y, 12, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Monstruos de contaminación al estilo Halloween del afiche.
  function monster(ctx, type, x, y, s, t, alpha = 1) {
    const hz = M.HAZARDS[type];
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y + Math.sin(t * 3 + x) * 3);
    ctx.shadowColor = hz.color;
    ctx.shadowBlur = 22;
    ctx.fillStyle = hz.color;
    ctx.beginPath();
    if (type === 'vidrio') {
      ctx.moveTo(0, -s * 1.2);
      ctx.lineTo(s * 0.8, -s * 0.1);
      ctx.lineTo(s * 0.45, s * 0.9);
      ctx.lineTo(-s * 0.5, s * 0.8);
      ctx.lineTo(-s * 0.9, -s * 0.2);
      ctx.closePath();
    } else if (type === 'sarro') {
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2;
        const rr = s * (0.8 + (i % 3) * 0.15);
        ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath();
    } else if (type === 'levadura') {
      for (let i = 0; i < 24; i++) {
        const a = (i / 24) * Math.PI * 2;
        const rr = s * (i % 2 ? 0.75 : 1.05);
        ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath();
    } else {
      ctx.arc(0, -s * 0.1, s * 0.85, Math.PI, 0);
      ctx.lineTo(s * 0.85, s * 0.6);
      for (let i = 0; i < 4; i++) {
        const px = s * 0.85 - (i + 0.5) * (s * 1.7) / 4;
        ctx.quadraticCurveTo(px + s * 0.2, s * (0.6 + 0.4 * Math.sin(t * 4 + i)), px - s * 0.2, s * 0.6);
      }
      ctx.closePath();
    }
    ctx.fill();
    ctx.shadowBlur = 0;
    // Ojos y boca.
    ctx.fillStyle = '#140d12';
    ctx.beginPath();
    ctx.ellipse(-s * 0.3, -s * 0.15, s * 0.16, s * 0.22, 0, 0, Math.PI * 2);
    ctx.ellipse(s * 0.3, -s * 0.15, s * 0.16, s * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, s * 0.25, s * 0.25, 0, Math.PI);
    ctx.fill();
    ctx.restore();
  }

  function drawToolModal(s, ctx, t) {
    const h = s.target;
    const hz = M.HAZARDS[h.type];
    const a = D.modal(ctx, `${hz.name.toUpperCase()} en la ${hz.where}`, H_TOOL, { accent: ACCENT, hint: [[{ key: 'Esc', pad: 'b' }, 'salir']] });
    monster(ctx, h.type, a.x + 30, a.y + 22, 20, t, 1);
    if (s.tool.phase === 'choose') {
      D.text(ctx, '¿Con qué lo limpias?', a.x + 70, a.y + 18, { size: 20, weight: 800 });
      D.hints(
        ctx,
        [
          [{ key: '← →', pad: 'dpadLR' }, 'elegir'],
          [{ key: 'ESPACIO', pad: 'a' }, 'usar'],
          [{ key: '1-4', pad: ['lb', 'rb', 'lt', 'rt'] }, 'directo'],
        ],
        a.x + 70,
        a.y + 44,
        { size: 11, gap: 14, ink: T.dim }
      );
      toolCards().forEach((c, i) => {
        const tl = M.TOOLS[c.id];
        const sel = s.tool.sel === i;
        const shake = sel && s.tool.shake > 0 ? Math.sin(t * 60) * 5 : 0;
        ctx.save();
        ctx.translate(shake, 0);
        D.panel(ctx, c.x, c.y, c.w, c.h, { fill: sel ? '#2a1a3a' : '#1c1420', edge: sel ? (s.tool.shake > 0 ? T.red : ACCENT) : '#3a2a44', radius: 10, glow: sel ? ACCENT : null });
        toolIcon(ctx, c.id, c.x + c.w / 2, c.y + 42, tl.color);
        D.control(ctx, { key: String(i + 1), pad: ['lb', 'rb', 'lt', 'rt'][i] }, c.x + 6, c.y + 18, { size: 12, color: sel ? ACCENT : '#5a4a66' });
        D.text(ctx, tl.name, c.x + c.w / 2, c.y + 88, { size: 15, weight: 700, align: 'center' });
        D.text(ctx, tl.tag, c.x + c.w / 2, c.y + 106, { size: 13, weight: 600, color: tl.color, align: 'center' });
        if (s.cfg.showUse) D.text(ctx, tl.use, c.x + c.w / 2, c.y + 123, { size: 11, color: T.dim, align: 'center' });
        ctx.restore();
      });
    } else {
      const tl = M.TOOLS[hz.tool];
      D.text(ctx, `${tl.name}: mantén`, a.x + 70, a.y + 26, { size: 20, weight: 800, color: tl.color });
      ctx.font = D.font(20, 800);
      const tw = ctx.measureText(`${tl.name}: mantén`).width;
      const cw = D.control(ctx, { key: 'ESPACIO', pad: 'a' }, a.x + 80 + tw, a.y + 19, { size: 15, color: tl.color });
      D.text(ctx, 'para aplicar', a.x + 90 + tw + cw, a.y + 26, { size: 20, weight: 800, color: tl.color });
      D.ring(ctx, a.x + a.w / 2, a.y + 150, 54, s.tool.progress / 1.1, tl.color, 12);
      toolIcon(ctx, hz.tool, a.x + a.w / 2, a.y + 150, tl.color);
    }
  }

  function toolIcon(ctx, id, x, y, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = color;
    ctx.strokeStyle = color;
    ctx.lineWidth = 4;
    if (id === 'escoba') {
      ctx.beginPath();
      ctx.moveTo(-14, -22);
      ctx.lineTo(6, 8);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, 6);
      ctx.lineTo(18, 6);
      ctx.lineTo(22, 22);
      ctx.lineTo(-6, 22);
      ctx.closePath();
      ctx.fill();
    } else if (id === 'espuma') {
      for (const [dx, dy, r] of [[-10, 6, 10], [6, 0, 12], [12, 14, 8], [-4, -12, 8]]) {
        ctx.beginPath();
        ctx.arc(dx, dy, r, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (id === 'peracetico') {
      D.roundRect(ctx, -12, -10, 24, 32, 6);
      ctx.fill();
      ctx.fillRect(-5, -20, 10, 10);
      ctx.fillStyle = '#140d12';
      ctx.fillRect(-8, 2, 16, 4);
    } else {
      ctx.beginPath();
      ctx.moveTo(0, -22);
      ctx.quadraticCurveTo(18, 4, 0, 22);
      ctx.quadraticCurveTo(-18, 4, 0, -22);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawSidebar(s, ctx, t) {
    D.sidebar(ctx, 'FOCOS DE CONTAMINACIÓN');
    const x = D.VIEW.mapWidth + 18;
    s.hazards.forEach((h, i) => {
      const y = 100 + i * 38;
      const hz = M.HAZARDS[h.type];
      ctx.fillStyle = h.found ? D.T.okDark : '#1c1420';
      D.roundRect(ctx, x - 4, y, 290, 34, 8);
      ctx.fill();
      if (h.found || h.seen) monster(ctx, h.type, x + 16, y + 17, 10, t, h.found ? 1 : 0.6);
      else D.text(ctx, '?', x + 16, y + 24, { size: 20, weight: 800, color: '#5a4a66', align: 'center' });
      D.text(ctx, h.found ? hz.name : h.seen ? `${hz.name} (sin limpiar)` : '???', x + 38, y + 23, { size: 15, weight: 700, color: h.found ? T.ok : h.seen ? T.warn : '#6a5a76' });
      if (h.found) D.text(ctx, '✔', x + 276, y + 24, { size: 17, weight: 800, color: T.ok, align: 'right' });
    });
    D.text(ctx, 'HERRAMIENTAS', x, 306, { size: 13, weight: 700, color: T.dim });
    M.TOOL_ORDER.forEach((id, i) => {
      const tl = M.TOOLS[id];
      const y = 328 + i * 28;
      const w = D.control(ctx, { key: String(i + 1), pad: ['lb', 'rb', 'lt', 'rt'][i] }, x, y, { size: 11, color: tl.color });
      D.text(ctx, tl.name, x + w + 8, y + 5, { size: 14, weight: 700 });
      D.text(ctx, s.cfg.showUse ? tl.use : tl.tag, x + 286, y + 5, { size: 11, color: tl.color, align: 'right' });
    });
    const fact = s.fact && { kind: 'paper', label: `SABÍAS QUE… · ${s.fact.title}`, text: '', sub: s.fact.text, life: s.fact.life, max: s.fact.max };
    B.dock(ctx, D.dockRect(440), { bubble: s.bubble, notices: [fact, s.banner], t });
    D.footer(ctx, [
      [{ key: 'WASD', pad: 'lstick' }, 'mover'],
      [{ key: 'E', pad: 'x' }, 'limpiar'],
      [{ key: '1-4', pad: ['lb', 'rt'] }, 'herramienta'],
    ]);
  }

  function report(s) {
    const st = s.stats;
    const all = st.found >= TARGETS;
    let score = st.found * 16 + (all ? 10 + Math.round((s.timeLeft / s.duration) * 10) : 0) - st.errors * 6;
    score = Math.max(0, Math.min(100, score));
    const rank = D.rankFor(score);
    return {
      score,
      rank,
      headline: all ? 'Zona segura: los 5 focos de contaminación eliminados' : `${TARGETS - st.found} foco(s) de contaminación siguen en la línea`,
      rows: [
        ['Alertas de riesgo encontradas', `${st.found} de ${TARGETS}`, all ? T.ok : T.warn],
        ['Herramienta correcta al primer intento', `${st.firstTry} de ${st.found}`, st.firstTry === st.found ? T.ok : T.warn],
        ['Errores de herramienta', String(st.errors), st.errors ? T.red : T.ok],
        ['Falsas alarmas revisadas', String(st.decoys), T.ink],
        ['Puntuación de Calidad', `${score}/100`, D.rankColor(rank)],
      ],
      mistakes: s.bubble.log.slice(),
    };
  }

  function icon(ctx, cx, cy, size, t) {
    // Linterna UV iluminando un fantasma de biofilm.
    ctx.save();
    const g = ctx.createRadialGradient(cx + size * 0.2, cy, 0, cx + size * 0.2, cy, size * 0.7);
    g.addColorStop(0, 'rgba(164,107,255,0.6)');
    g.addColorStop(1, 'rgba(164,107,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx + size * 0.2, cy, size * 0.7, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    monster(ctx, 'biofilm', cx + size * 0.25, cy, size * 0.28, t, 1);
    ctx.save();
    ctx.translate(cx - size * 0.45, cy + size * 0.2);
    ctx.rotate(-0.3);
    ctx.fillStyle = '#3b3431';
    D.roundRect(ctx, -size * 0.2, -8, size * 0.4, 16, 4);
    ctx.fill();
    ctx.fillStyle = ACCENT;
    ctx.fillRect(size * 0.18, -9, 6, 18);
    ctx.restore();
  }

  PF.Games = PF.Games || [];
  PF.Games.push({
    id: 'hunter',
    order: 3,
    title: 'El Cazador de Riesgos',
    subtitle: 'Recorrido UV de 60 segundos',
    tagline: 'Linterna UV en mano: encuentra 5 focos de contaminación invisibles.',
    accent: ACCENT,
    icon,
    howTo: [
      'La línea está a oscuras: tu linterna UV revela lo que no se ve.',
      'Busca 5 "monstruos": vidrio roto, sarro, levadura seca y biofilm.',
      'Acércate, pulsa E y elige la herramienta correcta para limpiarlo.',
      'Cada limpieza muestra una ficha "Sabías que" del manual.',
    ],
    touch: { stick: true, main: [{ pad: 'a', label: 'Aplicar' }, { pad: 'x', label: 'Limpiar' }, { pad: 'b', label: 'Salir' }], aux: [{ pad: 'lb', label: '' }, { pad: 'rb', label: '' }, { pad: 'lt', label: '' }, { pad: 'rt', label: '' }] },
    controls: [
      ['WASD', 'moverse', 'lstick'],
      ['E', 'limpiar / revisar', 'x'],
      ['1-4', 'herramienta', ['lb', 'rb', 'lt', 'rt']],
      ['ESPACIO', 'aplicar', 'a'],
    ],
    difficulties: {
      facil: ['Linterna grande y flecha hacia el foco más cercano', 'Las herramientas dicen para qué sirven', 'Sin penalización de tiempo'],
      normal: ['Linterna mediana, sin flecha guía', '2 falsas alarmas que hacen perder tiempo', 'Herramienta equivocada: −2 s'],
      dificil: ['Linterna pequeña que parpadea', '4 falsas alarmas y sin marcas de lo ya visto', 'Herramienta equivocada: −4 s'],
    },
    create,
    monster,
  });
})();
</script>
    <script>
// Línea en Paro: Decisiones Bajo Presión.
// La línea se detuvo X horas: aplica el plan de reacción correcto antes de arrancar.
// Arrancar sin el protocolo completo = cerveza contaminada.
(function () {
  'use strict';
  const PF = globalThis.PF || (globalThis.PF = {});
  const D = PF.Draw;
  const W = PF.World;
  const B = PF.Bubble;
  const M = PF.Manual;
  const T = D.T;
  const ACCENT = '#ffb347';

  const DIFF = {
    facil: { lives: 3, showProtocol: true, tab: true, timeMul: 0.8, sabotage: [12, 16], penalty: 0, bigToast: false },
    normal: { lives: 2, showProtocol: false, tab: true, timeMul: 1, sabotage: [7, 11], penalty: 2, bigToast: false },
    dificil: { lives: 1, showProtocol: false, tab: false, timeMul: 1.2, sabotage: [4, 7], penalty: 3, bigToast: true },
  };

  const STATIONS = {
    tazon: { id: 'tazon', name: 'TAZÓN', rect: { x: 100, y: 112, w: 180, h: 100 }, spot: { x: 190, y: 244 } },
    agua: { id: 'agua', name: 'AGUA CALIENTE', rect: { x: 400, y: 112, w: 160, h: 90 }, spot: { x: 480, y: 236 } },
    externa: { id: 'externa', name: 'LIMPIEZA EXTERNA', rect: { x: 690, y: 112, w: 190, h: 90 }, spot: { x: 785, y: 236 } },
    cip: { id: 'cip', name: 'PANEL CIP', rect: { x: 100, y: 580, w: 180, h: 100 }, spot: { x: 190, y: 548 } },
    plan: { id: 'plan', name: 'PLAN DE REACCIÓN', rect: { x: 410, y: 612, w: 140, h: 70 }, spot: { x: 480, y: 580 } },
    arranque: { id: 'arranque', name: 'ARRANQUE', rect: { x: 690, y: 590, w: 190, h: 90 }, spot: { x: 785, y: 558 } },
  };
  const OBSTACLES = [{ x: 300, y: 340, w: 360, h: 80, kind: 'line' }];
  const WORLD = W.make({ solids: W.solidsOf(OBSTACLES, STATIONS), stations: STATIONS, start: { x: 480, y: 470 } });
  const STEP_AT = { tazon: 'vaciado', agua: 'interna', externa: 'externa' };
  const START_HOLD = 0.8;
  const H_MODAL = 300;

  function create(diffId = 'normal', opts = {}) {
    const cfg = DIFF[diffId] || DIFF.normal;
    const s = {
      id: 'stop',
      diff: diffId,
      cfg,
      rng: D.makeRng(opts.seed),
      duration: 60,
      timeLeft: 60,
      time: 0,
      over: false,
      gameOver: false,
      endT: 0,
      lives: cfg.lives,
      player: W.newPlayer(WORLD),
      operating: null,
      action: null,
      book: false,
      bubble: B.create(),
      floats: [],
      banner: null,
      round: null,
      lastHours: null,
      toast: null,
      toastT: 0,
      stats: { lotes: 0, correct: 0, errors: 0, contaminated: 0, resisted: 0, rounds: 0 },
    };
    s.toastT = between(s.rng, cfg.sabotage);
    newRound(s);
    s.world = WORLD;
    s.update = (dt, input) => update(s, dt, input);
    s.draw = (r) => draw(s, r);
    s.report = () => report(s);
    return s;
  }

  function between(rng, [a, b]) {
    return a + rng() * (b - a);
  }

  function newRound(s, forced = null) {
    let rule;
    let hours;
    do {
      const x = s.rng();
      rule = forced || (x < 0.5 ? M.STOP_RULES[0] : x < 0.8 ? M.STOP_RULES[1] : M.STOP_RULES[2]);
      hours = rule.hours[Math.floor(s.rng() * rule.hours.length)];
    } while (hours === s.lastHours && !forced);
    s.lastHours = hours;
    s.round = { hours, rule, done: [], nextT: 0 };
    s.stats.rounds++;
    s.banner = D.makeBanner(`LÍNEA DETENIDA HACE ${M.hoursLabel(hours).toUpperCase()}`, ACCENT, '¿Qué dice el plan de reacción?', 2.4);
    D.sfx('alarm');
  }

  function missingSteps(s) {
    return s.round.rule.steps.filter((x) => !s.round.done.includes(x));
  }

  function mistake(s, msg) {
    B.say(s.bubble, msg);
    s.stats.errors++;
    if (s.cfg.penalty) {
      s.timeLeft -= s.cfg.penalty;
      D.floatAdd(s.floats, s.player.x, s.player.y - 70, `−${s.cfg.penalty} s`, T.red, 20);
    }
  }

  // ------------------------------------------------------------ Actualización

  function update(s, dt, input) {
    if (s.over) return;
    s.time += dt;
    B.update(s.bubble, dt);
    s.floats = D.floatsUpdate(s.floats, dt);
    D.tickBanner(s, dt);
    if (s.endT > 0) {
      s.endT -= dt;
      if (s.endT <= 0) s.over = true;
      return;
    }
    s.timeLeft -= dt;
    if (s.timeLeft <= 0) {
      s.timeLeft = 0;
      s.over = true;
      return;
    }
    if (s.round.nextT > 0) {
      s.round.nextT -= dt;
      if (s.round.nextT <= 0) newRound(s);
      return;
    }
    updateToast(s, dt, input);
    if (s.round.nextT > 0 || s.endT > 0) return;

    const P = input.pressed;
    if (P.includes('tab')) {
      if (s.cfg.tab) s.book = !s.book;
      else B.say(s.bubble, 'En difícil el plan no va en el bolsillo: consúltalo en el tablero PLAN DE REACCIÓN.', { kind: 'tip' });
    }
    if (s.book) {
      if (P.includes('cancel') || P.includes('interact')) s.book = false;
      return;
    }
    if (s.operating) {
      if (P.includes('interact') || P.includes('cancel')) {
        s.operating = null;
        return;
      }
      updateStation(s, dt, input);
      return;
    }
    W.move(WORLD, s.player, input, dt);
    if (P.includes('interact')) {
      const st = W.nearest(WORLD, s.player);
      if (!st) return;
      if (st.id === 'plan') {
        s.book = true;
        return;
      }
      s.operating = st.id;
      s.action = { progress: 0, choice: null, running: false };
      D.sfx('enter');
    }
  }

  // Notificaciones de presión ("saboteadores").
  function updateToast(s, dt, input) {
    const P = input.pressed;
    const pp = (input.pad && input.pad.pressed) || [];
    if (s.toast) {
      s.toast.life -= dt;
      // Teclado: Y / X. Mando: L2-LT / R2-RT (no chocan con los botones del resto del juego).
      if (P.includes('y') || pp.includes('lt')) {
        s.toast = null;
        startLine(s, true);
        return;
      }
      if (P.includes('x') || pp.includes('rt') || s.toast.life <= 0) {
        s.toast = null;
        s.stats.resisted++;
        D.floatAdd(s.floats, s.player.x, s.player.y - 60, 'Presión resistida', T.ok, 15);
      }
      return;
    }
    s.toastT -= dt;
    if (s.toastT <= 0) {
      s.toastT = between(s.rng, s.cfg.sabotage);
      s.toast = { text: M.SABOTAGE[Math.floor(s.rng() * M.SABOTAGE.length)], life: 4.5, max: 4.5 };
      D.sfx('denied');
    }
  }

  function stepFor(s, stationId) {
    if (STEP_AT[stationId]) return STEP_AT[stationId];
    if (stationId === 'cip') return s.action.choice;
    return null;
  }

  function updateStation(s, dt, input) {
    const id = s.operating;
    const P = input.pressed;
    const a = s.action;
    if (id === 'arranque') {
      if (input.space) a.progress += dt;
      else a.progress = Math.max(0, a.progress - dt * 2);
      if (a.progress >= START_HOLD) {
        s.operating = null;
        startLine(s, false);
      }
      return;
    }
    if (id === 'cip' && !a.choice) {
      let pick = null;
      if (P.includes('1')) pick = 'cipIntermedio';
      if (P.includes('2')) pick = 'cipCompleto';
      for (const c of input.clicks || []) {
        const opt = cipOptions().find((o) => c.x >= o.x && c.x <= o.x + o.w && c.y >= o.y && c.y <= o.y + o.h);
        if (opt) pick = opt.step;
      }
      if (!pick) return;
      if (!s.round.rule.steps.includes(pick)) {
        mistake(s, M.stopStepError(s.round.rule, pick));
        return;
      }
      a.choice = pick;
    }
    const step = stepFor(s, id);
    if (!step) return;
    if (s.round.done.includes(step)) return;
    if (!a.running) {
      if (!(P.includes('space') || input.space)) return;
      if (!s.round.rule.steps.includes(step)) {
        mistake(s, M.stopStepError(s.round.rule, step));
        s.operating = null;
        return;
      }
      a.running = true;
    }
    if (input.space) a.progress += dt;
    const need = M.STOP_STEPS[step].time * s.cfg.timeMul;
    if (a.progress >= need) {
      s.round.done.push(step);
      s.stats.correct++;
      D.floatAdd(s.floats, s.player.x, s.player.y - 60, `✔ ${M.STOP_STEPS[step].short}`, T.ok, 17);
      D.sfx('resolved');
      s.operating = null;
    }
  }

  function startLine(s, rushed) {
    const missing = missingSteps(s);
    if (!missing.length) {
      s.stats.lotes++;
      s.banner = D.makeBanner('LOTE SEGURO', T.ok, `Protocolo de ${s.round.rule.range} completo · línea en marcha`, 1.6);
      D.sfx('end');
      s.round.nextT = 1.6;
      return;
    }
    s.stats.contaminated++;
    s.lives--;
    B.say(s.bubble, (rushed ? 'Cediste a la presión. ' : '') + M.contaminationMessage(s.round.rule, missing), { life: 5 });
    D.sfx('lineStop');
    if (s.lives <= 0) {
      s.gameOver = true;
      s.banner = D.makeBanner('CERVEZA CONTAMINADA', T.red, 'Fin del turno: el lote se va a descarte', 2.6);
      s.endT = 2.6;
    } else {
      s.banner = D.makeBanner('CERVEZA CONTAMINADA', T.red, `Te quedan ${s.lives} ${s.lives === 1 ? 'vida' : 'vidas'}`, 2.2);
      s.round.nextT = 2.4;
    }
  }

  function cipOptions() {
    const a = D.modalArea(H_MODAL);
    return [
      { step: 'cipIntermedio', key: '1', x: a.x, y: a.y + 40, w: a.w / 2 - 10, h: 110 },
      { step: 'cipCompleto', key: '2', x: a.x + a.w / 2 + 10, y: a.y + 40, w: a.w / 2 - 10, h: 110 },
    ];
  }

  // ------------------------------------------------------------ Dibujo

  function draw(s, r) {
    const ctx = r.ctx;
    const t = r.t;
    D.begin(r);
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, D.VIEW.hud, D.VIEW.mapWidth, D.VIEW.height - D.VIEW.hud);
    ctx.clip();
    D.floor(ctx);
    drawLine(ctx, t);
    const near = s.operating ? null : W.nearest(WORLD, s.player);
    for (const st of Object.values(STATIONS)) {
      const step = STEP_AT[st.id];
      const done = step ? s.round.done.includes(step) : st.id === 'cip' && s.round.done.some((x) => x.startsWith('cip'));
      const required = s.cfg.showProtocol && ((step && s.round.rule.steps.includes(step)) || (st.id === 'cip' && s.round.rule.steps.some((x) => x.startsWith('cip'))));
      const state = done ? 'done' : required ? 'next' : st.id === 'arranque' && !missingSteps(s).length ? 'next' : null;
      D.station(ctx, st, { t, near: near === st, state });
      ART[st.id](s, ctx, st, t);
    }
    D.player(ctx, s.player, { t });
    if (near && !s.operating) D.prompt(ctx, s.player, near.id === 'plan' ? 'consultar' : near.name.toLowerCase(), ACCENT);
    D.floatsDraw(ctx, s.floats);
    if (s.operating) drawModal(s, ctx);
    if (s.book) drawPlan(s, ctx);
    if (!s.operating && !s.book) B.marker(ctx, s.bubble, s.player, t);
    ctx.restore();

    D.hud(ctx, t, {
      title: 'LÍNEA EN PARO',
      diff: s.diff,
      timeLeft: s.timeLeft,
      duration: s.duration,
      accent: ACCENT,
      stats: [
        { label: 'Lotes seguros', value: s.stats.lotes, color: T.ok, width: 150 },
        { label: 'Contaminados', value: s.stats.contaminated, color: s.stats.contaminated ? T.red : T.ink, width: 150 },
      ],
    });
    drawSidebar(s, ctx, t);
  }

  function drawLine(ctx, t) {
    const o = OBSTACLES[0];
    ctx.fillStyle = '#2b2320';
    D.roundRect(ctx, o.x, o.y, o.w, o.h, 8);
    ctx.fill();
    ctx.fillStyle = '#3e3430';
    for (let x = o.x + 8; x < o.x + o.w - 8; x += 24) ctx.fillRect(x, o.y + 14, 14, o.h - 28);
    for (let i = 0; i < 6; i++) {
      ctx.fillStyle = '#7a4a1e';
      ctx.beginPath();
      ctx.arc(o.x + 40 + i * 56, o.y + o.h / 2, 13, 0, Math.PI * 2);
      ctx.fill();
    }
    D.text(ctx, 'LÍNEA DE ENVASADO — DETENIDA', o.x + o.w / 2, o.y - 10, { size: 14, weight: 800, color: Math.floor(t * 2) % 2 ? T.red : T.dim, align: 'center' });
  }

  const ART = {
    tazon(s, ctx, st) {
      const cx = st.rect.x + st.rect.w / 2;
      const cy = st.rect.y + st.rect.h / 2;
      ctx.fillStyle = '#5a5250';
      ctx.beginPath();
      ctx.ellipse(cx, cy, 60, 32, 0, 0, Math.PI * 2);
      ctx.fill();
      const full = !s.round.done.includes('vaciado');
      ctx.fillStyle = full ? '#e9a23b' : '#2b2320';
      ctx.beginPath();
      ctx.ellipse(cx, cy, 48, 22, 0, 0, Math.PI * 2);
      ctx.fill();
    },
    agua(s, ctx, st, t) {
      const cx = st.rect.x + st.rect.w / 2;
      ctx.fillStyle = '#ff6b4a';
      D.roundRect(ctx, cx - 30, st.rect.y + 18, 60, 52, 10);
      ctx.fill();
      for (let i = 0; i < 3; i++) {
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        const x = cx - 14 + i * 14;
        ctx.moveTo(x, st.rect.y + 14);
        ctx.quadraticCurveTo(x + 6 * Math.sin(t * 4 + i), st.rect.y + 6, x, st.rect.y - 2);
        ctx.stroke();
      }
      D.text(ctx, '85°', cx, st.rect.y + 52, { size: 16, weight: 800, color: '#fff', align: 'center' });
    },
    externa(s, ctx, st) {
      const cx = st.rect.x + st.rect.w / 2;
      ctx.fillStyle = '#4aa3ff';
      for (const [dx, dy, rr] of [[-20, 50, 14], [0, 40, 18], [22, 52, 13], [8, 62, 10]]) {
        ctx.beginPath();
        ctx.arc(cx + dx, st.rect.y + dy, rr, 0, Math.PI * 2);
        ctx.fill();
      }
    },
    cip(s, ctx, st) {
      ctx.fillStyle = '#081016';
      D.roundRect(ctx, st.rect.x + 14, st.rect.y + 14, st.rect.w - 28, 50, 4);
      ctx.fill();
      D.text(ctx, 'INTERMEDIO · COMPLETO', st.rect.x + st.rect.w / 2, st.rect.y + 44, { size: 12, weight: 700, color: T.ok, align: 'center' });
    },
    plan(s, ctx, st) {
      ctx.fillStyle = '#f2e3c6';
      D.roundRect(ctx, st.rect.x + 14, st.rect.y + 10, st.rect.w - 28, st.rect.h - 20, 4);
      ctx.fill();
      ctx.strokeStyle = '#7a3010';
      ctx.lineWidth = 2;
      ctx.strokeRect(st.rect.x + 30, st.rect.y + 20, 30, 14);
      ctx.strokeRect(st.rect.x + 80, st.rect.y + 20, 30, 14);
      ctx.beginPath();
      ctx.moveTo(st.rect.x + 60, st.rect.y + 27);
      ctx.lineTo(st.rect.x + 80, st.rect.y + 27);
      ctx.stroke();
      D.text(ctx, 'p. 17', st.rect.x + st.rect.w / 2, st.rect.y + 52, { size: 12, weight: 700, color: '#7a3010', align: 'center' });
    },
    arranque(s, ctx, st, t) {
      const cx = st.rect.x + st.rect.w / 2;
      const cy = st.rect.y + st.rect.h / 2;
      ctx.fillStyle = '#3a0d08';
      ctx.beginPath();
      ctx.arc(cx, cy, 32, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = Math.floor(t * 3) % 2 ? '#ff3b2a' : '#c0281a';
      ctx.beginPath();
      ctx.arc(cx, cy, 24, 0, Math.PI * 2);
      ctx.fill();
      D.text(ctx, 'START', cx, cy + 5, { size: 13, weight: 800, color: '#fff', align: 'center' });
    },
  };

  function drawModal(s, ctx) {
    const id = s.operating;
    const st = STATIONS[id];
    const a = D.modal(ctx, st.name, H_MODAL, { accent: ACCENT });
    D.text(ctx, `Paro de ${M.hoursLabel(s.round.hours)}`, a.x + a.w, a.y + 4, { size: 15, weight: 700, color: ACCENT, align: 'right' });
    if (id === 'arranque') {
      const missing = missingSteps(s);
      D.text(ctx, '¿Arrancar la línea?', a.x, a.y + 10, { size: 24, weight: 800 });
      D.paragraph(ctx, 'Antes de arrancar, revisa que el protocolo del plan de reacción esté completo. Si falta algo, la cerveza sale contaminada.', a.x, a.y + 44, a.w, { size: 15, color: T.dim });
      if (s.cfg.showProtocol) D.text(ctx, missing.length ? `Falta: ${missing.map((x) => M.STOP_STEPS[x].short).join(', ')}` : '✔ Protocolo completo', a.x, a.y + 110, { size: 16, weight: 700, color: missing.length ? T.red : T.ok });
      D.progressBar(ctx, a.x, a.y + 140, a.w, 26, s.action.progress / START_HOLD, T.red);
      D.hints(ctx, [[{ key: 'ESPACIO', pad: 'a' }, 'mantén para ARRANCAR']], a.x + a.w / 2, a.y + 153, { size: 13, align: 'center', ink: '#fff', color: '#fff' });
      return;
    }
    if (id === 'cip' && !s.action.choice) {
      D.text(ctx, 'Elige el programa de limpieza', a.x, a.y + 10, { size: 20, weight: 800 });
      for (const o of cipOptions()) {
        D.panel(ctx, o.x, o.y, o.w, o.h, { fill: '#22160f', edge: ACCENT, radius: 10 });
        const kw = D.control(ctx, { key: o.key, pad: o.key === '1' ? 'lb' : 'rb' }, o.x + 14, o.y + 30, { size: 16, color: ACCENT });
        D.text(ctx, M.STOP_STEPS[o.step].label, o.x + 24 + kw, o.y + 37, { size: 22, weight: 800 });
        D.text(ctx, `${M.fmtNum(M.STOP_STEPS[o.step].time * s.cfg.timeMul, 1)} s de limpieza`, o.x + 24 + kw, o.y + 64, { size: 14, color: T.dim });
      }
      D.text(ctx, 'Pulsa el botón del programa (o haz clic)', a.x + a.w / 2, a.y + 190, { size: 14, color: T.dim, align: 'center' });
      return;
    }
    const step = stepFor(s, id);
    const info = M.STOP_STEPS[step];
    const done = s.round.done.includes(step);
    D.text(ctx, info.label, a.x, a.y + 14, { size: 24, weight: 800 });
    if (done) {
      D.text(ctx, '✔ Hecho para este paro', a.x, a.y + 60, { size: 20, weight: 700, color: T.ok });
      return;
    }
    const need = info.time * s.cfg.timeMul;
    D.progressBar(ctx, a.x, a.y + 60, a.w, 26, s.action.progress / need, T.ok);
    if (s.action.running) D.text(ctx, 'Limpiando…', a.x + a.w / 2, a.y + 79, { size: 16, weight: 800, color: '#fff', align: 'center' });
    else D.hints(ctx, [[{ key: 'ESPACIO', pad: 'a' }, 'mantén para hacerlo']], a.x + a.w / 2, a.y + 73, { size: 13, align: 'center', ink: '#fff', color: '#fff' });
    D.paragraph(ctx, '¿Seguro que este paso toca? Si no está en el plan de reacción para este paro, solo retrasa la producción.', a.x, a.y + 122, a.w, { size: 14, color: T.dim });
  }

  function drawPlan(s, ctx) {
    const x = 70;
    const y = 104;
    const w = 820;
    const h = 420;
    ctx.fillStyle = 'rgba(8,4,3,0.7)';
    ctx.fillRect(0, D.VIEW.hud, D.VIEW.mapWidth, D.VIEW.height - D.VIEW.hud);
    D.panel(ctx, x, y, w, h, { fill: '#f2e3c6', edge: T.brass, radius: 10 });
    D.text(ctx, 'PLAN DE REACCIÓN FRENTE A PARADAS DE LÍNEA', x + 24, y + 38, { size: 24, weight: 800, color: '#3a1d0c' });
    D.text(ctx, 'manual, página 17', x + w - 24, y + 38, { size: 14, color: '#7a5030', align: 'right' });
    // Rombo de decisión.
    const dx = x + 120;
    const dy = y + 220;
    ctx.fillStyle = '#ffd9a8';
    ctx.strokeStyle = '#7a3010';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(dx, dy - 70);
    ctx.lineTo(dx + 90, dy);
    ctx.lineTo(dx, dy + 70);
    ctx.lineTo(dx - 90, dy);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    D.text(ctx, '¿Cuánto', dx, dy - 8, { size: 17, weight: 800, color: '#3a1d0c', align: 'center' });
    D.text(ctx, 'lleva parada?', dx, dy + 14, { size: 17, weight: 800, color: '#3a1d0c', align: 'center' });
    M.STOP_RULES.forEach((rule, i) => {
      const by = y + 80 + i * 110;
      const cur = rule === s.round.rule && s.cfg.showProtocol;
      ctx.strokeStyle = '#7a3010';
      ctx.beginPath();
      ctx.moveTo(dx + 90, dy);
      ctx.lineTo(x + 290, by + 45);
      ctx.stroke();
      D.panel(ctx, x + 290, by, w - 320, 90, { fill: cur ? '#ffcf8a' : '#fff4e2', edge: '#7a3010', radius: 8 });
      D.text(ctx, rule.range, x + 306, by + 28, { size: 20, weight: 800, color: '#c4501a' });
      D.paragraph(ctx, rule.steps.map((st) => M.STOP_STEPS[st].label).join(' + '), x + 306, by + 54, w - 350, { size: 16, weight: 700, color: '#2a170d', maxLines: 2 });
    });
    D.hints(ctx, [[s.cfg.tab ? { key: 'TAB', pad: 'y' } : { key: 'E', pad: 'b' }, 'cerrar · el reloj sigue corriendo']], x + w / 2, y + h - 20, { size: 13, align: 'center', ink: '#7a5030', color: '#c4501a' });
  }

  function drawSidebar(s, ctx, t) {
    D.sidebar(ctx, 'AVISO DE PARO');
    const x = D.VIEW.mapWidth + 18;
    D.panel(ctx, x - 4, 100, 290, 64, { fill: '#2a170d', edge: ACCENT, radius: 8 });
    D.text(ctx, 'Línea detenida hace', x + 8, 118, { size: 13, color: T.dim });
    D.text(ctx, M.hoursLabel(s.round.hours), x + 8, 151, { size: 28, weight: 800, color: ACCENT });

    D.text(ctx, s.cfg.showProtocol ? 'PROTOCOLO A SEGUIR' : 'PASOS REALIZADOS', x, 186, { size: 13, weight: 700, color: T.dim });
    let y = 194;
    if (s.cfg.showProtocol) {
      for (const st of s.round.rule.steps) {
        D.checkRow(ctx, x - 4, y, M.STOP_STEPS[st].short, s.round.done.includes(st) ? 'done' : 'next', { width: 290 });
        y += 38;
      }
      D.checkRow(ctx, x - 4, y, 'Arrancar la línea', missingSteps(s).length ? 'todo' : 'next', { width: 290 });
    } else {
      if (!s.round.done.length) D.text(ctx, 'Ninguno todavía.', x, y + 18, { size: 14, color: T.faint });
      for (const st of s.round.done) {
        D.checkRow(ctx, x - 4, y, M.STOP_STEPS[st].short, 'done', { width: 290 });
        y += 38;
      }
      const hy = Math.max(y + 22, 240);
      D.text(ctx, '¿No sabes qué toca?', x, hy, { size: 14, weight: 700, color: T.warn });
      if (s.cfg.tab) D.hints(ctx, [[{ key: 'TAB', pad: 'y' }, 'consulta el plan']], x, hy + 22, { size: 12, ink: T.warn });
      else D.text(ctx, 'Ve al tablero PLAN DE REACCIÓN.', x, hy + 22, { size: 14, color: T.warn });
    }

    D.text(ctx, 'VIDAS', x, 364, { size: 13, weight: 700, color: T.dim });
    for (let i = 0; i < s.cfg.lives; i++) D.pumpkin(ctx, x + 80 + i * 46, 358, 22, i < s.lives);
    D.text(ctx, `Presiones resistidas: ${s.stats.resisted}`, x, 396, { size: 14, weight: 600, color: T.ok });
    D.text(ctx, 'Arrancar sin protocolo = lote contaminado', x, 416, { size: 11, color: T.faint });

    const toast = s.toast && {
      kind: 'toast',
      label: '⚠ NOTIFICACIÓN',
      text: s.toast.text,
      color: T.red,
      life: s.toast.life,
      max: s.toast.max,
      progress: s.toast.life / s.toast.max,
      // En difícil la notificación no deja de vibrar.
      shake: s.cfg.bigToast ? 1 : Math.max(0, s.toast.life - (s.toast.max - 0.5)) * 2,
      actions: [
        [{ key: 'Y', pad: 'lt' }, 'Arrancar ya'],
        [{ key: 'X', pad: 'rt' }, 'Seguir el protocolo'],
      ],
    };
    B.dock(ctx, D.dockRect(430), { bubble: s.bubble, notices: [toast, s.banner], t });
    D.footer(ctx, [
      [{ key: 'WASD', pad: 'lstick' }, 'mover'],
      [{ key: 'E', pad: 'x' }, 'operar'],
      [{ key: 'ESPACIO', pad: 'a' }, 'mantener'],
      [s.cfg.tab ? { key: 'TAB', pad: 'y' } : { key: 'E', pad: 'x' }, 'plan'],
    ]);
  }

  function report(s) {
    const st = s.stats;
    let score = st.lotes * 20 - st.errors * 5 - st.contaminated * 20;
    score = Math.max(0, Math.min(100, score));
    const rank = s.gameOver ? 'C' : D.rankFor(score);
    return {
      score,
      rank,
      headline: s.gameOver ? 'GAME OVER: se arrancó la línea sin protocolo y salió cerveza contaminada' : `${st.lotes} ${st.lotes === 1 ? 'lote seguro envasado' : 'lotes seguros envasados'}`,
      rows: [
        ['Lotes seguros', String(st.lotes), T.ok],
        ['Pasos correctos del protocolo', String(st.correct), T.ink],
        ['Decisiones incorrectas', String(st.errors), st.errors ? T.red : T.ok],
        ['Lotes contaminados', String(st.contaminated), st.contaminated ? T.red : T.ok],
        ['Presiones resistidas', String(st.resisted), T.ok],
        ['Puntuación de Calidad', `${score}/100`, D.rankColor(rank)],
      ],
      mistakes: s.bubble.log.slice(),
    };
  }

  function icon(ctx, cx, cy, size, t) {
    // Reloj con señal de stop.
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = '#f2e3c6';
    ctx.beginPath();
    ctx.arc(0, 0, size * 0.42, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#3a1d0c';
    ctx.lineWidth = 5;
    ctx.stroke();
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(t * 2 - Math.PI / 2) * size * 0.3, Math.sin(t * 2 - Math.PI / 2) * size * 0.3);
    ctx.moveTo(0, 0);
    ctx.lineTo(0, -size * 0.2);
    ctx.stroke();
    ctx.translate(size * 0.32, size * 0.26);
    ctx.fillStyle = T.red;
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = Math.PI / 8 + (i * Math.PI) / 4;
      ctx.lineTo(Math.cos(a) * size * 0.2, Math.sin(a) * size * 0.2);
    }
    ctx.closePath();
    ctx.fill();
    D.text(ctx, 'STOP', 0, 4, { size: size * 0.09, weight: 800, color: '#fff', align: 'center' });
    ctx.restore();
  }

  PF.Games = PF.Games || [];
  PF.Games.push({
    id: 'stop',
    order: 4,
    title: 'Línea en Paro',
    subtitle: 'Decisiones Bajo Presión',
    tagline: 'La línea paró: aplica el plan de reacción correcto antes de arrancar.',
    accent: ACCENT,
    icon,
    howTo: [
      'Salta un aviso: "Línea detenida hace 2 horas".',
      'Mira el plan de reacción (p. 17) y corre a las estaciones que tocan.',
      'Cuando el protocolo esté completo, arranca la línea en START.',
      'Ignora las notificaciones que te meten prisa: arrancar sin protocolo = cerveza contaminada.',
    ],
    touch: { stick: true, main: [{ pad: 'a', label: 'Mantener' }, { pad: 'x', label: 'Operar' }, { pad: 'y', label: 'Plan' }, { pad: 'b', label: 'Salir' }] },
    controls: [
      ['WASD', 'moverse', 'lstick'],
      ['E', 'operar', 'x'],
      ['ESPACIO', 'mantener acción', 'a'],
      ['TAB', 'plan de reacción', 'y'],
    ],
    difficulties: {
      facil: ['La tarjeta muestra el protocolo y resalta las estaciones', '3 vidas', 'Pocas notificaciones de presión'],
      normal: ['Tienes que consultar el plan (TAB)', '2 vidas · cada error resta 2 s', 'Notificaciones frecuentes'],
      dificil: ['El plan solo está en el tablero del mapa', '1 vida: un arranque sin protocolo es game over', 'Notificaciones constantes que no paran de vibrar'],
    },
    create,
  });
})();
