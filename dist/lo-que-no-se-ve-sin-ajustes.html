// Dibujo en canvas: planta, jugador, HUD, paneles de estación, mini-juegos y pantallas.
(function () {
  'use strict';
  const PF = globalThis.PF || (globalThis.PF = {});
  const C = PF.CONFIG;
  const Sim = PF.Sim;
  const MAP = C.MAP;
  const V = C.VIEW;

  const COL = {
    bg: '#0b0e12',
    floor: '#1a2027',
    floorLine: '#212932',
    wall: '#0e1216',
    hazard: '#e2b007',
    panel: '#11161c',
    panelEdge: '#2b3540',
    text: '#e8edf2',
    dim: '#8b97a5',
    faint: '#55616e',
    ok: '#4cd28a',
    okDark: '#1f5a3d',
    band: '#2f8a5d',
    warn: '#ffc93c',
    red: '#ff4b4b',
    beer: '#f2b134',
    gold: '#ffd34d',
    steel: '#5d6b78',
    steelDark: '#36414c',
    steelLight: '#8996a3',
    player: '#e8742c',
    playerDark: '#a84d17',
    visor: '#9fdcf2',
  };
  const SIMON_COLORS = ['#ff5a5a', '#4cd28a', '#4aa3ff', '#ffd34d'];
  const ARROW_GLYPH = { up: '↑', right: '→', down: '↓', left: '←' };
  const FONT = '"Rajdhani", "Segoe UI", system-ui, sans-serif';
  const MONO = '"Share Tech Mono", ui-monospace, Menlo, Consolas, monospace';

  // ----------------------------------------------------------- Utilidades

  function font(size, weight = 600, family = FONT) {
    return `${weight} ${size}px ${family}`;
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function text(ctx, str, x, y, { size = 16, weight = 600, color = COL.text, align = 'left', base = 'alphabetic', family = FONT } = {}) {
    ctx.font = font(size, weight, family);
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.textBaseline = base;
    ctx.fillText(str, x, y);
  }

  function wrap(ctx, str, maxWidth) {
    const words = str.split(' ');
    const lines = [];
    let line = '';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = w;
      } else line = test;
    }
    if (line) lines.push(line);
    return lines;
  }

  function pathInfo(points) {
    const segs = [];
    let total = 0;
    for (let i = 1; i < points.length; i++) {
      const a = points[i - 1];
      const b = points[i];
      const len = Math.hypot(b.x - a.x, b.y - a.y);
      segs.push({ a, b, len, start: total });
      total += len;
    }
    return { points, segs, total };
  }

  function pointAt(info, d) {
    for (const s of info.segs) {
      if (d <= s.start + s.len) {
        const t = (d - s.start) / s.len;
        return { x: s.a.x + (s.b.x - s.a.x) * t, y: s.a.y + (s.b.y - s.a.y) * t };
      }
    }
    return info.points[info.points.length - 1];
  }

  const PIPES = { main: pathInfo(MAP.pipe), good: pathInfo(MAP.pipeGood), bad: pathInfo(MAP.pipeBad) };
  const STATION_TOP = {};
  for (const st of Object.values(MAP.stations)) STATION_TOP[st.id] = { x: st.rect.x + st.rect.w / 2, y: st.rect.y - 8 };
  const FILL_TANK = MAP.obstacles.find((o) => o.label === 'LLENADO');
  const DRAIN_TANK = MAP.obstacles.find((o) => o.label === 'DESCARTE');

  function severityColor(sev) {
    return sev === 'red' ? COL.red : COL.warn;
  }

  function statusColor(status) {
    return status === 'ok' ? COL.ok : status === 'warn' ? COL.warn : COL.red;
  }

  function stationSeverity(g, alarms, id) {
    let sev = null;
    for (const a of alarms) {
      if (a.station !== id) continue;
      if (a.severity === 'red') return 'red';
      sev = 'warn';
    }
    return sev;
  }

  function stationShortName(id) {
    return { temp: 'Temperatura (T)', valve: 'Válvula (V)', pump: 'Bomba (B)', panel: 'Panel' }[id] || id;
  }

  function resetFx(r) {
    r.fx = { particles: [], floats: [], spawnAcc: 0, shake: 0, flash: 0, banner: null };
  }

  // ------------------------------------------------------------ Efectos

  function addFloat(r, x, y, str, color, size = 18, life = 1.2) {
    r.fx.floats.push({ x, y, str, color, size, life, max: life });
  }

  function banner(r, str, color, life = 1.8) {
    const ttl = life * 1.8;
    r.fx.banner = { str, color, life: ttl, max: ttl };
  }

  function onSignal(r, s) {
    const fx = r.fx;
    const top = STATION_TOP[s.station];
    switch (s.type) {
      case 'alarm':
        if (top) addFloat(r, top.x, top.y - 10, '¡' + s.name + '!', COL.warn, 16, 1.4);
        fx.shake = Math.max(fx.shake, 3);
        break;
      case 'resolved':
        if (top && s.byPlayer) addFloat(r, top.x, top.y - 10, '✔ Controlado', COL.ok, 18, 1.2);
        break;
      case 'volume':
        if (s.approved > 0.005) addFloat(r, FILL_TANK.x + FILL_TANK.w / 2, FILL_TANK.y - 6, '+' + Sim.fmt(s.approved, 2) + ' HL', COL.gold, 15, 1.0);
        if (s.discarded > 0.005) addFloat(r, DRAIN_TANK.x + DRAIN_TANK.w / 2, DRAIN_TANK.y + DRAIN_TANK.h + 22, '−' + Sim.fmt(s.discarded, 2) + ' HL', COL.red, 17, 1.0);
        break;
      case 'discardStart':
        fx.flash = Math.max(fx.flash, 0.35);
        break;
      case 'lineStop':
        banner(r, 'PARO DE LÍNEA', COL.red, 2.2);
        fx.shake = 8;
        break;
      case 'lineRestart':
        banner(r, 'LÍNEA REARRANCADA · purga ' + Sim.fmt(s.purge, 1) + ' HL', COL.warn, 1.6);
        break;
      case 'phase':
        if (s.index === 0) banner(r, '¡ARRANCA EL TURNO!', COL.gold, 1.4);
        else banner(r, s.label.toUpperCase(), s.peak ? COL.red : COL.warn, s.peak ? 2.2 : 1.5);
        if (s.peak) fx.shake = 6;
        break;
      case 'blocked':
        if (top) addFloat(r, top.x, top.y - 34, '⚡ BLOQUEADA', COL.red, 16, 1.4);
        break;
      case 'denied':
        if (top) addFloat(r, top.x, top.y - 34, 'Bloqueada…', COL.red, 14, 0.8);
        break;
    }
  }

  function update(r, g, dt) {
    const fx = r.fx;
    const flow = g.lineStopped ? 0 : Sim.effective(g, 'flow');
    fx.spawnAcc += flow * 11 * dt;
    while (fx.spawnAcc >= 1) {
      fx.spawnAcc -= 1;
      fx.particles.push({ path: 'main', d: 0 });
    }
    const speed = flow * 240;
    for (const p of fx.particles) {
      p.d += speed * dt;
      if (p.path === 'main' && p.d >= PIPES.main.total) {
        p.d -= PIPES.main.total;
        p.path = g.discardingNow ? 'bad' : 'good';
      }
      if (p.path !== 'main' && p.d >= PIPES[p.path].total) p.dead = true;
    }
    fx.particles = fx.particles.filter((p) => !p.dead);
    for (const f of fx.floats) {
      f.life -= dt;
      f.y -= 28 * dt;
    }
    fx.floats = fx.floats.filter((f) => f.life > 0);
    fx.shake = Math.max(0, fx.shake - dt * 18);
    fx.flash = Math.max(0, fx.flash - dt);
    if (fx.banner) {
      fx.banner.life -= dt;
      if (fx.banner.life <= 0) fx.banner = null;
    }
  }

  // --------------------------------------------------------------- Mapa

  function drawFloor(ctx) {
    ctx.fillStyle = COL.wall;
    ctx.fillRect(0, V.hud, V.mapWidth, V.height - V.hud);
    const b = MAP.bounds;
    ctx.fillStyle = COL.floor;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = COL.floorLine;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = b.x; x <= b.x + b.w; x += 48) {
      ctx.moveTo(x + 0.5, b.y);
      ctx.lineTo(x + 0.5, b.y + b.h);
    }
    for (let y = b.y; y <= b.y + b.h; y += 48) {
      ctx.moveTo(b.x, y + 0.5);
      ctx.lineTo(b.x + b.w, y + 0.5);
    }
    ctx.stroke();
    // Franja de seguridad en el perímetro.
    ctx.save();
    ctx.beginPath();
    ctx.rect(b.x - 10, b.y - 10, b.w + 20, b.h + 20);
    ctx.rect(b.x, b.y, b.w, b.h);
    ctx.clip('evenodd');
    ctx.fillStyle = '#1c1a10';
    ctx.fillRect(b.x - 10, b.y - 10, b.w + 20, b.h + 20);
    ctx.strokeStyle = COL.hazard;
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 6;
    ctx.beginPath();
    for (let i = -b.h; i < b.w + b.h; i += 22) {
      ctx.moveTo(b.x + i, b.y - 10);
      ctx.lineTo(b.x + i + b.h + 20, b.y + b.h + 10);
    }
    ctx.stroke();
    ctx.restore();
  }

  function strokePath(ctx, points, width, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
    ctx.stroke();
  }

  function drawPipes(r, g) {
    const ctx = r.ctx;
    for (const pts of [MAP.pipe, MAP.pipeGood, MAP.pipeBad]) {
      strokePath(ctx, pts, 18, '#0d1115');
      strokePath(ctx, pts, 14, COL.steelDark);
      strokePath(ctx, pts, 6, '#46525e');
    }
    // Desviador: indica hacia dónde va la cerveza ahora mismo.
    const d = MAP.pipeGood[0];
    const bad = g.discardingNow;
    ctx.fillStyle = bad ? COL.red : COL.ok;
    ctx.beginPath();
    ctx.arc(d.x, d.y, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = COL.wall;
    ctx.beginPath();
    ctx.arc(d.x, d.y, 5, 0, Math.PI * 2);
    ctx.fill();
    // Etiqueta del tubo de retención.
    ctx.save();
    ctx.translate(372, 400);
    ctx.rotate(-Math.PI / 2);
    text(ctx, 'TUBO DE RETENCIÓN', 0, 0, { size: 11, color: COL.faint, align: 'center', weight: 700 });
    ctx.restore();
    // Partículas de cerveza.
    for (const p of r.fx.particles) {
      const pt = pointAt(PIPES[p.path], p.d);
      ctx.fillStyle = p.path === 'bad' ? COL.red : p.path === 'good' ? COL.gold : COL.beer;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, p.path === 'main' ? 3.4 : 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawObstacles(r, g) {
    const ctx = r.ctx;
    for (const o of MAP.obstacles) {
      if (o.kind === 'tank') {
        const grad = ctx.createLinearGradient(o.x, 0, o.x + o.w, 0);
        grad.addColorStop(0, COL.steelDark);
        grad.addColorStop(0.45, COL.steelLight);
        grad.addColorStop(1, COL.steelDark);
        ctx.fillStyle = grad;
        roundRect(ctx, o.x, o.y, o.w, o.h, 12);
        ctx.fill();
        ctx.strokeStyle = '#0d1115';
        ctx.lineWidth = 2;
        ctx.stroke();
        // Nivel del tanque.
        let level = 0.6;
        let color = COL.beer;
        if (o.tone === 'good') {
          level = Math.min(0.92, g.stats.approved / 54);
          color = COL.gold;
        } else if (o.tone === 'bad') {
          level = Math.min(0.92, g.stats.discarded / 15);
          color = COL.red;
        }
        const ih = (o.h - 16) * level;
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.8;
        ctx.fillRect(o.x + o.w - 16, o.y + o.h - 8 - ih, 8, ih);
        ctx.globalAlpha = 1;
        ctx.save();
        ctx.translate(o.x + o.w / 2 - 6, o.y + o.h / 2);
        ctx.rotate(-Math.PI / 2);
        text(ctx, o.label, 0, 4, { size: 12, weight: 700, color: o.tone === 'bad' ? '#ffb3b3' : '#10161b', align: 'center' });
        ctx.restore();
      } else {
        ctx.fillStyle = '#4a3a24';
        ctx.fillRect(o.x, o.y, o.w, o.h);
        ctx.strokeStyle = '#2b2116';
        ctx.lineWidth = 3;
        ctx.strokeRect(o.x + 1.5, o.y + 1.5, o.w - 3, o.h - 3);
        ctx.beginPath();
        ctx.moveTo(o.x + 4, o.y + 4);
        ctx.lineTo(o.x + o.w - 4, o.y + o.h - 4);
        ctx.moveTo(o.x + o.w - 4, o.y + 4);
        ctx.lineTo(o.x + 4, o.y + o.h - 4);
        ctx.stroke();
        text(ctx, 'MALTA', o.x + o.w / 2, o.y + o.h / 2 + 5, { size: 13, weight: 700, color: '#c9a66b', align: 'center' });
      }
    }
  }

  function drawStation(r, g, st, sev, near) {
    const ctx = r.ctx;
    const { x, y, w, h } = st.rect;
    const t = r.t;
    const blocked = Sim.isBlocked(g, st.id);
    const blink = Math.floor(t * 6) % 2 === 0;

    // Pad de interacción.
    if (st.interactive) {
      ctx.fillStyle = near ? 'rgba(255,211,77,0.22)' : 'rgba(255,255,255,0.05)';
      ctx.strokeStyle = near ? COL.gold : 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 5]);
      ctx.beginPath();
      ctx.arc(st.spot.x, st.spot.y, 26, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Halo de alarma.
    if (sev) {
      const pulse = 0.5 + 0.5 * Math.sin(t * (sev === 'red' ? 12 : 6));
      ctx.save();
      ctx.shadowColor = severityColor(sev);
      ctx.shadowBlur = 18 + pulse * 18;
      ctx.strokeStyle = severityColor(sev);
      ctx.globalAlpha = 0.5 + pulse * 0.5;
      ctx.lineWidth = 4;
      roundRect(ctx, x - 5, y - 5, w + 10, h + 10, 10);
      ctx.stroke();
      ctx.restore();
    }

    // Carcasa.
    ctx.fillStyle = COL.steelDark;
    roundRect(ctx, x, y, w, h, 8);
    ctx.fill();
    ctx.strokeStyle = '#0d1115';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#2a333d';
    roundRect(ctx, x + 6, y + 6, w - 12, h - 12, 5);
    ctx.fill();

    const cx = x + w / 2;
    const cy = y + h / 2;
    if (st.id === 'temp') {
      // Placas del intercambiador.
      for (let i = 0; i < 9; i++) {
        ctx.fillStyle = i % 2 ? '#7d8a97' : '#9aa7b3';
        ctx.fillRect(x + 16 + i * 9, y + 14, 6, h - 28);
      }
      const hot = (g.vars.temp.value - 18) / 18;
      ctx.fillStyle = '#10161b';
      roundRect(ctx, x + w - 52, y + 14, 36, h - 28, 4);
      ctx.fill();
      ctx.fillStyle = hot > 0.6 ? COL.red : hot < 0.35 ? '#4aa3ff' : COL.beer;
      const th = (h - 36) * Math.max(0.05, Math.min(1, hot));
      ctx.fillRect(x + w - 40, y + h - 18 - th, 12, th);
    } else if (st.id === 'valve') {
      const ang = (g.vars.flow.value - 0.6) * 18;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(ang);
      ctx.strokeStyle = '#d8423a';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(0, 0, 26, 0, Math.PI * 2);
      ctx.stroke();
      ctx.lineWidth = 4;
      for (let i = 0; i < 4; i++) {
        ctx.rotate(Math.PI / 2);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(26, 0);
        ctx.stroke();
      }
      ctx.restore();
      ctx.fillStyle = '#8a1f1a';
      ctx.beginPath();
      ctx.arc(cx, cy, 6, 0, Math.PI * 2);
      ctx.fill();
    } else if (st.id === 'pump') {
      const flow = g.lineStopped ? 0 : Sim.effective(g, 'flow');
      ctx.fillStyle = '#26507a';
      ctx.beginPath();
      ctx.arc(cx - 30, cy, 26, 0, Math.PI * 2);
      ctx.fill();
      ctx.save();
      ctx.translate(cx - 30, cy);
      ctx.rotate(t * flow * 14);
      ctx.fillStyle = '#9cc7f0';
      for (let i = 0; i < 3; i++) {
        ctx.rotate((Math.PI * 2) / 3);
        ctx.fillRect(0, -3, 20, 6);
      }
      ctx.restore();
      ctx.fillStyle = '#7d8a97';
      ctx.fillRect(cx + 4, cy - 14, 58, 28);
      ctx.fillStyle = '#10161b';
      for (let i = 0; i < 5; i++) ctx.fillRect(cx + 9 + i * 11, cy - 10, 5, 20);
    } else if (st.id === 'panel') {
      ctx.fillStyle = '#081016';
      roundRect(ctx, x + 10, y + 10, w - 20, h - 20, 4);
      ctx.fill();
      C.VAR_KEYS.forEach((k, i) => {
        const status = Sim.varStatus(g, k);
        const lx = x + 30 + i * 30;
        ctx.fillStyle = statusColor(status);
        ctx.globalAlpha = status === 'ok' ? 0.9 : blink ? 1 : 0.35;
        ctx.beginPath();
        ctx.arc(lx, y + 26, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        text(ctx, ['T', 'F', 'R'][i], lx, y + 48, { size: 11, color: COL.dim, align: 'center', weight: 700 });
      });
    }

    // Rótulo.
    const label = st.id === 'panel' ? 'PANEL DE ALARMAS' : st.id === 'temp' ? 'T · TEMPERATURA' : st.id === 'valve' ? 'V · VÁLVULA' : 'B · BOMBA';
    const ly = st.id === 'pump' ? y - 10 : y + h + 16;
    text(ctx, label, cx, ly, { size: 13, weight: 700, color: COL.dim, align: 'center' });

    // Marcador "!" de alarma.
    if (sev && st.interactive) {
      const by = y - 22 + Math.sin(t * 8) * 4 - (st.id === 'pump' ? 14 : 0);
      ctx.fillStyle = severityColor(sev);
      ctx.beginPath();
      ctx.moveTo(cx, by + 10);
      ctx.lineTo(cx - 13, by - 14);
      ctx.lineTo(cx + 13, by - 14);
      ctx.closePath();
      ctx.fill();
      text(ctx, '!', cx, by - 1, { size: 18, weight: 800, color: '#111', align: 'center' });
    }

    // Bloqueo: chispas y rojo intermitente.
    if (blocked) {
      ctx.fillStyle = blink ? 'rgba(255,75,75,0.45)' : 'rgba(255,75,75,0.15)';
      roundRect(ctx, x, y, w, h, 8);
      ctx.fill();
      ctx.strokeStyle = COL.gold;
      ctx.lineWidth = 2;
      for (let i = 0; i < 5; i++) {
        const a = t * 20 + i * 1.7;
        const sx = cx + Math.cos(a * 1.3) * w * 0.35;
        const sy = cy + Math.sin(a) * h * 0.3;
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx + Math.cos(a) * 10, sy + Math.sin(a * 2) * 10);
        ctx.stroke();
      }
      text(ctx, 'BLOQUEADA', cx, cy + 6, { size: 16, weight: 800, color: '#fff', align: 'center' });
    }
  }

  function drawPlayer(r, g) {
    const ctx = r.ctx;
    const p = g.player;
    const bob = p.moving ? Math.sin(p.walkT * 16) * 2 : 0;
    const step = p.moving ? Math.sin(p.walkT * 16) * 4 : 0;
    ctx.save();
    ctx.translate(p.x, p.y + bob);
    ctx.scale(p.facing, 1);
    // Sombra.
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(0, 18 - bob, 17, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    // Mochila.
    ctx.fillStyle = COL.playerDark;
    roundRect(ctx, -20, -8, 9, 20, 4);
    ctx.fill();
    // Piernas.
    ctx.fillStyle = COL.playerDark;
    roundRect(ctx, -11, 8 + step * 0.5, 9, 10, 3);
    ctx.fill();
    roundRect(ctx, 3, 8 - step * 0.5, 9, 10, 3);
    ctx.fill();
    // Cuerpo.
    ctx.fillStyle = COL.player;
    roundRect(ctx, -13, -20, 26, 32, 12);
    ctx.fill();
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 2;
    ctx.stroke();
    // Visor.
    ctx.fillStyle = COL.visor;
    roundRect(ctx, -1, -14, 16, 10, 5);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    roundRect(ctx, 6, -12, 6, 3, 1.5);
    ctx.fill();
    // Casco de seguridad.
    ctx.fillStyle = COL.gold;
    ctx.beginPath();
    ctx.ellipse(0, -19, 12, 5, 0, Math.PI, 0);
    ctx.fill();
    ctx.restore();
  }

  // Flecha alrededor del jugador hacia la alarma más urgente.
  function drawGuide(r, g, alarms) {
    const p = g.player;
    if (p.operating || !alarms.length) return;
    const a = alarms[0];
    const st = MAP.stations[a.station];
    if (!st || !st.interactive) return;
    const dx = st.spot.x - p.x;
    const dy = st.spot.y - p.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 90) return;
    const ang = Math.atan2(dy, dx);
    const ctx = r.ctx;
    ctx.save();
    ctx.translate(p.x + Math.cos(ang) * 38, p.y + Math.sin(ang) * 38);
    ctx.rotate(ang);
    ctx.fillStyle = severityColor(a.severity);
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(r.t * 10);
    ctx.beginPath();
    ctx.moveTo(10, 0);
    ctx.lineTo(-6, -8);
    ctx.lineTo(-2, 0);
    ctx.lineTo(-6, 8);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawPrompt(r, g) {
    const p = g.player;
    if (p.operating) return;
    const id = Sim.nearestStation(g);
    if (!id) return;
    const ctx = r.ctx;
    const blocked = Sim.isBlocked(g, id);
    PF.Draw.prompt(ctx, p, blocked ? 'bloqueada' : 'operar', blocked ? COL.red : COL.gold);
  }

  function drawFloats(r) {
    const ctx = r.ctx;
    for (const f of r.fx.floats) {
      ctx.globalAlpha = Math.min(1, f.life / (f.max * 0.4));
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(0,0,0,0.75)';
      ctx.font = font(f.size, 800);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.strokeText(f.str, f.x, f.y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.str, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawMap(r, g, alarms) {
    const ctx = r.ctx;
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, V.hud, V.mapWidth, V.height - V.hud);
    ctx.clip();
    if (r.fx.shake > 0) ctx.translate((Math.random() - 0.5) * r.fx.shake, (Math.random() - 0.5) * r.fx.shake);
    drawFloor(ctx);
    drawPipes(r, g);
    drawObstacles(r, g);
    const near = g.player.operating ? null : Sim.nearestStation(g);
    for (const st of Object.values(MAP.stations)) drawStation(r, g, st, stationSeverity(g, alarms, st.id), near === st.id);
    drawGuide(r, g, alarms);
    drawPlayer(r, g);
    drawPrompt(r, g);
    drawFloats(r);

    // Ambiente: hora pico y descarte.
    const ph = Sim.phase(g);
    if (ph.peak && !g.over) {
      const pulse = 0.5 + 0.5 * Math.sin(r.t * 7);
      const grad = ctx.createRadialGradient(480, 392, 220, 480, 392, 620);
      grad.addColorStop(0, 'rgba(255,0,0,0)');
      grad.addColorStop(1, `rgba(255,30,30,${0.18 + pulse * 0.22})`);
      ctx.fillStyle = grad;
      ctx.fillRect(0, V.hud, V.mapWidth, V.height - V.hud);
    }
    if (r.fx.flash > 0) {
      ctx.fillStyle = `rgba(255,40,40,${r.fx.flash * 0.35})`;
      ctx.fillRect(0, V.hud, V.mapWidth, V.height - V.hud);
    }
    if (g.lineStopped) {
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(0, V.hud, V.mapWidth, V.height - V.hud);
    }
    ctx.restore();
  }

  // ---------------------------------------------------------------- HUD

  function drawTopBar(r, g) {
    const ctx = r.ctx;
    const s = g.stats;
    ctx.fillStyle = COL.panel;
    ctx.fillRect(0, 0, V.width, V.hud);
    ctx.fillStyle = COL.panelEdge;
    ctx.fillRect(0, V.hud - 2, V.width, 2);

    const stat = (label, value, x, color) => {
      text(ctx, label, x, 24, { size: 12, color: COL.dim, weight: 700 });
      text(ctx, value, x, 50, { size: 24, color, weight: 700, family: MONO });
    };
    stat('PROCESADO', Sim.fmt(s.processed, 1) + ' HL', 20, COL.text);
    stat('APROBADO', Sim.fmt(s.approved, 1) + ' HL', 170, COL.gold);
    stat('DESECHADO', Sim.fmt(s.discarded, 1) + ' HL', 320, COL.red);

    // Temporizador con la curva de dificultad debajo.
    const left = Sim.timeLeft(g);
    const secs = Math.ceil(left);
    const critical = left <= 10;
    const tc = critical && Math.floor(r.t * 4) % 2 ? COL.red : COL.text;
    text(ctx, `0:${String(secs).padStart(2, '0')}`, 640, 42, { size: 38, weight: 700, color: tc, align: 'center', family: MONO });
    const bx = 540;
    const bw = 200;
    let prev = 0;
    for (const ph of C.PHASES) {
      const x0 = bx + (prev / C.DURATION) * bw;
      const x1 = bx + (ph.until / C.DURATION) * bw;
      ctx.fillStyle = ph.peak ? '#5a1d1d' : '#2a333d';
      ctx.fillRect(x0 + 1, 52, x1 - x0 - 2, 5);
      prev = ph.until;
    }
    ctx.fillStyle = COL.gold;
    ctx.fillRect(bx, 52, (Math.min(g.time, C.DURATION) / C.DURATION) * bw, 5);

    const eff = s.processed > 0 ? (s.approved / s.processed) * 100 : 100;
    const effColor = eff >= 95 ? COL.ok : eff >= 85 ? COL.gold : eff >= 70 ? COL.warn : COL.red;
    text(ctx, 'EFICIENCIA', 800, 24, { size: 12, color: COL.dim, weight: 700 });
    text(ctx, Sim.fmt(eff, 1) + '%', 800, 50, { size: 24, color: effColor, weight: 700, family: MONO });
    const ph = Sim.phase(g);
    text(ctx, 'FASE', 960, 24, { size: 12, color: COL.dim, weight: 700 });
    text(ctx, ph.label, 960, 50, { size: 22, color: ph.peak ? COL.red : COL.text, weight: 700 });
    PF.Draw.hints(ctx, [[{ key: 'P', pad: 'start' }, 'pausa']], 1266, 22, { size: 11, align: 'right', ink: COL.faint, color: '#55616e' });
    if (PF.Draw.InputState.device === 'keyboard') {
      PF.Draw.hints(ctx, [[{ key: 'M' }, PF.Audio && PF.Audio.isMuted() ? 'sonido OFF' : 'sonido']], 1266, 46, { size: 11, align: 'right', ink: COL.faint, color: '#55616e' });
    }
  }

  // Barra de medición: rango visible, zona aceptable, banda ideal y aguja.
  function drawGaugeBar(ctx, x, y, w, h, key, value, { lying = false, t = 0 } = {}) {
    const cfg = C.VARS[key];
    const span = cfg.viewMax - cfg.viewMin;
    const px = (v) => x + ((Math.max(cfg.viewMin, Math.min(cfg.viewMax, v)) - cfg.viewMin) / span) * w;
    ctx.fillStyle = '#3a1a1d';
    roundRect(ctx, x, y, w, h, 4);
    ctx.fill();
    ctx.fillStyle = COL.okDark;
    ctx.fillRect(px(cfg.min), y, px(cfg.max) - px(cfg.min), h);
    ctx.fillStyle = COL.band;
    ctx.fillRect(px(cfg.ideal - cfg.band), y, px(cfg.ideal + cfg.band) - px(cfg.ideal - cfg.band), h);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillRect(px(cfg.ideal) - 1, y, 2, h);
    const nx = px(value);
    ctx.fillStyle = lying ? (Math.floor(t * 10) % 2 ? '#c38bff' : '#fff') : '#fff';
    ctx.fillRect(nx - 2, y - 4, 4, h + 8);
    ctx.beginPath();
    ctx.moveTo(nx - 6, y - 6);
    ctx.lineTo(nx + 6, y - 6);
    ctx.lineTo(nx, y + 1);
    ctx.closePath();
    ctx.fill();
  }

  function valueText(key, v) {
    const cfg = C.VARS[key];
    return Sim.fmt(v, cfg.decimals) + ' ' + cfg.unit;
  }

  function drawSidebar(r, g, alarms) {
    const ctx = r.ctx;
    const x0 = V.mapWidth;
    ctx.fillStyle = COL.panel;
    ctx.fillRect(x0, V.hud, V.width - x0, V.height - V.hud);
    ctx.fillStyle = COL.panelEdge;
    ctx.fillRect(x0, V.hud, 2, V.height - V.hud);
    text(ctx, 'INSTRUMENTOS', x0 + 20, 92, { size: 13, weight: 700, color: COL.dim });

    C.VAR_KEYS.forEach((key, i) => {
      const cfg = C.VARS[key];
      const y = 106 + i * 70;
      const d = Sim.display(g, key);
      const status = Sim.varStatus(g, key);
      const discarding = g.vars[key].discarding;
      text(ctx, cfg.label, x0 + 20, y + 14, { size: 15, weight: 700 });
      const shown = d.lying && Math.floor(r.t * 5) % 3 === 0 ? '?? ' + cfg.unit : valueText(key, d.value);
      const color = d.lying ? '#c38bff' : statusColor(status);
      text(ctx, shown, x0 + 300, y + 14, { size: 18, weight: 700, color, align: 'right', family: MONO });
      drawGaugeBar(ctx, x0 + 20, y + 26, 280, 14, key, d.value, { lying: d.lying, t: r.t });
      const note = d.lying ? 'SENSOR LOCO: lectura no fiable' : discarding ? '▼ DESCARTANDO · ' + cfg[g.vars[key].dir].effect : `rango ${Sim.fmt(cfg.min, cfg.decimals)}–${Sim.fmt(cfg.max, cfg.decimals)}`;
      text(ctx, note, x0 + 20, y + 58, { size: 12, color: d.lying ? '#c38bff' : discarding ? COL.red : COL.faint, weight: 600 });
    });

    text(ctx, `ALARMAS (${alarms.length})`, x0 + 20, 332, { size: 13, weight: 700, color: alarms.length ? COL.warn : COL.dim });
    if (!alarms.length) {
      text(ctx, 'Sin alarmas. La línea respira…', x0 + 20, 362, { size: 14, color: COL.faint });
    }
    const blink = Math.floor(r.t * 5) % 2 === 0;
    alarms.slice(0, 3).forEach((a, i) => {
      const y = 344 + i * 66;
      const col = severityColor(a.severity);
      ctx.globalAlpha = a.blink && !blink ? 0.45 : 1;
      ctx.fillStyle = a.severity === 'red' ? '#2c1316' : '#2a2512';
      roundRect(ctx, x0 + 14, y, 292, 58, 6);
      ctx.fill();
      ctx.fillStyle = col;
      ctx.fillRect(x0 + 14, y, 6, 58);
      text(ctx, a.title, x0 + 30, y + 20, { size: 16, weight: 700, color: col });
      const blocked = Sim.isBlocked(g, a.station);
      text(ctx, '→ ' + stationShortName(a.station) + (blocked ? ' · BLOQUEADA' : ''), x0 + 298, y + 20, { size: 12, weight: 700, color: blocked ? COL.red : COL.text, align: 'right' });
      ctx.font = font(13, 500);
      const hint = wrap(ctx, PF.Draw.keysText(a.hint), 268)[0];
      text(ctx, hint, x0 + 30, y + 42, { size: 13, weight: 500, color: COL.dim });
      if (a.event && a.event.kind === 'adjust' && a.event.settle > 0) {
        ctx.fillStyle = COL.ok;
        ctx.fillRect(x0 + 30, y + 50, 268 * Math.min(1, a.event.settle / C.SETTLE_TIME), 3);
      } else if (a.event && a.event.mg) {
        const ratio = PF.Minigames[a.event.mg.type].ratio(a.event.mg);
        if (ratio > 0) {
          ctx.fillStyle = COL.ok;
          ctx.fillRect(x0 + 30, y + 50, 268 * ratio, 3);
        }
      }
      ctx.globalAlpha = 1;
    });
    if (alarms.length > 3) text(ctx, `+${alarms.length - 3} alarmas más`, x0 + 306, 332, { size: 12, color: COL.warn, align: 'right' });
    PF.Draw.footer(ctx, [
      [{ key: 'WASD', pad: 'lstick' }, 'mover'],
      [{ key: 'E', pad: 'x' }, 'operar'],
      [{ key: 'A / D', pad: 'dpadLR' }, 'ajustar'],
      [{ key: 'ESPACIO', pad: 'a' }, 'reparar'],
    ]);
  }

  // ------------------------------------------------- Panel de estación

  function drawStationPanel(r, g) {
    const id = g.player.operating;
    if (!id) return;
    const ctx = r.ctx;
    const st = MAP.stations[id];
    const key = st.variable;
    const cfg = C.VARS[key];
    const repair = Sim.activeRepair(g, id);
    const events = Sim.stationEvents(g, id);
    const blocked = Sim.isBlocked(g, id);

    const W = 620;
    const H = repair ? 360 : 230;
    const x = (V.mapWidth - W) / 2;
    const y = 690 - H;
    ctx.fillStyle = 'rgba(5,8,11,0.55)';
    ctx.fillRect(0, V.hud, V.mapWidth, V.height - V.hud);
    ctx.fillStyle = '#121a22';
    roundRect(ctx, x, y, W, H, 12);
    ctx.fill();
    ctx.strokeStyle = COL.panelEdge;
    ctx.lineWidth = 2;
    ctx.stroke();

    text(ctx, st.name.toUpperCase(), x + 24, y + 34, { size: 22, weight: 700 });
    PF.Draw.hints(ctx, [[{ key: 'E / Esc', pad: 'b' }, 'salir']], x + W - 24, y + 27, { size: 12, align: 'right', ink: COL.dim, color: COL.gold });

    // Medidor principal.
    const d = Sim.display(g, key);
    const status = Sim.varStatus(g, key);
    const stuck = Sim.isStuck(g, key);
    text(ctx, cfg.label, x + 24, y + 70, { size: 15, color: COL.dim });
    const shown = d.lying && Math.floor(r.t * 5) % 3 === 0 ? '??' : valueText(key, d.value);
    text(ctx, shown, x + W - 24, y + 74, { size: 30, weight: 700, color: d.lying ? '#c38bff' : statusColor(status), align: 'right', family: MONO });
    drawGaugeBar(ctx, x + 24, y + 88, W - 48, 22, key, d.value, { lying: d.lying, t: r.t });
    text(ctx, Sim.fmt(cfg.viewMin, cfg.decimals), x + 24, y + 128, { size: 12, color: COL.faint });
    text(ctx, `ideal ${Sim.fmt(cfg.ideal, cfg.decimals)} ${cfg.unit}`, x + W / 2, y + 128, { size: 12, color: COL.dim, align: 'center' });
    text(ctx, Sim.fmt(cfg.viewMax, cfg.decimals), x + W - 24, y + 128, { size: 12, color: COL.faint, align: 'right' });

    let line;
    let lineColor = COL.dim;
    if (stuck) {
      line = 'VÁLVULA TRABADA: no responde hasta desatorarla';
      lineColor = COL.red;
    } else if (d.lying) {
      line = 'SENSOR LOCO: la lectura miente. Calibra antes de fiarte.';
      lineColor = '#c38bff';
    } else if (status === 'low' || status === 'high') {
      line = `${cfg[status].cause.toUpperCase()}: ${cfg[status].effect}. Corrige:`;
      lineColor = COL.red;
    } else {
      line = 'Mantén la aguja en la banda verde clara:';
    }
    text(ctx, line, x + 24, y + 156, { size: 14, weight: 600, color: lineColor });
    if (!stuck && !d.lying) {
      ctx.font = font(14, 600);
      const lw = ctx.measureText(line).width;
      PF.Draw.hints(ctx, [[{ key: 'A / D', pad: 'dpadLR' }, 'ajustar']], x + 34 + lw, y + 151, { size: 12, ink: lineColor, color: COL.gold });
    }

    // Derivas en esta estación.
    const drift = events.find((e) => e.kind === 'adjust');
    if (drift) {
      text(ctx, drift.name.toUpperCase() + ' — estabiliza en la banda ideal', x + 24, y + 186, { size: 14, weight: 700, color: COL.warn });
      ctx.fillStyle = '#26303a';
      ctx.fillRect(x + 24, y + 196, W - 48, 8);
      ctx.fillStyle = COL.ok;
      ctx.fillRect(x + 24, y + 196, (W - 48) * Math.min(1, drift.settle / C.SETTLE_TIME), 8);
    } else if (!repair) {
      const others = events.length ? '' : 'Sin fallas en esta estación.';
      text(ctx, others, x + 24, y + 194, { size: 14, color: COL.faint });
    }

    if (repair) drawMinigame(r, repair, x + 24, y + 218, W - 48, 124);

    if (blocked) {
      const blink = Math.floor(r.t * 6) % 2 === 0;
      ctx.fillStyle = blink ? 'rgba(120,10,10,0.85)' : 'rgba(80,10,10,0.85)';
      roundRect(ctx, x, y, W, H, 12);
      ctx.fill();
      text(ctx, '⚡ ESTACIÓN BLOQUEADA ⚡', x + W / 2, y + H / 2, { size: 30, weight: 800, color: '#fff', align: 'center' });
      text(ctx, 'Espera a que se restablezca…', x + W / 2, y + H / 2 + 30, { size: 15, color: '#ffd0d0', align: 'center' });
    }
  }

  function drawMinigame(r, ev, x, y, w, h) {
    const ctx = r.ctx;
    const mg = ev.mg;
    const t = r.t;
    ctx.fillStyle = '#0c1218';
    roundRect(ctx, x, y, w, h, 8);
    ctx.fill();
    ctx.strokeStyle = mg.flash > 0 ? COL.red : '#24303b';
    ctx.lineWidth = 2;
    ctx.stroke();
    text(ctx, ev.name.toUpperCase(), x + 14, y + 24, { size: 15, weight: 700, color: COL.warn });
    text(ctx, PF.Draw.keysText(ev.hint), x + w - 14, y + 24, { size: 13, color: COL.text, align: 'right' });
    const cx = x + w / 2;
    const ratio = PF.Minigames[mg.type].ratio(mg);

    if (mg.type === 'hold') {
      if (mg.active) text(ctx, 'ENFRIANDO…', cx, y + 60, { size: 22, weight: 800, color: '#7fd3ff', align: 'center' });
      else PF.Draw.hints(ctx, [[{ key: 'ESPACIO', pad: 'a' }, 'mantén para enfriar']], cx, y + 54, { size: 15, align: 'center', ink: COL.text, color: '#7fd3ff' });
      progressBar(ctx, x + 40, y + 78, w - 80, 20, ratio, '#7fd3ff');
      if (mg.active) {
        for (let i = 0; i < 6; i++) {
          const px = x + 60 + ((t * 160 + i * 90) % (w - 120));
          text(ctx, '❄', px, y + 116, { size: 14, color: '#bfe8ff', align: 'center' });
        }
      }
    } else if (mg.type === 'arrows') {
      const n = mg.seq.length;
      const size = 48;
      const gap = 14;
      const sx = cx - (n * size + (n - 1) * gap) / 2;
      mg.seq.forEach((dir, i) => {
        const bx = sx + i * (size + gap);
        const done = i < mg.idx;
        const cur = i === mg.idx;
        ctx.fillStyle = mg.flash > 0 ? '#4a1414' : done ? COL.okDark : cur ? '#3b3418' : '#1d262f';
        roundRect(ctx, bx, y + 42, size, size, 8);
        ctx.fill();
        if (cur) {
          ctx.strokeStyle = COL.gold;
          ctx.lineWidth = 3;
          ctx.stroke();
        }
        text(ctx, ARROW_GLYPH[dir], bx + size / 2, y + 42 + size / 2 + 11, { size: 32, weight: 800, color: done ? COL.ok : cur ? COL.gold : COL.dim, align: 'center' });
      });
      if (mg.flash > 0) text(ctx, '¡Atascó! Secuencia nueva', cx, y + 114, { size: 13, color: COL.red, align: 'center' });
      else PF.Draw.hints(ctx, [[{ key: 'Flechas', pad: 'dpad' }, 'repite la secuencia']], cx, y + 110, { size: 11, align: 'center', ink: COL.dim, color: COL.gold });
    } else if (mg.type === 'pressure') {
      const gx = x + 40;
      const gw = w - 220;
      const gy = y + 52;
      ctx.fillStyle = '#26303a';
      roundRect(ctx, gx, gy, gw, 26, 6);
      ctx.fill();
      ctx.fillStyle = COL.okDark;
      ctx.fillRect(gx + mg.zone[0] * gw, gy, (mg.zone[1] - mg.zone[0]) * gw, 26);
      const inZone = mg.p >= mg.zone[0] && mg.p <= mg.zone[1];
      ctx.fillStyle = inZone ? COL.ok : COL.warn;
      ctx.fillRect(gx + mg.p * gw - 3, gy - 6, 6, 38);
      text(ctx, 'PRESIÓN', gx, gy + 48, { size: 12, color: COL.dim });
      PF.Draw.hints(ctx, [[{ key: 'ESPACIO', pad: 'a' }, 'sube · suelta para bajar']], gx + gw, gy + 44, { size: 11, align: 'right', ink: COL.dim, color: COL.gold });
      // Progreso de purga como anillo.
      const rx = x + w - 80;
      const ry = y + 76;
      ctx.lineWidth = 10;
      ctx.strokeStyle = '#26303a';
      ctx.beginPath();
      ctx.arc(rx, ry, 30, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = COL.ok;
      ctx.beginPath();
      ctx.arc(rx, ry, 30, -Math.PI / 2, -Math.PI / 2 + ratio * Math.PI * 2);
      ctx.stroke();
      text(ctx, 'PURGA', rx, ry + 5, { size: 12, weight: 700, color: COL.dim, align: 'center' });
    } else if (mg.type === 'timing') {
      const gx = x + 40;
      const gw = w - 80;
      const gy = y + 52;
      ctx.fillStyle = '#26303a';
      roundRect(ctx, gx, gy, gw, 30, 6);
      ctx.fill();
      ctx.fillStyle = mg.good > 0 ? COL.ok : '#2f6f8f';
      ctx.fillRect(gx + (mg.zone.c - mg.zone.w / 2) * gw, gy, mg.zone.w * gw, 30);
      ctx.fillStyle = mg.flash > 0 ? COL.red : '#fff';
      ctx.fillRect(gx + mg.pos * gw - 3, gy - 8, 6, 46);
      for (let i = 0; i < mg.need; i++) {
        ctx.fillStyle = i < mg.hits ? COL.ok : '#26303a';
        ctx.beginPath();
        ctx.arc(cx - (mg.need - 1) * 14 + i * 28, y + 106, 8, 0, Math.PI * 2);
        ctx.fill();
      }
      text(ctx, 'ANTIESPUMANTE', gx, y + 110, { size: 12, color: COL.dim });
      PF.Draw.hints(ctx, [[{ key: 'ESPACIO', pad: 'a' }, 'cuando la aguja esté en la zona']], gx + gw, y + 106, { size: 11, align: 'right', ink: COL.dim, color: COL.gold });
    } else if (mg.type === 'simon') {
      const size = 56;
      const gap = 18;
      const sx = cx - (4 * size + 3 * gap) / 2;
      for (let i = 0; i < 4; i++) {
        const bx = sx + i * (size + gap);
        const lit = mg.lit === i || (mg.press === i && mg.pressT > 0);
        ctx.fillStyle = SIMON_COLORS[i];
        ctx.globalAlpha = lit ? 1 : 0.25;
        roundRect(ctx, bx, y + 36, size, size, 10);
        ctx.fill();
        ctx.globalAlpha = 1;
        // Teclado: 1-4. Mando: L1 R1 L2 R2 (LB RB LT RT).
        const device = PF.Draw.InputState.device;
        if (device === 'keyboard') text(ctx, String(i + 1), bx + size / 2, y + 36 + size / 2 + 9, { size: 26, weight: 800, color: lit ? '#111' : '#ddd', align: 'center' });
        else PF.Draw.padGlyph(ctx, device, ['lb', 'rb', 'lt', 'rt'][i], bx + size / 2, y + 36 + size / 2, 15);
      }
      const msg = mg.flash > 0 ? '¡Error! Mira el patrón de nuevo' : mg.phase === 'show' ? 'Memoriza el patrón…' : `Repite el patrón con los botones  (${mg.idx}/${mg.seq.length})`;
      text(ctx, msg, cx, y + 114, { size: 13, color: mg.flash > 0 ? COL.red : COL.dim, align: 'center' });
    }
  }

  function progressBar(ctx, x, y, w, h, ratio, color) {
    ctx.fillStyle = '#26303a';
    roundRect(ctx, x, y, w, h, h / 2);
    ctx.fill();
    if (ratio > 0) {
      ctx.fillStyle = color;
      roundRect(ctx, x, y, Math.max(h, w * ratio), h, h / 2);
      ctx.fill();
    }
  }

  // Los avisos grandes (r.fx.banner) los dibuja el panel de mensajes, no el mapa.
  function drawGame(r, g) {
    PF.Draw.begin(r);
    const alarms = Sim.alarms(g);
    drawMap(r, g, alarms);
    drawStationPanel(r, g);
    drawTopBar(r, g);
    drawSidebar(r, g, alarms);
  }

  PF.Render = { resetFx, update, onSignal, drawGame };
})();
</script>
    <script>
// Burbuja de pensamiento del operario: aparece cuando el jugador se equivoca
// ("¡Esto no va así!") y explica por qué. También sirve para avisos y aciertos.
// Los mensajes se muestran en un panel lateral fijo (no tapan el juego); sobre el
// operario solo aparece un pequeño indicador de "está pensando".
(function () {
  'use strict';
  const PF = globalThis.PF || (globalThis.PF = {});
  const D = PF.Draw;

  const KINDS = {
    error: { title: '¡Esto no va así!', color: '#d8321f', icon: '✖' },
    tip: { title: 'Ojo…', color: '#c4501a', icon: '?' },
    ok: { title: '¡Así sí!', color: '#2f8a3a', icon: '✔' },
  };
  const INK = '#2a170d';
  const PAPER = '#fff4e2';

  function create() {
    return { cur: null, log: [] };
  }

  // Muestra un mensaje. Los errores quedan registrados para el reporte final.
  function say(b, message, { kind = 'error', title = null, life = null } = {}) {
    const k = KINDS[kind] || KINDS.error;
    const ttl = life || Math.min(7, 3.5 + message.length / 35);
    if (b.cur && b.cur.message === message) {
      b.cur.life = Math.max(b.cur.life, ttl);
      b.cur.shake = 0.3;
    } else {
      b.cur = { message, kind, title: title || k.title, life: ttl, max: ttl, age: 0, shake: kind === 'error' ? 0.3 : 0 };
    }
    if (kind === 'error') {
      if (!b.log.includes(message)) b.log.push(message);
      D.sfx('oops');
    }
    return b.cur;
  }

  function update(b, dt) {
    if (!b.cur) return;
    b.cur.age += dt;
    b.cur.life -= dt;
    b.cur.shake = Math.max(0, b.cur.shake - dt);
    if (b.cur.life <= 0) b.cur = null;
  }

  function clear(b) {
    b.cur = null;
  }

  function fadeOf(item) {
    if (item.life == null) return 1;
    const inA = item.max != null ? Math.min(1, (item.max - item.life) / 0.2) : 1;
    return Math.max(0, Math.min(1, item.life / 0.4, inA));
  }

  // ------------------------------------------------------- Indicador

  // Nubecita junto a la cabeza del operario (a su derecha, sin tapar la indicación
  // de "operar" que va encima): "mira el panel de mensajes".
  function marker(ctx, b, anchor, t) {
    const c = b.cur;
    if (!c) return;
    const k = KINDS[c.kind] || KINDS.error;
    const x = anchor.x + 40;
    const y = anchor.y - 30 + Math.sin(t * 6) * 2;
    ctx.save();
    ctx.globalAlpha = fadeOf(c);
    ctx.fillStyle = PAPER;
    ctx.strokeStyle = INK;
    ctx.lineWidth = 2;
    for (const [dx, dy, r] of [
      [-12, 24, 3],
      [-6, 15, 4.5],
    ]) {
      ctx.beginPath();
      ctx.arc(x + dx, y + dy, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(x - 7, y, 9, 0, Math.PI * 2);
    ctx.arc(x + 7, y, 9, 0, Math.PI * 2);
    ctx.arc(x, y - 6, 10, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fill();
    ctx.fillStyle = k.color;
    ctx.beginPath();
    ctx.arc(x, y - 2, 8, 0, Math.PI * 2);
    ctx.fill();
    D.text(ctx, k.icon, x, y + 3, { size: 12, weight: 800, color: '#fff', align: 'center' });
    // Flecha hacia el panel de mensajes (a la derecha).
    ctx.fillStyle = k.color;
    ctx.globalAlpha *= 0.6 + 0.4 * Math.sin(t * 8);
    ctx.beginPath();
    ctx.moveTo(x + 24, y - 2);
    ctx.lineTo(x + 16, y - 8);
    ctx.lineTo(x + 16, y + 4);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // ------------------------------------------------------- Tarjetas

  // Aviso del panel. n = { text, sub, color, life, max, kind: 'banner'|'paper'|'toast', actions, shake }
  // Devuelve la altura usada.
  function notice(ctx, n, x, y, w, t, { maxLines = 3, measureOnly = false } = {}) {
    const kind = n.kind || 'banner';
    const pad = 12;
    ctx.font = D.font(kind === 'toast' ? 17 : 17, 800);
    const titleLines = n.text ? D.wrap(ctx, n.text, w - pad * 2 - 6).slice(0, 2) : [];
    ctx.font = D.font(14, 600);
    const subLines = n.sub ? D.wrap(ctx, n.sub, w - pad * 2 - 6).slice(0, maxLines) : [];
    const actions = n.actions || [];
    const h = pad + titleLines.length * 20 + (n.label ? 16 : 0) + subLines.length * 18 + (actions.length ? 30 : 0) + pad - 2;
    if (measureOnly) return h;
    ctx.save();
    ctx.globalAlpha = fadeOf(n);
    let sx = 0;
    if (n.shake) sx = Math.sin(t * 50) * 4 * Math.min(1, n.shake);
    ctx.translate(sx, 0);
    const color = n.color || D.T.orange;
    if (kind === 'paper') {
      D.panel(ctx, x, y, w, h, { fill: '#f2e3c6', edge: D.T.brass, radius: 8 });
    } else {
      // Los avisos recién llegados brillan un momento para llamar la atención.
      const fresh = n.max != null && n.max - n.life < 1.2;
      D.panel(ctx, x, y, w, h, { fill: kind === 'toast' ? '#2a0f0a' : '#1e130e', edge: color, radius: 8, glow: kind === 'toast' || fresh ? color : null });
      ctx.fillStyle = color;
      D.roundRect(ctx, x, y, 6, h, 3);
      ctx.fill();
    }
    let ty = y + pad + 4;
    if (n.label) {
      D.text(ctx, n.label, x + pad + 4, ty + 6, { size: 12, weight: 800, color: kind === 'paper' ? '#7a3010' : color });
      ty += 16;
    }
    const titleColor = kind === 'paper' ? '#7a3010' : kind === 'toast' ? D.T.ink : color;
    titleLines.forEach((l) => {
      D.text(ctx, l, x + pad + 4, ty + 10, { size: 17, weight: 800, color: titleColor });
      ty += 20;
    });
    subLines.forEach((l) => {
      D.text(ctx, l, x + pad + 4, ty + 8, { size: 14, weight: 600, color: kind === 'paper' ? INK : D.T.ink });
      ty += 18;
    });
    if (actions.length) D.hints(ctx, actions, x + pad + 4, ty + 14, { size: 12, gap: 16, ink: D.T.dim, color });
    if (n.progress != null) D.progressBar(ctx, x + 10, y + h - 5, w - 20, 3, n.progress, color);
    ctx.restore();
    return h;
  }

  // Nube de pensamiento con el operario a la izquierda. Devuelve la altura usada.
  // compact: título a la izquierda y mensaje al lado (para la barra horizontal).
  function cloud(ctx, c, x, y, w, maxH, t, { maxLines = 6, compact = false } = {}) {
    const k = KINDS[c.kind] || KINDS.error;
    const left = x + 34;
    const cw = w - 40;
    ctx.font = D.font(19, 800);
    const titleW = compact ? ctx.measureText(c.title).width + 52 : 0;
    ctx.font = D.font(15, 600);
    const room = compact ? Math.max(1, Math.floor((maxH - 12) / 18)) : Math.max(1, Math.floor((maxH - 52) / 19));
    const lines = D.wrap(ctx, c.message, cw - 34 - titleW).slice(0, Math.min(maxLines, room));
    const h = compact ? maxH : 46 + lines.length * 19;
    ctx.save();
    ctx.globalAlpha = fadeOf(c);
    const pop = Math.min(1, c.age / 0.22);
    const sx = c.shake > 0 ? Math.sin(c.age * 70) * 4 * (c.shake / 0.3) : 0;
    // Operario pensando.
    const ax = x + 12;
    const ay = y + h - 14;
    ctx.fillStyle = '#e8742c';
    D.roundRect(ctx, ax - 10, ay - 10, 20, 24, 8);
    ctx.fill();
    ctx.fillStyle = '#9fdcf2';
    D.roundRect(ctx, ax - 2, ay - 6, 11, 7, 3);
    ctx.fill();
    ctx.fillStyle = '#ffd34d';
    ctx.beginPath();
    ctx.ellipse(ax, ay - 10, 10, 4, 0, Math.PI, 0);
    ctx.fill();
    ctx.fillStyle = PAPER;
    ctx.strokeStyle = INK;
    ctx.lineWidth = 2;
    [
      [ax + 10, ay - 22, 3],
      [ax + 18, ay - 34, 4.5],
    ].forEach(([cx, cy, r]) => {
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    });
    // Nube.
    ctx.translate(sx, 0);
    const s = pop < 1 ? 0.85 + 0.15 * Math.sin((pop * Math.PI) / 1.6) : 1;
    ctx.translate(left + cw / 2, y + h / 2);
    ctx.scale(s, s);
    ctx.translate(-(left + cw / 2), -(y + h / 2));
    ctx.beginPath();
    const bumps = Math.max(3, Math.round(cw / 52));
    for (let i = 0; i < bumps; i++) {
      const px = left + 16 + (i * (cw - 32)) / (bumps - 1);
      ctx.moveTo(px + 14, y + 6);
      ctx.arc(px, y + 6, 14, 0, Math.PI * 2);
      ctx.moveTo(px + 14, y + h - 6);
      ctx.arc(px, y + h - 6, 14, 0, Math.PI * 2);
    }
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.fill();
    ctx.fillRect(left, y + 2, cw, h - 4);
    ctx.fillStyle = k.color;
    if (!compact) {
      ctx.beginPath();
      ctx.arc(left + 18, y + 20, 11, 0, Math.PI * 2);
      ctx.fill();
    }
    if (compact) {
      const my = y + h / 2;
      ctx.beginPath();
      ctx.arc(left + 18, my - 2, 11, 0, Math.PI * 2);
      ctx.fill();
      D.text(ctx, k.icon, left + 18, my + 3, { size: 14, weight: 800, color: '#fff', align: 'center' });
      D.text(ctx, c.title, left + 36, my + 4, { size: 19, weight: 800, color: k.color });
      const ly = my + 5 - ((lines.length - 1) * 18) / 2;
      lines.forEach((l, i) => D.text(ctx, l, left + titleW, ly + i * 18, { size: 15, weight: 600, color: INK }));
    } else {
      D.text(ctx, k.icon, left + 18, y + 25, { size: 14, weight: 800, color: '#fff', align: 'center' });
      D.text(ctx, c.title, left + 36, y + 26, { size: 19, weight: 800, color: k.color });
      lines.forEach((l, i) => D.text(ctx, l, left + 12, y + 50 + i * 19, { size: 15, weight: 600, color: INK }));
    }
    ctx.restore();
    return h;
  }

  // ------------------------------------------------------- Paneles

  // Panel lateral de mensajes: avisos arriba, la burbuja de pensamiento debajo.
  function dock(ctx, rect, { bubble = null, notices = [], t = 0, empty = 'Aquí aparecen los avisos y lo que piensa el operario.' } = {}) {
    const items = notices.filter(Boolean);
    D.text(ctx, 'MENSAJES', rect.x, rect.y + 12, { size: 13, weight: 700, color: D.T.dim });
    ctx.fillStyle = D.T.edge;
    ctx.fillRect(rect.x + 80, rect.y + 7, rect.w - 80, 1);
    let y = rect.y + 24;
    const bottom = rect.y + rect.h;
    const cur = bubble && bubble.cur;
    // La burbuja tiene prioridad de espacio: los avisos se acortan si hace falta.
    const reserve = cur ? 46 + 19 * 2 : 0;
    for (const n of items) {
      const h = notice(ctx, n, rect.x, y, rect.w, t, { measureOnly: true });
      if (y + h > bottom - reserve) continue;
      y += notice(ctx, n, rect.x, y, rect.w, t) + 8;
    }
    if (cur) y += cloud(ctx, cur, rect.x, y, rect.w, bottom - y, t);
    if (!items.length && !cur) D.paragraph(ctx, empty, rect.x, rect.y + 46, rect.w, { size: 13, color: D.T.faint });
  }

  // Barra horizontal de mensajes (para juegos sin barra lateral).
  function bar(ctx, rect, { bubble = null, notices = [], t = 0, split = 0.6 } = {}) {
    D.panel(ctx, rect.x, rect.y, rect.w, rect.h, { fill: '#100906', edge: '#2e1d13', radius: 10 });
    const n = notices.filter(Boolean)[0];
    // Sin avisos, la burbuja usa todo el ancho para que quepan las explicaciones largas.
    const lw = n ? Math.round(rect.w * split) : rect.w;
    const cur = bubble && bubble.cur;
    if (cur) cloud(ctx, cur, rect.x + 8, rect.y + 8, lw - 16, rect.h - 16, t, { maxLines: 2, compact: true });
    else D.text(ctx, 'Aquí aparecen los avisos del operario', rect.x + 20, rect.y + rect.h / 2 + 5, { size: 14, color: D.T.faint });
    if (n) {
      const nx = rect.x + lw;
      const nw = rect.w - lw - 8;
      ctx.save();
      ctx.beginPath();
      ctx.rect(nx, rect.y + 4, nw, rect.h - 8);
      ctx.clip();
      notice(ctx, n, nx, rect.y + 6, nw, t, { maxLines: 1 });
      ctx.restore();
    }
  }

  PF.Bubble = { create, say, update, clear, marker, notice, cloud, dock, bar, KINDS };
})();
</script>
    <script>
// Movimiento cenital con colisiones y estaciones, compartido por los juegos de mapa.
(function () {
  'use strict';
  const PF = globalThis.PF || (globalThis.PF = {});

  const RADIUS = 16;

  function clamp(x, a, b) {
    return x < a ? a : x > b ? b : x;
  }

  function make({ bounds = PF.Draw.MAP_BOUNDS, solids = [], stations = {}, start, speed = 260, interact = 70 }) {
    return { bounds, solids, stations, start, speed, interact };
  }

  function newPlayer(world) {
    return { x: world.start.x, y: world.start.y, facing: 1, moving: false, walkT: 0 };
  }

  function collides(world, x, y) {
    const b = world.bounds;
    if (x - RADIUS < b.x || x + RADIUS > b.x + b.w || y - RADIUS < b.y || y + RADIUS > b.y + b.h) return true;
    for (const s of world.solids) {
      const cx = clamp(x, s.x, s.x + s.w);
      const cy = clamp(y, s.y, s.y + s.h);
      if ((x - cx) ** 2 + (y - cy) ** 2 < RADIUS * RADIUS) return true;
    }
    return false;
  }

  function move(world, p, input, dt, speedMul = 1) {
    let mx = input.moveX;
    let my = input.moveY;
    const len = Math.hypot(mx, my);
    if (!len) {
      p.moving = false;
      return;
    }
    mx /= len;
    my /= len;
    const step = world.speed * speedMul * dt;
    const nx = p.x + mx * step;
    if (!collides(world, nx, p.y)) p.x = nx;
    const ny = p.y + my * step;
    if (!collides(world, p.x, ny)) p.y = ny;
    if (mx) p.facing = Math.sign(mx);
    p.moving = true;
    p.walkT += dt;
  }

  // Estación interactiva más cercana dentro del radio de interacción.
  function nearest(world, p, filter = null) {
    let best = null;
    let bestD = world.interact;
    for (const st of Object.values(world.stations)) {
      if (!st.spot || (filter && !filter(st))) continue;
      const d = Math.hypot(p.x - st.spot.x, p.y - st.spot.y);
      if (d <= bestD) {
        best = st;
        bestD = d;
      }
    }
    return best;
  }

  function teleport(world, p, stationId) {
    const s = world.stations[stationId].spot;
    p.x = s.x;
    p.y = s.y;
  }

  // Todas las piezas sólidas: obstáculos más carcasas de estaciones.
  function solidsOf(obstacles, stations) {
    return obstacles.concat(Object.values(stations).map((s) => s.rect));
  }

  PF.World = { make, newPlayer, collides, move, nearest, teleport, solidsOf, RADIUS };
})();
</script>

    <script>
// Pantallas de la colección: menú de juegos, selector de dificultad, pausa y
// "Reporte de Calidad". Estética del afiche: negro, naranja quemado y latón.
(function () {
  'use strict';
  const PF = globalThis.PF || (globalThis.PF = {});
  const D = PF.Draw;
  const T = D.T;
  const V = D.VIEW;

  const CARD = { w: 270, h: 392, gap: 16, y: 214 };

  function menuCards(n) {
    const w = Math.min(CARD.w, Math.floor((V.width - 56 - (n - 1) * CARD.gap) / n));
    const total = n * w + (n - 1) * CARD.gap;
    const x0 = (V.width - total) / 2;
    return Array.from({ length: n }, (_, i) => ({ x: x0 + i * (w + CARD.gap), y: CARD.y, w, h: CARD.h }));
  }

  // rows: filas de opciones extra bajo las tarjetas (0, 1 o 2); con más filas, tarjetas más bajas.
  function diffCards(rows = 0) {
    const h = [146, 124, 108][Math.min(2, +rows)];
    const step = [156, 132, 114][Math.min(2, +rows)];
    return D.DIFFICULTIES.map((d, i) => ({ id: d.id, x: 736, y: 140 + i * step, w: 504, h }));
  }

  // Opciones extra del juego (duración en Control de UP; modo y tiempo de respuesta en Supervisor de Turno).
  // game.choices = [{ key, title, values: [{ value, label }], index }] (index: valor por defecto).
  function choicesOf(game) {
    if (game.choices) return game.choices;
    if (game.choice) return [game.choice];
    if (game.durations) {
      return [{ key: 'duration', title: 'DURACIÓN', values: game.durations.map((v) => ({ value: v, label: `${v} s` })), index: game.durations.length - 1 }];
    }
    return [];
  }

  function choiceOf(game) {
    return choicesOf(game)[0] || null;
  }

  // row: fila de la opción; con dos filas, la primera sube para dejar sitio a la segunda.
  function choiceChips(choice, row = 0, rows = 1) {
    const gap = 8;
    const widths = choice.values.map((v) => Math.max(56, v.label.length * 11 + 24));
    const total = widths.reduce((a, b) => a + b, 0) + gap * (widths.length - 1);
    let x = 736 + 504 - total;
    const y = 548 - (rows - 1 - row) * 58;
    return choice.values.map((v, i) => {
      const c = { value: v.value, label: v.label, x, y, w: widths[i], h: 44 };
      x += widths[i] + gap;
      return c;
    });
  }

  function playButton() {
    return { x: 736, y: 636, w: 504, h: 56 };
  }

  // Engranajes steampunk y brasas de fondo.
  function backdrop(ctx, t, accent = T.orange) {
    const g = ctx.createRadialGradient(V.width / 2, 120, 40, V.width / 2, 260, 760);
    g.addColorStop(0, 'rgba(196,80,26,0.35)');
    g.addColorStop(1, 'rgba(10,6,5,0)');
    ctx.fillStyle = T.bg;
    ctx.fillRect(0, 0, V.width, V.height);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, V.width, V.height);
    gear(ctx, 70, 80, 90, 12, t * 0.2, '#2a1a10');
    gear(ctx, 190, 30, 50, 9, -t * 0.36, '#24160d');
    gear(ctx, V.width - 80, V.height - 70, 110, 14, -t * 0.15, '#2a1a10');
    gear(ctx, V.width - 210, V.height - 20, 56, 10, t * 0.3, '#24160d');
    for (let i = 0; i < 26; i++) {
      const k = (t * 0.05 + i * 0.137) % 1;
      const x = ((i * 197) % V.width) + Math.sin(t + i) * 12;
      const y = V.height - k * V.height;
      ctx.globalAlpha = (1 - k) * 0.7;
      ctx.fillStyle = i % 3 ? accent : T.warn;
      ctx.beginPath();
      ctx.arc(x, y, 1.5 + (i % 3), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function gear(ctx, x, y, r, teeth, rot, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i = 0; i < teeth * 2; i++) {
      const a = (i / (teeth * 2)) * Math.PI * 2;
      const rr = i % 2 ? r : r * 0.82;
      ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = T.bg;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function glowText(ctx, str, x, y, size, color, glow) {
    ctx.save();
    ctx.shadowColor = glow;
    ctx.shadowBlur = 26;
    D.text(ctx, str, x, y, { size, weight: 800, color, align: 'center' });
    ctx.restore();
  }

  function bestLabel(best) {
    return best ? `${best.rank} · ${best.score}` : '—';
  }

  // ------------------------------------------------------------ Menú

  // Botones del menú: configuración (con clave) y pantalla completa (táctiles).
  function gearButton() {
    return { x: 1196, y: 18, w: 66, h: 66 };
  }

  function fullscreenButton() {
    return { x: 18, y: 18, w: 66, h: 66 };
  }

  function iconButton(ctx, rc, glyph, caption, color = T.dim) {
    D.panel(ctx, rc.x, rc.y, rc.w, rc.h, { fill: '#170e0a', edge: '#3a2418', radius: 14 });
    D.text(ctx, glyph, rc.x + rc.w / 2, rc.y + 38, { size: 30, weight: 700, color, align: 'center' });
    D.text(ctx, caption, rc.x + rc.w / 2, rc.y + 58, { size: 11, weight: 700, color: T.faint, align: 'center' });
  }

  // settings: esta versión ofrece la configuración (la versión "sin ajustes" no).
  function drawMenu(ctx, t, games, sel, records, { fullscreen = false, settings = true } = {}) {
    backdrop(ctx, t);
    if (settings) iconButton(ctx, gearButton(), '⚙', 'ajustes');
    if (fullscreen) iconButton(ctx, fullscreenButton(), '⛶', 'pantalla');
    glowText(ctx, 'LO QUE NO SE VE,', V.width / 2, 92, 54, T.ink, T.orange);
    glowText(ctx, 'TAMBIÉN SE LIMPIA', V.width / 2, 150, 60, T.orange, T.orangeDark);
    D.text(ctx, 'Colección de juegos de calidad · partidas cortas para aprender jugando', V.width / 2, 188, { size: 19, weight: 600, color: T.dim, align: 'center' });

    const cards = menuCards(games.length);
    games.forEach((game, i) => {
      const c = cards[i];
      const on = i === sel;
      const lift = on ? -12 - Math.sin(t * 3) * 2 : 0;
      const x = c.x;
      const y = c.y + lift;
      D.panel(ctx, x, y, c.w, c.h, { fill: on ? '#24150d' : '#170e0a', edge: on ? game.accent : '#3a2418', radius: 16, glow: on ? game.accent : null });
      // Ilustración.
      ctx.save();
      ctx.beginPath();
      D.roundRect(ctx, x + 12, y + 12, c.w - 24, 150, 12);
      ctx.clip();
      const bg = ctx.createRadialGradient(x + c.w / 2, y + 90, 10, x + c.w / 2, y + 90, 160);
      bg.addColorStop(0, on ? '#3a2214' : '#24160e');
      bg.addColorStop(1, '#0d0806');
      ctx.fillStyle = bg;
      ctx.fillRect(x + 12, y + 12, c.w - 24, 150);
      game.icon(ctx, x + c.w / 2, y + 88, Math.min(120, c.w * 0.5), on ? t : 0);
      ctx.restore();
      D.keycap(ctx, String(i + 1), x + 30, y + 30, { size: 15, color: on ? game.accent : '#5a4030' });

      // Con muchas tarjetas, el título se achica si una palabra no cabe en el ancho.
      let ts = c.w < 250 ? 23 : 27;
      ctx.font = D.font(ts, 800);
      const words = game.title.toUpperCase().split(' ');
      while (ts > 16 && words.some((w) => ctx.measureText(w).width > c.w - 32)) ctx.font = D.font(--ts, 800);
      const lines = D.wrap(ctx, game.title.toUpperCase(), c.w - 32);
      lines.forEach((l, j) => D.text(ctx, l, x + 16, y + 196 + j * (ts + 1), { size: ts, weight: 800, color: on ? T.ink : T.dim }));
      const ty = y + 196 + lines.length * (ts + 1);
      let ss = 16;
      ctx.font = D.font(ss, 700);
      while (ctx.measureText(game.subtitle).width > c.w - 32 && ss > 11) ctx.font = D.font(--ss, 700);
      D.text(ctx, game.subtitle, x + 16, ty, { size: ss, weight: 700, color: game.accent });
      D.paragraph(ctx, game.tagline, x + 16, ty + 26, c.w - 32, { size: 15, weight: 500, color: on ? T.ink : T.faint, maxLines: 3 });

      // Récords por dificultad.
      const rec = records[game.id] || {};
      const chipW = Math.floor((c.w - 32 - 12) / 3);
      D.DIFFICULTIES.forEach((d, j) => {
        const bx = x + 16 + j * (chipW + 6);
        const by = y + c.h - 46;
        ctx.fillStyle = '#100906';
        D.roundRect(ctx, bx, by, chipW, 32, 6);
        ctx.fill();
        D.text(ctx, d.label[0], bx + 12, by + 21, { size: 13, weight: 800, color: d.color });
        const b = rec[d.id];
        D.text(ctx, b ? b.rank : '—', bx + chipW - 12, by + 22, { size: 18, weight: 800, color: b ? D.rankColor(b.rank) : T.faint, align: 'right' });
      });
    });

    const device = D.InputState.device;
    if (device === 'touch') D.text(ctx, '☝  Toca un juego para empezar', V.width / 2, 668, { size: 20, weight: 700, color: T.dim, align: 'center' });
    else {
      D.hints(
        ctx,
        [
          [{ key: '← →', pad: 'dpadLR' }, 'elegir juego'],
          [{ key: 'ENTER', pad: 'a' }, 'continuar'],
          ...(settings ? [[{ key: 'C', pad: 'select' }, 'ajustes']] : []),
        ].concat(device === 'keyboard' ? [[{ key: 'M' }, 'sonido']] : []),
        V.width / 2,
        664,
        { size: 15, gap: 40, ink: T.dim, align: 'center' }
      );
    }
    D.text(ctx, padStatus(), V.width / 2, 700, { size: 14, color: T.faint, align: 'center' });
  }

  // ------------------------------------------------------- Dificultad

  function padStatus() {
    const type = D.InputState.padType;
    if (D.InputState.device === 'touch') return 'Pantalla táctil · también funciona con teclado, ratón y mandos PS o Xbox';
    if (!type) return 'Teclado y ratón · conecta un mando PS o Xbox y pulsa cualquier botón para usarlo';
    return `Mando ${type === 'ps' ? 'PlayStation' : 'Xbox'} conectado · los botones en pantalla se adaptan al mando`;
  }

  // values: valor elegido en cada fila de opciones; focus: fila activa (-1 = dificultad).
  // locked: dificultad fijada por la configuración (no se puede cambiar).
  function drawSetup(ctx, t, game, diffSel, records, values = [], focus = -1, { locked = false } = {}) {
    backdrop(ctx, t, game.accent);
    D.panel(ctx, 40, 40, 670, 652, { fill: '#160d09', edge: '#3a2418', radius: 16 });
    ctx.save();
    ctx.beginPath();
    D.roundRect(ctx, 56, 56, 150, 150, 14);
    ctx.clip();
    ctx.fillStyle = '#24150d';
    ctx.fillRect(56, 56, 150, 150);
    game.icon(ctx, 131, 131, 130, t);
    ctx.restore();
    ctx.font = D.font(38, 800);
    const tl = D.wrap(ctx, game.title.toUpperCase(), 470);
    tl.forEach((l, i) => D.text(ctx, l, 226, 104 + i * 38, { size: 38, weight: 800 }));
    D.text(ctx, game.subtitle, 226, 104 + tl.length * 38 + 4, { size: 20, weight: 700, color: game.accent });

    D.text(ctx, 'CÓMO SE JUEGA', 60, 252, { size: 15, weight: 800, color: T.dim });
    let y = 284;
    game.howTo.forEach((line, i) => {
      ctx.fillStyle = game.accent;
      ctx.beginPath();
      ctx.arc(72, y - 6, 12, 0, Math.PI * 2);
      ctx.fill();
      D.text(ctx, String(i + 1), 72, y - 1, { size: 14, weight: 800, color: '#170e0a', align: 'center' });
      y += D.paragraph(ctx, line, 96, y, 590, { size: 17, weight: 600, color: T.ink }) + 10;
    });

    D.text(ctx, 'CONTROLES', 60, 560, { size: 15, weight: 800, color: T.dim });
    D.text(ctx, { keyboard: 'teclado', ps: 'mando PlayStation', xbox: 'mando Xbox', touch: 'pantalla táctil' }[D.InputState.device] || 'mando Xbox', 190, 560, { size: 14, weight: 700, color: game.accent });
    game.controls.forEach(([k, label, pad], i) => {
      const cx = 60 + (i % 2) * 320;
      const cy = 596 + Math.floor(i / 2) * 44;
      const w = D.control(ctx, { key: k, pad }, cx, cy, { size: 15, color: game.accent });
      D.text(ctx, label, cx + w + 12, cy + 6, { size: 16, weight: 600, color: T.ink });
    });

    D.text(ctx, locked ? 'DIFICULTAD FIJADA POR CONFIGURACIÓN' : 'ELIGE LA DIFICULTAD', 736, 120, { size: 20, weight: 800, color: T.ink });
    drawButton(ctx, backButton(), { key: 'ESC', pad: 'b' }, '◀ VOLVER', { color: game.accent });
    const rec = records[game.id] || {};
    const choices = choicesOf(game);
    const rows = choices.length;
    const compact = rows > 0;
    const tight = rows > 1;
    diffCards(rows).forEach((c, i) => {
      const d = D.DIFFICULTIES[i];
      const on = i === diffSel;
      ctx.save();
      if (locked && !on) ctx.globalAlpha = 0.3;
      D.panel(ctx, c.x, c.y, c.w, c.h, { fill: on ? '#24150d' : '#140c09', edge: on ? d.color : '#3a2418', radius: 14, glow: on ? d.color : null });
      if (on) {
        ctx.fillStyle = d.color;
        D.roundRect(ctx, c.x, c.y, 10, c.h, 5);
        ctx.fill();
      }
      const top = tight ? 30 : compact ? 34 : 40;
      for (let p = 0; p < 3; p++) D.pumpkin(ctx, c.x + 42 + p * 46, c.y + top, 24, p < d.pumpkins);
      D.text(ctx, d.label, c.x + 172, c.y + top + 10, { size: 32, weight: 800, color: d.color });
      if (D.InputState.device === 'keyboard' && !locked) D.keycap(ctx, String(i + 1), c.x + c.w - 30, c.y + 34, { size: 14, color: on ? d.color : '#5a4030' });
      D.text(ctx, `Récord: ${bestLabel(rec[d.id])}`, c.x + c.w - 54, c.y + 41, { size: 14, weight: 700, color: T.dim, align: 'right' });
      const by = tight ? 62 : compact ? 70 : 82;
      const step = tight ? 18 : compact ? 19 : 22;
      game.difficulties[d.id].forEach((b, j) => {
        D.text(ctx, '•', c.x + 28, c.y + by + j * step, { size: 16, weight: 800, color: d.color });
        D.text(ctx, b, c.x + 44, c.y + by + j * step, { size: tight ? 14 : compact ? 15 : 16, weight: 600, color: on ? T.ink : T.dim });
      });
      if (locked && !on) D.text(ctx, '🔒', c.x + c.w - 30, c.y + c.h - 16, { size: 18, align: 'center' });
      ctx.restore();
    });
    const chosen = [];
    choices.forEach((choice, r) => {
      const chips = choiceChips(choice, r, rows);
      const active = rows > 1 && focus === r;
      const ty = chips[0].y + 28;
      if (active) D.text(ctx, '▸', 736, ty, { size: 17, weight: 800, color: game.accent });
      // El título se achica si no cabe a la izquierda de las opciones.
      const tx = active ? 756 : 736;
      let size = rows > 1 ? 15 : 17;
      ctx.font = D.font(size, 800);
      while (size > 11 && ctx.measureText(choice.title).width > chips[0].x - tx - 10) ctx.font = D.font(--size, 800);
      D.text(ctx, choice.title, tx, ty, { size, weight: 800, color: active ? game.accent : T.ink });
      for (const c of chips) {
        const on = c.value === values[r];
        if (on) chosen.push(c.label);
        D.panel(ctx, c.x, c.y, c.w, c.h, { fill: on ? game.accent : '#140c09', edge: on ? game.accent : '#3a2418', radius: 10, glow: on ? game.accent : null });
        D.text(ctx, c.label, c.x + c.w / 2, c.y + 29, { size: 19, weight: 800, color: on ? '#170e0a' : T.dim, align: 'center' });
      }
    });
    if (rows === 1) D.hints(ctx, [[{ key: '← →', pad: 'dpadLR' }, 'cambiar']], 736, 602, { size: 12, ink: T.dim });
    else if (rows > 1) {
      const what = focus >= 0 ? choices[focus].title.toLowerCase() : choices[0].title.toLowerCase();
      D.hints(ctx, [[{ key: '← →', pad: 'dpadLR' }, `cambiar ${what}`]], 736, 602, { size: 12, ink: T.dim });
    }
    const b = playButton();
    const d = D.DIFFICULTIES[diffSel];
    const pulse = 0.85 + 0.15 * Math.sin(t * 5);
    ctx.save();
    ctx.shadowColor = d.color;
    ctx.shadowBlur = 20 * pulse;
    ctx.fillStyle = d.color;
    D.roundRect(ctx, b.x, b.y, b.w, b.h, 12);
    ctx.fill();
    ctx.restore();
    const label = `▶  JUGAR EN ${[d.label, ...chosen].join(' · ')}`;
    let size = 24;
    ctx.font = D.font(size, 800);
    while (size > 16 && ctx.measureText(label).width > b.w - 140) ctx.font = D.font(--size, 800);
    D.text(ctx, label, b.x + 24, b.y + 29 + size / 3, { size, weight: 800, color: '#170e0a' });
    D.control(ctx, { key: 'ENTER', pad: 'a' }, b.x + b.w - 90, b.y + b.h / 2, { size: 16, color: '#170e0a', keyInk: d.color });
    const nav = locked ? (rows > 1 ? 'opciones' : null) : rows > 1 ? 'dificultad / opciones' : 'dificultad';
    D.hints(
      ctx,
      [...(nav ? [[{ key: '↑ ↓', pad: 'dpadUD' }, nav]] : []), [{ key: 'ESC', pad: 'b' }, 'volver']],
      b.x + b.w / 2,
      b.y - 16,
      { size: 12, ink: T.faint, align: 'center', color: '#6e5a48' }
    );

  // ------------------------------------------------------------ Botones tocables

  function backButton() {
    return { x: 1080, y: 50, w: 160, h: 42 };
  }

  // Botón con su control (tecla, botón del mando o ☝ en pantallas táctiles) y texto.
  function drawButton(ctx, rc, spec, label, { color = T.orange, fill = '#1e130e', ink = T.ink, size = 18 } = {}) {
    D.panel(ctx, rc.x, rc.y, rc.w, rc.h, { fill, edge: color, radius: 10 });
    ctx.font = D.font(size, 800);
    const cw = D.measureControl(ctx, spec, size * 0.8);
    const tw = ctx.measureText(label).width;
    const x0 = rc.x + (rc.w - (cw + 10 + tw)) / 2;
    D.control(ctx, spec, x0, rc.y + rc.h / 2, { size: size * 0.8, color });
    D.text(ctx, label, x0 + cw + 10, rc.y + rc.h / 2 + size * 0.35, { size, weight: 800, color: ink });
  }

  function row(items, y, w, h, gap = 20) {
    const x0 = V.width / 2 - (items.length * w + (items.length - 1) * gap) / 2;
    return items.map((it, i) => ({ ...it, x: x0 + i * (w + gap), y, w, h }));
  }

  function pauseButtons() {
    return row(
      [
        { action: 'start', spec: { key: 'P', pad: 'start' }, label: 'Continuar' },
        { action: 'alt', spec: { key: 'R', pad: 'y' }, label: 'Reiniciar' },
        { action: 'back', spec: { key: 'ESC', pad: 'b' }, label: 'Menú de juegos' },
      ],
      376,
      260,
      58
    );
  }

  // alt: texto del botón para volver a la pantalla de inicio (null si no hay nada que elegir).
  function reportButtons(alt = 'Cambiar dificultad') {
    return row(
      [
        { action: 'confirm', spec: { key: 'ENTER', pad: 'a' }, label: 'Otra vez' },
        ...(alt ? [{ action: 'alt', spec: { key: 'D', pad: 'y' }, label: alt }] : []),
        { action: 'back', spec: { key: 'ESC', pad: 'b' }, label: 'Menú de juegos' },
      ],
      660,
      280,
      48
    );
  }

  // ------------------------------------------------------------ Configuración

  const DIFF_OPTIONS = [{ value: null, label: 'Cada jugador elige', color: T.ink }].concat(D.DIFFICULTIES.map((d) => ({ value: d.id, label: d.label, color: d.color })));

  // Elementos de la pantalla de configuración, en orden de navegación.

      const on = i === focus;
      if (it.kind === 'game') {
        const g = games.find((x) => x.id === it.id);
        const enabled = !cfg.disabled.includes(it.id);
        D.panel(ctx, it.x, it.y, it.w, it.h, { fill: on ? '#24150d' : '#170e0a', edge: on ? g.accent : '#3a2418', radius: 12, glow: on ? g.accent : null });
        D.text(ctx, `${games.indexOf(g) + 1}. ${g.title}`, it.x + 18, it.y + 26, { size: 20, weight: 800, color: enabled ? T.ink : T.faint });

    backdrop(ctx, t, game.accent);

    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.arc(0, 0, 118, 0, Math.PI * 2);
    ctx.stroke();
    ctx.lineWidth = 3;

    D.text(ctx, rep.rank, 0, 50, { size: 150, weight: 800, color: stamp, align: 'center' });

    D.text(ctx, `${rep.score}/100`, x + 190, y + 446, { size: 36, weight: 800, color: '#3a1d0c', align: 'center', family: D.MONO });
    if (isRecord) D.text(ctx, '★ ¡Nuevo récord personal! ★', x + 190, y + 482, { size: 17, weight: 800, color: '#c4501a', align: 'center' });
    else if (record) D.text(ctx, `Récord: ${bestLabel(record)}`, x + 190, y + 482, { size: 16, weight: 700, color: '#7a5030', align: 'center' });

    // Tabla.
    const tx = x + 400;
    D.paragraph(ctx, rep.headline, tx, y + 104, 660, { size: 20, weight: 800, color: '#3a1d0c', maxLines: 2 });
    rep.rows.forEach(([label, value, color], i) => {
      const ry = y + 172 + i * 40;

      const dark = color === T.ink ? '#2a170d' : color === T.ok ? '#2f7a33' : color === T.red ? '#b3261e' : color === T.warn ? '#b86e00' : color === rc ? stamp : '#2a170d';
      D.text(ctx, value, tx + 660, ry, { size: 22, weight: 800, color: dark, align: 'right', family: D.MONO });
      ctx.fillStyle = 'rgba(58,29,12,0.18)';
      ctx.fillRect(tx, ry + 12, 660, 1);
    });

    // Lo que no va así.
    const my = y + 172 + rep.rows.length * 40 + 18;

  PF.Screens = { configItems, drawConfig, gearButton, fullscreenButton, menuCards, diffCards, choicesOf, choiceOf, choiceChips, playButton, backButton, pauseButtons, reportButtons, drawButton, drawMenu, drawSetup, drawPause, drawReport };

    <script>
// Adaptador de "Pasteurizadora Flash: Turno 60" a la colección de juegos:
// dificultad, burbujas de error y reporte de calidad común.
(function () {
  'use strict';
  const PF = globalThis.PF || (globalThis.PF = {});
  const D = PF.Draw;
  const B = PF.Bubble;
  const Sim = PF.Sim;
  const C = PF.CONFIG;
  const T = D.T;
  const ACCENT = '#ffd34d';

  const MINIGAME_ERRORS = {
    arrows: 'Así no se desatora: repite la secuencia de flechas en el mismo orden.',
    simon: 'Ese no era el color: el sensor sigue descalibrado. Mira el patrón otra vez.',
    timing: 'Fuera de la zona: el antiespumante se desperdicia. Pulsa cuando la aguja esté dentro.',
  };

  function create(diffId = 'normal', opts = {}) {
    const g = Sim.createGame({ difficulty: diffId, seed: opts.seed });
    const s = { id: 'pasteurizer', diff: diffId, g, bubble: B.create(), surface: null, lastDiscardTip: -99, over: false };
    s.update = (dt, input) => update(s, dt, input);
    s.draw = (r) => draw(s, r);
    s.report = () => report(s);
    return s;
  }

  function update(s, dt, input) {
    const g = s.g;
    Sim.step(g, dt, input);
    B.update(s.bubble, dt);
    if (g.player.adjust) D.sfx('adjust');
    for (const sig of g.signals.splice(0)) {
      if (s.surface) PF.Render.onSignal(s.surface, sig);
      handleSignal(s, sig);
    }
    if (s.surface) PF.Render.update(s.surface, g, dt);
    if (g.over && !s.over) {
      s.over = true;
      if (PF.Audio) PF.Audio.setSiren(false);
    }
  }

  function handleSignal(s, sig) {
    const g = s.g;
    switch (sig.type) {
      case 'error': {
        const rep = Sim.activeRepair(g, sig.station);
        const msg = rep && MINIGAME_ERRORS[rep.mg.type];
        if (msg) B.say(s.bubble, msg);
        D.sfx('error');
        break;
      }
      case 'lineStop':
        B.say(s.bubble, 'Nunca cierres la válvula del todo: la línea se para y al rearrancar se purga 1 HL a descarte.');
        D.sfx('lineStop');
        break;
      case 'denied':
        B.say(s.bubble, 'Estación bloqueada: espera a que se restablezca y atiende otra alarma mientras tanto.', { kind: 'tip' });
        D.sfx('denied');
        break;
      case 'discardStart': {
        D.sfx('discardStart');
        // Avisos de descarte espaciados para no tapar la pantalla en hora pico.
        if (g.time - s.lastDiscardTip < 6 || (s.bubble.cur && s.bubble.cur.kind === 'error')) break;
        s.lastDiscardTip = g.time;
        const cfg = C.VARS[sig.variable];
        const st = { temp: 'T', valve: 'V', pump: 'B' }[cfg.station];
        B.say(s.bubble, `${cfg[sig.dir].cause[0].toUpperCase() + cfg[sig.dir].cause.slice(1)}: la cerveza ${cfg[sig.dir].effect} y se va a DESCARTE. Corre a la estación ${st}.`);
        break;
      }
      case 'resolved':
        if (sig.byPlayer) D.sfx('resolved');
        break;
      case 'phase':
        if (PF.Audio) PF.Audio.setSiren(!!sig.peak);
        break;
      case 'alarm':
      case 'blip':
      case 'enter':
      case 'blocked':
        D.sfx(sig.type);
        break;
    }
  }

  function draw(s, r) {
    if (s.surface !== r) {
      s.surface = r;
      PF.Render.resetFx(r);
    }
    PF.Render.drawGame(r, s.g);
    const ctx = r.ctx;
    if (!s.g.player.operating) B.marker(ctx, s.bubble, s.g.player, r.t);
    // Panel de mensajes bajo las alarmas: avisos del turno y la burbuja del operario.
    const fb = r.fx.banner;
    const notices = [
      s.g.lineStopped && { text: 'LÍNEA PARADA', sub: 'Cerraste la válvula al mínimo: penalización y purga al rearrancar.', color: T.red },
      fb && { text: fb.str, color: fb.color, life: fb.life, max: fb.max },
    ];
    B.dock(ctx, D.dockRect(546), { bubble: s.bubble, notices, t: r.t });
  }

  function report(s) {
    const res = Sim.results(s.g);
    const score = Math.round(res.efficiency);
    return {
      score,
      rank: res.rank,
      headline: Sim.summaryText(res),
      rows: [
        ['HL procesados', `${Sim.fmt(res.processed, 1)} HL`, T.ink],
        ['HL aprobados', `${Sim.fmt(res.approved, 1)} HL`, '#ffd34d'],
        ['HL desechados', `${Sim.fmt(res.discarded, 1)} HL`, T.red],
        ['Eficiencia', `${Sim.fmt(res.efficiency, 1)} %`, D.rankColor(res.rank)],
        ['Causa principal', res.mainCauseLabel || 'ninguna', res.mainCauseLabel ? T.red : T.ok],
        ['Fallas controladas', `${res.resolved} de ${res.spawned}`, T.ink],
      ],
      mistakes: s.bubble.log.slice(),
    };
  }

  function icon(ctx, cx, cy, size, t) {
    // Termómetro y gota de cerveza.
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = '#e8edf2';
    D.roundRect(ctx, -size * 0.32, -size * 0.42, size * 0.18, size * 0.66, size * 0.09);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(-size * 0.23, size * 0.28, size * 0.15, 0, Math.PI * 2);
    ctx.fill();
    const level = 0.45 + 0.25 * Math.sin(t * 2);
    ctx.fillStyle = '#ff4b4b';
    ctx.fillRect(-size * 0.27, size * 0.24 - size * 0.6 * level, size * 0.08, size * 0.6 * level);
    ctx.beginPath();
    ctx.arc(-size * 0.23, size * 0.28, size * 0.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = ACCENT;
    ctx.beginPath();
    ctx.moveTo(size * 0.22, -size * 0.36);
    ctx.quadraticCurveTo(size * 0.48, 0, size * 0.22, size * 0.3);
    ctx.quadraticCurveTo(-size * 0.04, 0, size * 0.22, -size * 0.36);
    ctx.fill();
    ctx.restore();
  }

  PF.Games = PF.Games || [];
  PF.Games.push({
    id: 'pasteurizer',
    order: 1,
    title: 'Pasteurizadora Flash',
    subtitle: 'Turno 60',
    tagline: 'Temperatura, flujo y retención en rango mientras las alarmas se acumulan.',
    accent: ACCENT,
    icon,
    howTo: [
      'Mantén temperatura (24–30 PU), flujo (0,85–0,95 HL/s) y retención (2,8–3,2 s) en rango.',
      'Fuera de rango más de 0,4 s → esa cerveza va a descarte.',
      'Corre a la estación marcada, pulsa E y corrige con A/D o con el mini-juego.',
      'No cierres la válvula del todo: 2 s al mínimo y se para la línea.',
    ],
    touch: { stick: true, main: [{ pad: 'a', label: 'Reparar' }, { pad: 'x', label: 'Operar' }, { pad: 'b', label: 'Salir' }], aux: [{ pad: 'lb', label: '' }, { pad: 'rb', label: '' }, { pad: 'lt', label: '' }, { pad: 'rt', label: '' }] },
    controls: [
      ['WASD', 'moverse', 'lstick'],
      ['E', 'operar', 'x'],
      ['A / D', 'ajustar', 'dpadLR'],
      ['ESPACIO · 1-4', 'reparar', ['a', 'lb']],
    ],
    difficulties: {
      facil: ['Las variables derivan más despacio', 'Fallas más espaciadas, una menos a la vez', 'Sin bloqueos de estación'],
      normal: ['El turno estándar de 60 s', 'Hasta 3 fallas a la vez en hora pico', 'Bloqueos breves en hora pico'],
      dificil: ['Derivas 20 % más rápidas', 'Una falla simultánea extra', 'Más bloqueos en hora pico'],
    },
    create,
  });
})();
</script>
