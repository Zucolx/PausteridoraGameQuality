    <script>
// Mandos (PlayStation y Xbox) con el "standard mapping" de la Gamepad API.
// Lógica pura: lee un objeto Gamepad, detecta flancos y traduce a acciones.
(function () {
  'use strict';
  const PF = globalThis.PF || (globalThis.PF = {});

  // Índices del mapeo estándar.
  const BUTTONS = ['a', 'b', 'x', 'y', 'lb', 'rb', 'lt', 'rt', 'select', 'start', 'ls', 'rs', 'up', 'down', 'left', 'right'];
  const DEAD = 0.25;
  const TILT = 0.6;

  const LABELS = {
    ps: { a: '✕', b: '○', x: '□', y: '△', lb: 'L1', rb: 'R1', lt: 'L2', rt: 'R2', select: 'SHARE', start: 'OPTIONS', ls: 'L3', rs: 'R3' },
    xbox: { a: 'A', b: 'B', x: 'X', y: 'Y', lb: 'LB', rb: 'RB', lt: 'LT', rt: 'RT', select: 'VIEW', start: 'MENU', ls: 'LS', rs: 'RS' },
  };

  // Xbox primero (su id también dice "Wireless Controller"); PlayStation por id de Sony
  // (054c) o por nombre; cualquier otro mando se muestra con los botones de Xbox (XInput).
  function detect(id) {
    if (/xbox|xinput|045e|microsoft/i.test(id || '')) return 'xbox';
    return /054c|playstation|dualsense|dualshock|wireless controller|ps[345]/i.test(id || '') ? 'ps' : 'xbox';
  }

  function axis(v) {
    return Math.abs(v || 0) > DEAD ? v : 0;
  }

  function snapshot(gp) {
    const held = {};
    BUTTONS.forEach((name, i) => {
      const b = gp.buttons[i];
      held[name] = !!b && (b.pressed || b.value > 0.5);
    });
    const ax = gp.axes || [];
    const lx = axis(ax[0]);
    const ly = axis(ax[1]);
    // El stick izquierdo también cuenta como cruceta "virtual".
    held.lsUp = ly < -TILT;
    held.lsDown = ly > TILT;
    held.lsLeft = lx < -TILT;
    held.lsRight = lx > TILT;
    return { id: gp.id, type: detect(gp.id), held, lx, ly, rx: axis(ax[2]), ry: axis(ax[3]) };
  }

  // Botones que se acaban de pulsar en este frame.
  function edges(prev, cur) {
    const out = [];
    for (const name of Object.keys(cur.held)) if (cur.held[name] && !(prev && prev.held[name])) out.push(name);
    return out;
  }

  function active(cur) {
    return Object.values(cur.held).some(Boolean) || cur.lx || cur.ly || cur.rx || cur.ry;
  }

  // Traducción a las acciones de teclado que entienden los juegos de mapa.
  const TO_KEYS = {
    a: ['space', 'confirm'],
    x: ['interact'],
    b: ['cancel'],
    y: ['tab'],
    up: ['up'],
    down: ['down'],
    left: ['left'],
    right: ['right'],
    lsUp: ['up'],
    lsDown: ['down'],
    lsLeft: ['left'],
    lsRight: ['right'],
    lb: ['1'],
    rb: ['2'],
    lt: ['3'],
    rt: ['4'],
  };

  function toKeys(pressed) {
    const out = [];
    for (const p of pressed) if (TO_KEYS[p]) out.push(...TO_KEYS[p]);
    return out;
  }

  // Acciones de menú: navegar, aceptar, volver, alternativa (Y/△) y pausa.
  const TO_MENU = { up: 'up', lsUp: 'up', down: 'down', lsDown: 'down', left: 'left', lsLeft: 'left', right: 'right', lsRight: 'right', a: 'confirm', b: 'back', y: 'alt', start: 'start', select: 'config' };

  function toMenu(pressed) {
    return pressed.map((p) => TO_MENU[p]).filter(Boolean);
  }

  function label(type, name) {
    return (LABELS[type] || LABELS.xbox)[name] || name.toUpperCase();
  }

  PF.Pad = { BUTTONS, detect, snapshot, edges, active, toKeys, toMenu, label };
})();
</script>
    <script>
// Pantallas táctiles (móviles y pantallas grandes tipo TV): un "mando virtual".
// - Joystick flotante: en los juegos de mapa, arrastrar en la mitad izquierda de la
//   pantalla mueve al operario (el joystick aparece donde se apoya el dedo).
// - Botones virtuales (A, B, X, Y, 1-4…): se comportan como los del mando, así que
//   cada juego los lee igual que un mando PS/Xbox.
// - Toques: el resto de la pantalla funciona como clics (y "mantener" como ratón pulsado).
// Lógica pura en píxeles CSS de la pantalla: no toca el DOM y se prueba en Node.
(function () {
  'use strict';
  const PF = globalThis.PF || (globalThis.PF = {});

  const DEAD = 0.18;
  const TILT = 0.6;
  const DRAG = 12; // px para que un toque pase a ser joystick
  const TAP_MS = 350;

  function create() {
    return { layout: null, buttons: [], pointers: new Map(), latched: {}, stick: null, W: 0, H: 0, size: 60 };
  }

  // layout = { stick: bool, stickHint?: false, main: [{ pad, label }], aux: [{ pad, label }] } o null.
  function setLayout(t, layout) {
    t.layout = layout || null;
    t.pointers.clear();
    t.latched = {};
    t.stick = null;
    if (t.W) arrange(t, t.W, t.H, t.view);
  }

  // Coloca los botones. view = zona del juego en la pantalla { ox, oy, gw, gh }.
  // Si sobra margen a los lados (móvil apaisado), van fuera del juego; si no, encima.
  function arrange(t, W, H, view = { ox: 0, oy: 0, gw: W, gh: H }) {
    t.W = W;
    t.H = H;
    t.view = view;
    t.buttons = [];
    const L = t.layout;
    if (!L) return;
    const main = L.main || [];
    const aux = L.aux || [];
    let size = Math.round(Math.max(46, Math.min(78, Math.min(W, H) * 0.14)));
    const most = Math.max(main.length, aux.length);
    if (most) size = Math.max(40, Math.min(size, Math.floor((H - 40) / most) - 10));
    t.size = size;
    const right = W - (view.ox + view.gw);
    const left = view.ox;
    const column = (list, side, s) => {
      const free = side === 'right' ? right : left;
      const inMargin = free >= s + 12;
      const cx = side === 'right' ? (inMargin ? W - free / 2 : W - 12 - s / 2) : inMargin ? free / 2 : 12 + s / 2;
      list.forEach((b, i) => {
        const cy = H - 16 - s / 2 - i * (s + 10);
        t.buttons.push({ pad: b.pad, label: b.label, x: cx, y: cy, r: s / 2, side, inMargin });
      });
    };
    column(main, 'right', size);
    column(aux, 'left', Math.round(size * 0.82));
  }

  function buttonAt(t, x, y) {
    return t.buttons.find((b) => Math.hypot(x - b.x, y - b.y) <= b.r + 8) || null;
  }

  // Devuelve qué es el toque: 'button', 'stick' (aún sin decidir si es arrastre) o 'click'.
  function down(t, id, x, y, now = 0) {
    const b = buttonAt(t, x, y);
    if (b) {
      t.pointers.set(id, { kind: 'button', pad: b.pad });
      t.latched[b.pad] = true;
      return { kind: 'button', pad: b.pad };
    }
    if (t.layout && t.layout.stick && x < t.W * 0.5 && !t.stick) {
      t.pointers.set(id, { kind: 'stick', x0: x, y0: y, x, y, t0: now, dragging: false });
      return { kind: 'stick' };
    }
    t.pointers.set(id, { kind: 'click' });
    return { kind: 'click' };
  }

  function move(t, id, x, y) {
    const p = t.pointers.get(id);
    if (!p) return null;
    if (p.kind === 'stick') {
      p.x = x;
      p.y = y;
      if (!p.dragging && Math.hypot(x - p.x0, y - p.y0) > DRAG) {
        p.dragging = true;
        t.stick = p;

// Configuración de la colección (protegida con clave): qué juegos aparecen en el menú
// y si la dificultad queda fijada para todos. Se guarda en este navegador/dispositivo.
//
// SharePoint muestra el HTML en un marco aislado (sandbox sin allow-same-origin): ahí el
// navegador lanza SecurityError con solo leer `localStorage`. Por eso el almacenamiento se
// pide con cuidado y, si no hay, todo vive en memoria mientras la página esté abierta.
// La versión "sin ajustes" (pnpm build) usa siempre los valores por defecto y no ofrece
// la pantalla de configuración (PF.BUILD.ajustes === false).

  const PF = globalThis.PF || (globalThis.PF = {});

  const KEY = 'lo-que-no-se-ve:ajustes';
  // Clave de acceso. Ojo: el juego funciona sin conexión y esto está en el propio HTML,
  // así que evita cambios casuales, no es una protección fuerte.
  const PASSWORD = 'Odiseo';
  const DEFAULTS = { disabled: ['pasteurizer', 'stop'], difficulty: null };
  const DIFFS = ['facil', 'normal', 'dificil'];

    return !(PF.BUILD && PF.BUILD.ajustes === false);
  }

  // localStorage si el navegador lo permite; si no (marco aislado, modo privado…), null.
  function storage() {
    try {
      const ls = globalThis.localStorage;
      if (!ls) return null;
      ls.getItem(KEY);
      return ls;
    } catch {
      return null;
    }

  function persistent() {
    return !!storage();
  }

  function check(pw) {
    return String(pw || '').trim().toLowerCase() === PASSWORD.toLowerCase();
  }

    const c = cfg && typeof cfg === 'object' ? cfg : {};
    return {
      disabled: Array.isArray(c.disabled) ? c.disabled.filter((x) => typeof x === 'string') : DEFAULTS.disabled.slice(),
      difficulty: DIFFS.includes(c.difficulty) ? c.difficulty : null,

    try {

      return clean(raw ? JSON.parse(raw) : DEFAULTS);
    } catch {
      return clean(DEFAULTS);
    }

    bg: '#0a0605',
    floor: '#1a1210',
    floorLine: '#241915',
    wall: '#0d0807',
    panel: '#140c09',
    panel2: '#1e130e',
    edge: '#3d2619',
    ink: '#f5e8d3',
    dim: '#bfa48a',
    faint: '#7a6250',
    orange: '#ff7a1a',
    orangeDark: '#c4501a',
    ember: '#7a260c',
    brass: '#d0a55c',
    ok: '#7ddc6a',
    okDark: '#24502a',
    warn: '#ffb347',
    red: '#ff4b3a',
    uv: '#a46bff',
    toxic: '#9dff5c',
    steel: '#6b625d',
    steelDark: '#3b3431',
    steelLight: '#9d938c',

  }

  // Fila de ayudas "[control] acción" separadas; devuelve el ancho total.
  function hints(ctx, items, x, y, { size = 15, gap = 26, color = T.orange, keyInk = '#140c09', ink = T.ink, align = 'left' } = {}) {
    const widths = items.map(([spec, label]) => {
      const cw = spec.key || spec.pad ? measureControl(ctx, spec, size) : 0;
      ctx.font = font(size + 1, 600);
      return cw + 8 + ctx.measureText(label).width;
    });
    const total = widths.reduce((a, b) => a + b, 0) + gap * (items.length - 1);
    let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
    items.forEach(([spec, label], i) => {
      const cw = control(ctx, spec, cx, y, { size, color, keyInk });
      text(ctx, label, cx + cw + 8, y + size * 0.38, { size: size + 1, weight: 600, color: ink });
      cx += widths[i] + gap;
    });
    return total;
  }

  function measureControl(ctx, spec, size, device = InputState.device) {
    if (device === 'keyboard' || !spec.pad) return keyWidth(ctx, spec.key, size);
    const list = Array.isArray(spec.pad) ? spec.pad : [spec.pad];
    return list.reduce((a, n, i) => a + measureGlyph(ctx, device, n, size) + (i ? 12 : 0), 0);
  }

  // Calabaza de dificultad (1-3 encendidas).
  function pumpkin(ctx, x, y, s, lit) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = lit ? T.orange : '#3a2418';
    for (const dx of [-0.45, 0, 0.45]) {
      ctx.beginPath();
      ctx.ellipse(dx * s, 0, s * 0.42, s * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = lit ? '#3c7a2a' : '#2a2018';
    ctx.fillRect(-s * 0.08, -s * 0.72, s * 0.16, s * 0.28);
    if (lit) {
      ctx.fillStyle = '#ffe28a';
      ctx.beginPath();
      ctx.moveTo(-s * 0.35, -s * 0.12);
      ctx.lineTo(-s * 0.15, -s * 0.12);
      ctx.lineTo(-s * 0.25, -s * 0.3);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(s * 0.35, -s * 0.12);
      ctx.lineTo(s * 0.15, -s * 0.12);
      ctx.lineTo(s * 0.25, -s * 0.3);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-s * 0.35, s * 0.12);
      ctx.quadraticCurveTo(0, s * 0.45, s * 0.35, s * 0.12);
      ctx.quadraticCurveTo(0, s * 0.28, -s * 0.35, s * 0.12);
      ctx.fill();
    }
    ctx.restore();
  }

  function difficulty(id) {
    return DIFFICULTIES.find((d) => d.id === id) || DIFFICULTIES[1];
  }

  // Operario estilo "Among Us" con casco; opcionalmente lleva una herramienta.
  function player(ctx, p, { color = '#e8742c', dark = '#a84d17', tool = null, t = 0 } = {}) {
    const bob = p.moving ? Math.sin(p.walkT * 16) * 2 : 0;
    const step = p.moving ? Math.sin(p.walkT * 16) * 4 : 0;
    ctx.save();
    ctx.translate(p.x, p.y + bob);
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(0, 18 - bob, 17, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.scale(p.facing || 1, 1);
    ctx.fillStyle = dark;
    roundRect(ctx, -20, -8, 9, 20, 4);
    ctx.fill();
    roundRect(ctx, -11, 8 + step * 0.5, 9, 10, 3);
    ctx.fill();
    roundRect(ctx, 3, 8 - step * 0.5, 9, 10, 3);
    ctx.fill();
    ctx.fillStyle = color;
    roundRect(ctx, -13, -20, 26, 32, 12);
    ctx.fill();
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#9fdcf2';
    roundRect(ctx, -1, -14, 16, 10, 5);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    roundRect(ctx, 6, -12, 6, 3, 1.5);
    ctx.fill();
    ctx.fillStyle = '#ffd34d';
    ctx.beginPath();
    ctx.ellipse(0, -19, 12, 5, 0, Math.PI, 0);
    ctx.fill();
    if (tool === 'flashlight') {
      ctx.fillStyle = '#2b2b33';
      roundRect(ctx, 10, -2, 16, 7, 2);
      ctx.fill();
      ctx.fillStyle = T.uv;
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 9);
      ctx.beginPath();
      ctx.arc(27, 1.5, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    } else if (tool === 'clipboard') {
      ctx.fillStyle = '#f2e3c6';
      ctx.fillRect(10, -4, 11, 14);
      ctx.fillStyle = T.orangeDark;
      ctx.fillRect(13, -6, 5, 3);
    }
    ctx.restore();
  }

  // Suelo de planta con franja de seguridad.
  function floor(ctx, b = MAP_BOUNDS, { floorColor = T.floor, line = T.floorLine, stripe = T.orangeDark } = {}) {
    ctx.fillStyle = T.wall;
    ctx.fillRect(0, VIEW.hud, VIEW.mapWidth, VIEW.height - VIEW.hud);
    ctx.fillStyle = floorColor;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = line;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = b.x; x <= b.x + b.w; x += 48) {
      ctx.moveTo(x + 0.5, b.y);
      ctx.lineTo(x + 0.5, b.y + b.h);
    }
    for (let y = b.y; y <= b.y + b.h; y += 48) {
      ctx.moveTo(b.x, y + 0.5);
      ctx.lineTo(b.x + b.w, y + 0.5);
    }
    ctx.stroke();
    ctx.save();
    ctx.beginPath();
    ctx.rect(b.x - 10, b.y - 10, b.w + 20, b.h + 20);
    ctx.rect(b.x, b.y, b.w, b.h);
    ctx.clip('evenodd');
    ctx.fillStyle = '#140b07';
    ctx.fillRect(b.x - 10, b.y - 10, b.w + 20, b.h + 20);
    ctx.strokeStyle = stripe;
    ctx.globalAlpha = 0.6;
    ctx.lineWidth = 6;
    ctx.beginPath();
    for (let i = -b.h; i < b.w + b.h; i += 22) {
      ctx.moveTo(b.x + i, b.y - 10);
      ctx.lineTo(b.x + i + b.h + 20, b.y + b.h + 10);
    }
    ctx.stroke();
    ctx.restore();
  }

  function strokePath(ctx, points, width, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
    ctx.stroke();
  }

  function pipe(ctx, points) {
    strokePath(ctx, points, 16, '#0d0807');
    strokePath(ctx, points, 12, T.steelDark);
    strokePath(ctx, points, 5, '#544a44');
  }

  // Estación genérica del mapa: carcasa, halo de estado, rótulo y pad de interacción.
  function station(ctx, st, { t = 0, near = false, state = null, label = st.name, labelBelow = true } = {}) {
    const { x, y, w, h } = st.rect;
    if (st.spot) {
      ctx.fillStyle = near ? 'rgba(255,122,26,0.22)' : 'rgba(255,255,255,0.05)';
      ctx.strokeStyle = near ? T.orange : 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 5]);
      ctx.beginPath();
      ctx.arc(st.spot.x, st.spot.y, 26, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.setLineDash([]);
    }
    if (state) {
      const color = state === 'next' ? T.orange : state === 'done' ? T.ok : state === 'busy' ? T.warn : T.red;
      const pulse = 0.5 + 0.5 * Math.sin(t * (state === 'next' ? 6 : 3));
      ctx.save();
      ctx.shadowColor = color;
      ctx.shadowBlur = 14 + pulse * 16;
      ctx.strokeStyle = color;
      ctx.globalAlpha = state === 'done' ? 0.6 : 0.5 + pulse * 0.5;
      ctx.lineWidth = 4;
      roundRect(ctx, x - 5, y - 5, w + 10, h + 10, 10);
      ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = T.steelDark;
    roundRect(ctx, x, y, w, h, 8);
    ctx.fill();
    ctx.strokeStyle = '#0d0807';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#2b2320';
    roundRect(ctx, x + 6, y + 6, w - 12, h - 12, 5);
    ctx.fill();
    if (label) text(ctx, label, x + w / 2, labelBelow ? y + h + 16 : y - 8, { size: 13, weight: 700, color: T.dim, align: 'center' });
  }

  // Marcador flotante "!" o "✔" sobre una estación.
  function marker(ctx, x, y, t, color, glyph = '!') {
    const by = y + Math.sin(t * 8) * 4;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, by + 10);
    ctx.lineTo(x - 13, by - 14);
    ctx.lineTo(x + 13, by - 14);
    ctx.closePath();
    ctx.fill();
    text(ctx, glyph, x, by - 1, { size: 17, weight: 800, color: '#111', align: 'center' });
  }

  // Flecha alrededor del jugador hacia un objetivo.
  function guide(ctx, p, target, t, color = T.orange) {
    const dx = target.x - p.x;
    const dy = target.y - p.y;
    if (Math.hypot(dx, dy) < 90) return;
    const ang = Math.atan2(dy, dx);
    ctx.save();
    ctx.translate(p.x + Math.cos(ang) * 40, p.y + Math.sin(ang) * 40);
    ctx.rotate(ang);
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 10);
    ctx.beginPath();
    ctx.moveTo(11, 0);
    ctx.lineTo(-6, -9);
    ctx.lineTo(-2, 0);
    ctx.lineTo(-6, 9);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // "[E] operar" sobre la cabeza del jugador.
  // "[E] operar" (o el botón del mando) sobre la cabeza del jugador.
  function prompt(ctx, p, label, color = T.orange, spec = { key: 'E', pad: 'x' }) {
    const w = measureControl(ctx, spec, 15);
    control(ctx, spec, p.x - w / 2, p.y - 44, { size: 15, color });
    text(ctx, label, p.x, p.y - 64, { size: 13, weight: 700, color, align: 'center' });
  }

  // Cambia nombres de teclas en un texto por los botones del mando activo.
  function keysText(str, device = InputState.device) {
    if (device === 'keyboard' || !PF.Pad) return str;
    const L = (n) => glyphLabel(device, n);
    const cross = device === 'touch' ? 'el joystick' : 'la cruceta';
    return str
      .replace(/ESPACIO/g, L('a'))
      .replace(/\bA\/D\b/g, `${cross} ◀▶`)
      .replace(/1-4/g, `${L('lb')} ${L('rb')} ${L('lt')} ${L('rt')}`)
      .replace(/\b[Ff]lechas\b/g, cross);
  }

  // Zona lateral reservada para mensajes (de `top` hasta encima del pie de controles).
  function dockRect(top) {
    return { x: VIEW.mapWidth + 16, y: top, w: VIEW.width - VIEW.mapWidth - 32, h: VIEW.height - 30 - top };
  }

  // Pie de la barra lateral con los controles del dispositivo activo.
  function footer(ctx, items) {
    ctx.fillStyle = T.edge;
    ctx.fillRect(VIEW.mapWidth + 16, VIEW.height - 26, VIEW.width - VIEW.mapWidth - 32, 1);
    hints(ctx, items, VIEW.mapWidth + (VIEW.width - VIEW.mapWidth) / 2, VIEW.height - 12, { size: 10, gap: 12, ink: T.dim, color: '#8a6a50', align: 'center' });
  }

  function formatTime(seconds) {
    const s = Math.max(0, Math.ceil(seconds));
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }

  // Barra superior común: título del juego, reloj y estadísticas.
  function hud(ctx, t, { title, diff, timeLeft, duration, stats = [], accent = T.orange }) {
    ctx.fillStyle = T.panel;
    ctx.fillRect(0, 0, VIEW.width, VIEW.hud);
    ctx.fillStyle = accent;
    ctx.fillRect(0, VIEW.hud - 3, VIEW.width, 3);
    text(ctx, title, 20, 30, { size: 20, weight: 700, color: accent });
    const d = difficulty(diff);
    text(ctx, d.label, 20, 52, { size: 13, weight: 700, color: d.color });
    for (let i = 0; i < 3; i++) pumpkin(ctx, 108 + i * 24, 46, 12, i < d.pumpkins);

    const critical = timeLeft <= 10;
    const tc = critical && Math.floor(t * 4) % 2 ? T.red : T.ink;
    text(ctx, formatTime(timeLeft), 640, 42, { size: 38, weight: 700, color: tc, align: 'center', family: MONO });
    progressBar(ctx, 560, 52, 160, 5, 1 - timeLeft / duration, critical ? T.red : accent);

    let x = 780;
    for (const s of stats) {
      text(ctx, s.label.toUpperCase(), x, 24, { size: 12, color: T.dim, weight: 700 });
      text(ctx, String(s.value), x, 50, { size: 22, weight: 700, color: s.color || T.ink, family: s.mono === false ? FONT : MONO });
      x += s.width || 160;
    }
    hints(ctx, [[{ key: 'P', pad: 'start' }, 'pausa']], VIEW.width - 14, 18, { size: 11, align: 'right', ink: T.faint, color: '#6e5a48' });
  }

  function sidebar(ctx, title) {
    const x0 = VIEW.mapWidth;
    ctx.fillStyle = T.panel;
    ctx.fillRect(x0, VIEW.hud, VIEW.width - x0, VIEW.height - VIEW.hud);
    ctx.fillStyle = T.edge;
    ctx.fillRect(x0, VIEW.hud, 2, VIEW.height - VIEW.hud);
    if (title) text(ctx, title, x0 + 20, 92, { size: 13, weight: 700, color: T.dim });
  }

  // Casilla de verificación de la "Tarjeta de verificación".
  function checkRow(ctx, x, y, label, state, { width = 270 } = {}) {
    const done = state === 'done';
    const fail = state === 'fail';
    const next = state === 'next';
    ctx.fillStyle = done ? T.okDark : fail ? '#4a1410' : next ? '#3a230f' : '#22160f';
    roundRect(ctx, x, y, width, 34, 6);
    ctx.fill();
    ctx.strokeStyle = done ? T.ok : fail ? T.red : next ? T.orange : '#3d2619';
    ctx.lineWidth = 2;
    roundRect(ctx, x + 8, y + 8, 18, 18, 4);
    ctx.stroke();
    if (done) text(ctx, '✔', x + 17, y + 23, { size: 16, weight: 800, color: T.ok, align: 'center' });
    if (fail) text(ctx, '✖', x + 17, y + 23, { size: 16, weight: 800, color: T.red, align: 'center' });
    text(ctx, label, x + 36, y + 22, { size: 15, weight: 600, color: done ? T.ok : fail ? T.red : next ? T.ink : T.dim });
  }

  // Ventana de estación sobre el mapa (oscurece el fondo). Devuelve el área interior.
  function modalArea(H, W = 640) {
    const x = (VIEW.mapWidth - W) / 2;
    const y = Math.max(VIEW.hud + 12, VIEW.height - 24 - H);
    return { x: x + 20, y: y + 60, w: W - 40, h: H - 74, outer: { x, y, w: W, h: H } };
  }

  function modal(ctx, title, H, { W = 640, accent = T.orange, hint = [[{ key: 'E / Esc', pad: 'b' }, 'salir']] } = {}) {
    const { x, y } = modalArea(H, W).outer;
    ctx.fillStyle = 'rgba(8,4,3,0.6)';
    ctx.fillRect(0, VIEW.hud, VIEW.mapWidth, VIEW.height - VIEW.hud);
    panel(ctx, x, y, W, H, { fill: '#170e0a', edge: accent, radius: 12 });
    ctx.fillStyle = accent;
    roundRect(ctx, x, y, W, 46, 12);
    ctx.fill();
    ctx.fillRect(x, y + 30, W, 16);
    text(ctx, title, x + 20, y + 31, { size: 21, weight: 800, color: '#170e0a' });
    if (hint) hints(ctx, hint, x + W - 18, y + 24, { size: 12, align: 'right', ink: '#170e0a', color: '#170e0a', keyInk: accent });
    return modalArea(H, W);
  }

  // Aviso temporal para el panel de mensajes. Dura un poco más que su `life` nominal
  // porque ya no tapa el juego.
  function makeBanner(text, color, sub = null, life = 2) {
    const ttl = life * 1.8;
    return { text, color, sub, life: ttl, max: ttl };
  }

  function tickBanner(owner, dt) {
    if (!owner.banner) return;
    owner.banner.life -= dt;
    if (owner.banner.life <= 0) owner.banner = null;
  }

  // Números/textos flotantes ("+1 lote", "-3 s").
  function floatAdd(list, x, y, str, color, size = 18, life = 1.2) {
    list.push({ x, y, str, color, size, life, max: life });
  }

  function floatsUpdate(list, dt) {
    for (const f of list) {
      f.life -= dt;
      f.y -= 28 * dt;
    }
    return list.filter((f) => f.life > 0);
  }

  function floatsDraw(ctx, list) {
    for (const f of list) {
      ctx.globalAlpha = Math.min(1, f.life / (f.max * 0.4));
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(0,0,0,0.8)';
      ctx.font = font(f.size, 800);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.strokeText(f.str, f.x, f.y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.str, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }

  // mulberry32: RNG reproducible para pruebas.
  function makeRng(seed) {
    if (seed == null) return Math.random;
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function shuffle(rng, arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function rankFor(score) {
    return score >= 90 ? 'S' : score >= 75 ? 'A' : score >= 55 ? 'B' : 'C';
  }

  function rankColor(rank) {
    return { S: '#ffd34d', A: T.ok, B: T.warn, C: T.red }[rank] || T.ink;
  }

  // ---------------------------------------------------------- Lienzo

  function createSurface(canvas) {
    const r = { canvas, ctx: canvas.getContext('2d'), scale: 1, ox: 0, oy: 0, dpr: 1, t: 0 };
    resize(r);
    return r;
  }

  function resize(r) {
    const dpr = Math.min(2, globalThis.devicePixelRatio || 1);
    const w = globalThis.innerWidth;
    const h = globalThis.innerHeight;
    r.canvas.width = Math.round(w * dpr);
    r.canvas.height = Math.round(h * dpr);
    r.canvas.style.width = w + 'px';
    r.canvas.style.height = h + 'px';
    r.dpr = dpr;
    r.scale = Math.min(w / VIEW.width, h / VIEW.height);
    r.ox = (w - VIEW.width * r.scale) / 2;
    r.oy = (h - VIEW.height * r.scale) / 2;
  }

  function begin(r) {
    const ctx = r.ctx;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = T.bg;
    ctx.fillRect(0, 0, r.canvas.width, r.canvas.height);
    ctx.setTransform(r.dpr * r.scale, 0, 0, r.dpr * r.scale, r.dpr * r.ox, r.dpr * r.oy);
  }

  function toLogical(r, clientX, clientY) {
    return { x: (clientX - r.ox) / r.scale, y: (clientY - r.oy) / r.scale };
  }

  function sfx(name) {
    if (PF.Audio) PF.Audio.play(name);
  }

  PF.VIEW = VIEW;
  PF.Draw = {
    VIEW,
    MAP_BOUNDS,
    FONT,
    MONO,
    T,
    DIFFICULTIES,
    difficulty,
    font,
    roundRect,
    text,
    wrap,
    paragraph,
    panel,
    progressBar,
    ring,
    keycap,
    padGlyph,
    control,
    hints,
    measureControl,
    InputState,
    pumpkin,
    player,
    floor,
    strokePath,
    pipe,
    station,
    marker,
    guide,
    prompt,
    formatTime,
    hud,
    sidebar,
    checkRow,
    modalArea,
    modal,
    makeBanner,
    keysText,
    dockRect,
    footer,
    tickBanner,
    floatAdd,
    floatsUpdate,
    floatsDraw,
    makeRng,
    shuffle,
    rankFor,
    rankColor,
    createSurface,
    resize,
    begin,
    toLogical,
    sfx,
  };
})();
</script>

// Configuración y balance de "Pasteurizadora Flash: Turno 60".
// Todo número que afecte la dificultad vive aquí para poder ajustarlo sin tocar la lógica.
(function () {
  'use strict';
  const PF = globalThis.PF || (globalThis.PF = {});

  const CONFIG = {
    DURATION: 60, // segundos de turno
    TICK: 0.1, // paso de contabilidad del flujo (s)
    GRACE_TICKS: 4, // 0,4 s fuera de rango antes de desviar a descarte
    PLAYER_SPEED: 260, // px/s
    PLAYER_RADIUS: 16,
    INTERACT_RADIUS: 70,
    SETTLE_TIME: 0.6, // s dentro de la banda ideal para cerrar una deriva
    WARN_FRACTION: 0.6, // fracción del semirango a partir de la cual la alarma es amarilla

    // Anti-trampa: la válvula no cierra del todo.
    LINE_STOP: {
      minFlow: 0.6,
      threshold: 0.62, // a ≤ este caudal se considera "válvula al mínimo"
      time: 2, // s al mínimo antes del paro
      duration: 3, // s de línea parada
      purgeHL: 1.0, // HL purgados a descarte al rearrancar
    },

    // Paro de planta (opcional): demasiadas alarmas rojas a la vez.
    PLANT_STOP: { enabled: true, minRed: 3, time: 5 },

    // Bloqueos breves de estación durante la hora pico.
    BLOCK_TIME: 1.5,
  };

  CONFIG.VARS = {
    temp: {
      key: 'temp',
      label: 'Temperatura',
      short: 'TEMP',
      unit: 'PU',
      ideal: 27,
      min: 24,
      max: 30,
      hardMin: 16,
      hardMax: 38,
      viewMin: 18,
      viewMax: 36,
      band: 1.0,
      adjustRate: 3.2,
      decimals: 1,
      station: 'temp',
      low: { cause: 'temperatura baja', effect: 'subpasteuriza' },
      high: { cause: 'temperatura alta', effect: 'sobrepasteuriza' },
    },
    flow: {

    <script>
// Mini-juegos de reparación. Lógica pura (sin DOM): create() devuelve el estado
// y update() lo avanza con la entrada del frame. update() devuelve true al completarse.
(function () {
  'use strict';
  const PF = globalThis.PF || (globalThis.PF = {});
  const C = PF.CONFIG;

  const DIRS = ['up', 'right', 'down', 'left'];

  function randInt(rng, n) {
    return Math.floor(rng() * n);
  }

  function randomSeq(rng, length, symbols) {
    const seq = [];
    for (let i = 0; i < length; i++) {
      let s = randInt(rng, symbols);
      // Evita tres símbolos iguales seguidos: es legible pero aburrido.
      if (i >= 2 && seq[i - 1] === s && seq[i - 2] === s) s = (s + 1) % symbols;
      seq.push(s);
    }
    return seq;
  }

  const MINIGAMES = {
    // Golpe de vapor: mantener ESPACIO para abrir el enfriamiento de emergencia.
    hold: {
      create() {
        return { type: 'hold', progress: 0, need: C.EVENT_PARAMS.steamHit.need, active: false };
      },
      update(mg, dt, input) {
        mg.active = !!input.space;
        if (mg.active) mg.progress += dt;
        return mg.progress >= mg.need;
      },
      ratio(mg) {
        return Math.min(1, mg.progress / mg.need);
      },
    },

    // Válvula trabada: secuencia de flechas. Un error genera una secuencia nueva.
    arrows: {
      create(rng) {
        const length = C.EVENT_PARAMS.stuckValve.length;
        return { type: 'arrows', seq: randomSeq(rng, length, 4).map((i) => DIRS[i]), idx: 0, flash: 0 };
      },
      update(mg, dt, input, rng, emit) {
        mg.flash = Math.max(0, mg.flash - dt);
        for (const key of input.pressed) {
          if (!DIRS.includes(key)) continue;
          if (key === mg.seq[mg.idx]) {
            mg.idx++;
            emit('blip');
            if (mg.idx >= mg.seq.length) return true;
          } else {
            mg.seq = randomSeq(rng, mg.seq.length, 4).map((i) => DIRS[i]);
            mg.idx = 0;
            mg.flash = 0.35;
            emit('error');
          }
        }
        return false;
      },
      ratio(mg) {
        return mg.idx / mg.seq.length;
      },
    },

    // Bomba con aire: la presión cae sola; ESPACIO la sube. Acumular tiempo en verde.
    pressure: {
      create() {
        return { type: 'pressure', p: 0.25, inZone: 0, need: C.EVENT_PARAMS.airPump.need, zone: [0.55, 0.8], turb: 0, turbT: 0 };
      },
      update(mg, dt, input, rng) {
        mg.turbT -= dt;
        if (mg.turbT <= 0) {
          mg.turbT = 0.35;
          mg.turb = (rng() - 0.5) * 1.1;
        }
        mg.p += ((input.space ? 1.5 : -1.0) + mg.turb) * dt;
        mg.p = Math.max(0, Math.min(1, mg.p));
        if (mg.p >= mg.zone[0] && mg.p <= mg.zone[1]) mg.inZone += dt;
        return mg.inZone >= mg.need;
      },
      ratio(mg) {
        return Math.min(1, mg.inZone / mg.need);
      },
    },

    // Espuma: detener una aguja oscilante dentro de la zona objetivo.
    timing: {
      create(rng) {
        const mg = { type: 'timing', pos: 0, dir: 1, speed: 1.15, hits: 0, need: C.EVENT_PARAMS.foam.hits, cooldown: 0, flash: 0, good: 0, zone: null };
        mg.zone = MINIGAMES.timing.newZone(rng, mg.pos);
        return mg;
      },
      newZone(rng, pos) {
        let c;
        do {
          c = 0.12 + rng() * 0.76;
        } while (Math.abs(c - pos) < 0.25);
        return { c, w: 0.16 };
      },
      update(mg, dt, input, rng, emit) {
        mg.cooldown = Math.max(0, mg.cooldown - dt);
        mg.flash = Math.max(0, mg.flash - dt);
        mg.good = Math.max(0, mg.good - dt);
        mg.pos += mg.dir * mg.speed * dt;
        if (mg.pos > 1) {
          mg.pos = 2 - mg.pos;
          mg.dir = -1;
        } else if (mg.pos < 0) {
          mg.pos = -mg.pos;
          mg.dir = 1;
        }
        if (input.pressed.includes('space') && mg.cooldown <= 0) {
          if (Math.abs(mg.pos - mg.zone.c) <= mg.zone.w / 2) {
            mg.hits++;
            mg.good = 0.25;
            emit('blip');
            if (mg.hits >= mg.need) return true;
            mg.zone = MINIGAMES.timing.newZone(rng, mg.pos);
            mg.speed += 0.12;
          } else {
            mg.cooldown = 0.35;
            mg.flash = 0.35;
            emit('error');
          }
        }
        return false;
      },
      ratio(mg) {
        return mg.hits / mg.need;
      },
    },

    // Sensor loco: memorizar y repetir un patrón de 4 colores (teclas 1-4).
    simon: {
      STEP: 0.5,
      ON: 0.36,
      create(rng) {
        const length = C.EVENT_PARAMS.crazySensor.length;
        return { type: 'simon', seq: randomSeq(rng, length, 4), idx: 0, phase: 'show', t: -0.25, lit: -1, press: -1, pressT: 0, flash: 0 };
      },
      update(mg, dt, input, rng, emit) {
        const S = MINIGAMES.simon;
        mg.pressT = Math.max(0, mg.pressT - dt);
        mg.flash = Math.max(0, mg.flash - dt);
        if (mg.phase === 'show') {
          mg.t += dt;
          const step = Math.floor(mg.t / S.STEP);
          const within = mg.t - step * S.STEP;
          mg.lit = mg.t >= 0 && step < mg.seq.length && within < S.ON ? mg.seq[step] : -1;
          if (mg.t >= mg.seq.length * S.STEP) {
            mg.phase = 'input';
            mg.lit = -1;
          }
          return false;
        }
        for (const key of input.pressed) {
          const d = ['1', '2', '3', '4'].indexOf(key);
          if (d < 0) continue;
          mg.press = d;
          mg.pressT = 0.18;
          if (d === mg.seq[mg.idx]) {
            mg.idx++;
            emit('blip');
            if (mg.idx >= mg.seq.length) return true;
          } else {
            mg.seq = randomSeq(rng, mg.seq.length, 4);
            mg.idx = 0;
            mg.phase = 'show';
            mg.t = -0.4;
            mg.flash = 0.35;
            emit('error');
            return false;
          }
        }
        return false;
      },
      ratio(mg) {
        return mg.idx / mg.seq.length;
      },
    },
  };

  PF.Minigames = MINIGAMES;
})();

// Simulación del turno: variables de proceso, eventos/alarmas, jugador y contabilidad
// de hectolitros. Lógica pura y determinista con semilla: no toca el DOM, así que
// se puede probar en Node (ver test/).
(function () {
  'use strict';
  const PF = globalThis.PF || (globalThis.PF = {});
  const C = PF.CONFIG;
  const MG = PF.Minigames;
  const VK = C.VAR_KEYS;
  const P = C.EVENT_PARAMS;

  const EMPTY_INPUT = { moveX: 0, moveY: 0, adjust: 0, space: false, pressed: [] };
  const SOLIDS = C.MAP.obstacles.concat(Object.values(C.MAP.stations).map((s) => s.rect));
  // Ritmo típico de deriva por variable; el sensor loco usa una fracción como deriva real oculta.
  const TYPICAL_DRIFT = {
    temp: mid(P.thermalDrift.rate),
    flow: mid(P.flowDrift.rate),
    hold: mid(P.slowBelt.rate),
  };

  function mid(r) {
    return (r[0] + r[1]) / 2;
  }

  function clamp(x, a, b) {
    return x < a ? a : x > b ? b : x;
  }

  function between(rng, r) {
    return r[0] + rng() * (r[1] - r[0]);
  }

  function sign(rng) {
    return rng() < 0.5 ? -1 : 1;
  }

  function makeRng(seed) {

    for (const k of VK) vars[k] = { value: C.VARS[k].ideal, outTicks: 0, dir: null, discarding: false, cause: null };
    const stations = {};
    for (const id in C.MAP.stations) stations[id] = { blockedUntil: -1 };
    return {
      rng,
      scheduler: opts.scheduler !== false,
      diff: C.DIFFICULTY[opts.difficulty] || C.DIFFICULTY.normal,
      ph: null,
      time: 0,
      ticks: 0,
      totalTicks: Math.round(C.DURATION / C.TICK),
      tickAcc: 0,
      over: false,
      endReason: null,
      vars,
      stations,
      player: { x: C.MAP.start.x, y: C.MAP.start.y, facing: 1, moving: false, walkT: 0, operating: null, adjust: 0 },
      activeEvents: [],
      nextId: 1,
      phaseIndex: -1,
      phaseSpawns: 0,
      phaseRepairs: 0,
      spawnTimer: 0,

      lowFlowTicks: 0,

  function emit(g, type, data) {
    g.signals.push(Object.assign({ type, time: g.time }, data));

  // ------------------------------------------------------------ Consultas

  function effective(g, key) {
    let x = g.vars[key].value;
    if (key !== 'flow') return x;
    for (const e of g.activeEvents) {
      if (e.type === 'stuckValve') return e.stuckValue;
      if (e.type === 'airPump') x += e.amp * Math.sin(e.phase);
      if (e.type === 'foam') x += e.flowOffset;

  // Valor que muestran los instrumentos (puede mentir con un sensor loco).
  function display(g, key) {

    const sensor = g.activeEvents.find((e) => e.type === 'crazySensor' && e.vars[0] === key);
    if (!sensor) return { value: real, lying: false };
    return { value: real + sensor.fake + sensor.jitter, lying: true };

  function varStatus(g, key) {
    const cfg = C.VARS[key];
    const x = effective(g, key);
    if (x < cfg.min - 1e-9) return 'low';
    if (x > cfg.max + 1e-9) return 'high';
    const half = (cfg.max - cfg.min) / 2;
    return Math.abs(x - cfg.ideal) > C.WARN_FRACTION * half ? 'warn' : 'ok';
  }

  function isBlocked(g, stationId) {
    const s = g.stations[stationId];

  function isStuck(g, key) {
    return key === 'flow' && g.activeEvents.some((e) => e.type === 'stuckValve');

    return g.activeEvents.some((e) => e.vars.includes(key));
  }

  function stationEvents(g, stationId) {
    return g.activeEvents.filter((e) => e.station === stationId);

  function activeRepair(g, stationId) {
    return g.activeEvents.find((e) => e.station === stationId && e.kind === 'repair') || null;
  }

    let best = null;
    let bestD = C.INTERACT_RADIUS;

      const d = Math.hypot(p.x - st.spot.x, p.y - st.spot.y);
      if (d <= bestD) {

        bestD = d;

    return best;
  }

  function phase(g) {
    return C.PHASES[Math.max(0, g.phaseIndex)];
  }

  function timeLeft(g) {
    return Math.max(0, C.DURATION - g.time);
  }

  function causeLabel(cause) {

    const [key, dir] = cause.split('_');

      const red = e.vars.some((k) => g.vars[k].discarding);
      list.push({ id: 'e' + e.id, title: e.name, station: e.station, hint: e.hint, severity: red ? 'red' : 'warn', event: e, vars: e.vars, born: e.born });
    }
    for (const k of VK) {
      if (covered.has(k)) continue;

      if (status === 'ok') continue;
      const cfg = C.VARS[k];
      const dir = status === 'warn' ? (effective(g, k) < cfg.ideal ? 'low' : 'high') : status;

        id: 'v' + k,
        title: capitalize(cfg[dir].cause),
        station: cfg.station,
        hint: status === 'warn' ? 'Cerca del límite: reajusta con A/D' : 'Fuera de rango: reajusta con A/D',
        severity: g.vars[k].discarding ? 'red' : 'warn',
        event: null,
        vars: [k],
        born: Infinity,

    }
    if (g.lineStopped) {
      list.push({ id: 'line', title: 'Paro de línea', station: 'valve', hint: 'Válvula al mínimo: la línea rearranca sola', severity: 'red', event: null, vars: ['flow'], born: -1 });
    } else if (g.lowFlowTicks > 0) {
      list.push({ id: 'line', title: 'Válvula al mínimo', station: 'valve', hint: '¡Abre la válvula o se para la línea!', severity: 'warn', event: null, vars: ['flow'], born: -1 });
    }
    const reds = list.filter((a) => a.severity === 'red').length;
    for (const a of list) a.blink = (a.severity === 'red' && reds >= 2) || isBlocked(g, a.station);
    list.sort((a, b) => (a.severity === b.severity ? a.born - b.born : a.severity === 'red' ? -1 : 1));
    return list;
  }

  // ------------------------------------------------------------- Jugador

  function collides(x, y) {
    const r = C.PLAYER_RADIUS;
    const b = C.MAP.bounds;
    if (x - r < b.x || x + r > b.x + b.w || y - r < b.y || y + r > b.y + b.h) return true;
    for (const s of SOLIDS) {
      const cx = clamp(x, s.x, s.x + s.w);
      const cy = clamp(y, s.y, s.y + s.h);
      if ((x - cx) ** 2 + (y - cy) ** 2 < r * r) return true;
    }
    return false;
  }

  function updatePlayer(g, dt, input) {
    const p = g.player;
    p.adjust = 0;
    if (input.pressed.includes('interact')) {
      if (p.operating) leaveStation(g);
      else enterStation(g);
    } else if (input.pressed.includes('cancel') && p.operating) {
      leaveStation(g);
    }
    if (p.operating) {
      p.moving = false;
      return;
    }
    let mx = input.moveX;
    let my = input.moveY;
    const len = Math.hypot(mx, my);
    if (!len) {
      p.moving = false;
      return;
    }
    mx /= len;
    my /= len;
    const step = C.PLAYER_SPEED * dt;
    const nx = p.x + mx * step;
    if (!collides(nx, p.y)) p.x = nx;
    const ny = p.y + my * step;
    if (!collides(p.x, ny)) p.y = ny;
    if (mx) p.facing = Math.sign(mx);
    p.moving = true;
    p.walkT += dt;
  }

  function enterStation(g) {
    const id = nearestStation(g);
    if (!id) return;
    if (isBlocked(g, id)) {
      emit(g, 'denied', { station: id });
      return;
    }
    g.player.operating = id;
    emit(g, 'enter', { station: id });
  }

  function leaveStation(g) {
    emit(g, 'leave', { station: g.player.operating });
    g.player.operating = null;
  }

  function updateStation(g, dt, input) {
    const id = g.player.operating;
    if (!id || isBlocked(g, id)) return;
    const key = C.MAP.stations[id].variable;
    const cfg = C.VARS[key];
    const repair = activeRepair(g, id);
    if (repair) {
      const done = MG[repair.mg.type].update(repair.mg, dt, input, g.rng, (type) => emit(g, type, { station: id }));
      if (done) resolve(g, repair, true);
    }
    if (input.adjust && !isStuck(g, key)) {
      const v = g.vars[key];
      v.value = clamp(v.value + input.adjust * cfg.adjustRate * dt, cfg.hardMin, cfg.hardMax);
      g.player.adjust = input.adjust;
    }
  }

  // ------------------------------------------------------------- Eventos

  function addVar(g, key, delta) {
    const cfg = C.VARS[key];
    const v = g.vars[key];
    v.value = clamp(v.value + delta, cfg.hardMin, cfg.hardMax);
  }

  function updateEvents(g, dt) {
    const rng = g.rng;
    for (const e of g.activeEvents.slice()) {
      e.age += dt;
      switch (e.type) {
        case 'thermalDrift':
        case 'flowDrift':
        case 'slowBelt':
          addVar(g, e.vars[0], e.rate * dt);
          break;
        case 'steamHit': {
          const cooling = e.mg.active && g.player.operating === 'temp' && !isBlocked(g, 'temp');
          addVar(g, 'temp', (cooling ? -P.steamHit.coolRate : P.steamHit.rate * g.diff.drift) * dt);
          break;
        }
        case 'airPump':
          e.phase += ((2 * Math.PI) / P.airPump.period) * dt;
          break;
        case 'foam':
          e.t += dt;
          e.flowOffset = P.foam.flowOffset + P.foam.wobble * Math.sin(e.t * 7.3);
          addVar(g, 'hold', -P.foam.holdRate * g.diff.drift * dt);
          break;
        case 'crazySensor': {
          const key = e.vars[0];
          const half = (C.VARS[key].max - C.VARS[key].min) / 2;
          addVar(g, key, e.realDrift * dt);
          e.fakeT -= dt;
          if (e.fakeT <= 0) {
            e.fakeT = 1 + rng() * 1.2;
            e.fakeTarget = sign(rng) * (0.4 + rng() * 1.1) * half;
          }
          e.fake += (e.fakeTarget - e.fake) * Math.min(1, dt * 3);
          e.jitterT -= dt;
          if (e.jitterT <= 0) {
            e.jitterT = 0.12;
            e.jitter = (rng() - 0.5) * 0.3 * half;
          }
          if (e.age >= P.crazySensor.duration) resolve(g, e, false);
          break;
        }
      }
      // Las derivas se cierran estabilizando la variable en la banda ideal desde la estación.
      if (e.kind === 'adjust' && g.activeEvents.includes(e)) {
        const cfg = C.VARS[e.vars[0]];
        const here = g.player.operating === e.station && !isBlocked(g, e.station);
        if (here && Math.abs(g.vars[e.vars[0]].value - cfg.ideal) <= cfg.band) e.settle += dt;
        else e.settle = 0;
        if (e.settle >= C.SETTLE_TIME) resolve(g, e, true);
      }
    }
  }

  function resolve(g, e, byPlayer) {
    const i = g.activeEvents.indexOf(e);
    if (i < 0) return;
    g.activeEvents.splice(i, 1);
    if (byPlayer) g.stats.resolved++;
    emit(g, 'resolved', { station: e.station, name: e.name, byPlayer });
  }

  function spawnEvent(g, type, ph) {
    const def = C.EVENTS[type];
    const rng = g.rng;
    let vars = def.vars;
    let station = def.station;
    if (type === 'crazySensor') {
      const free = VK.filter((k) => !varBusy(g, k));
      const key = free[Math.floor(rng() * free.length)];
      vars = [key];
      station = C.VARS[key].station;
    }
    const e = { id: g.nextId++, type, name: def.name, kind: def.kind, station, vars, hint: def.hint, age: 0, settle: 0, born: g.time, mg: null };
    switch (type) {
      case 'thermalDrift':
        e.rate = sign(rng) * between(rng, P.thermalDrift.rate) * g.diff.drift;
        break;
      case 'flowDrift':
        e.rate = sign(rng) * between(rng, P.flowDrift.rate) * g.diff.drift;
        break;
      case 'slowBelt':
        e.rate = between(rng, P.slowBelt.rate) * g.diff.drift;
        break;
      case 'stuckValve': {
        const cfg = C.VARS.flow;
        e.stuckValue = clamp(g.vars.flow.value + sign(rng) * between(rng, P.stuckValve.offset), C.LINE_STOP.threshold + 0.05, cfg.hardMax);
        break;
      }
      case 'airPump':
        e.amp = P.airPump.amp;
        e.phase = 0;
        break;
      case 'foam':
        e.t = 0;
        e.flowOffset = P.foam.flowOffset;
        break;
      case 'crazySensor':
        e.realDrift = sign(rng) * P.crazySensor.realDrift * TYPICAL_DRIFT[vars[0]] * g.diff.drift;
        e.fake = 0;
        e.fakeT = 0;
        e.fakeTarget = 0;
        e.jitter = 0;
        e.jitterT = 0;
        break;
    }
    if (def.minigame) e.mg = MG[def.minigame].create(rng);
    g.activeEvents.push(e);
    g.stats.spawned++;
    g.phaseSpawns++;
    if (def.kind === 'repair') g.phaseRepairs++;
    emit(g, 'alarm', { station, name: def.name });
    if (ph.blockChance && rng() < ph.blockChance) {
      g.stations[station].blockedUntil = g.time + C.BLOCK_TIME;
      emit(g, 'blocked', { station });
    }
    return e;
  }

  function canSpawn(g, type, ph) {
    const def = C.EVENTS[type];
    if (g.activeEvents.some((e) => e.type === type)) return false;
    if (def.kind === 'repair' && ph.maxRepairs != null && g.phaseRepairs >= ph.maxRepairs) return false;
    if (type === 'crazySensor') return VK.some((k) => !varBusy(g, k));
    return def.vars.every((k) => !varBusy(g, k));
  }

  function pickType(g, ph) {
    if (g.forcedType && canSpawn(g, g.forcedType, ph)) {
      const t = g.forcedType;
      g.forcedType = null;
      return t;
    }
    const options = ph.pool.filter((t) => canSpawn(g, t, ph));
    if (!options.length) return null;
    const weights = options.map((t) => C.EVENTS[t].weight * ((ph.boost && ph.boost[t]) || 1));
    let r = g.rng() * weights.reduce((a, b) => a + b, 0);
    for (let i = 0; i < options.length; i++) {
      r -= weights[i];
      if (r <= 0) return options[i];
    }
    return options[options.length - 1];
  }

  function updatePhase(g) {
    let idx = C.PHASES.findIndex((p) => g.time < p.until);
    if (idx < 0) idx = C.PHASES.length - 1;
    if (idx === g.phaseIndex) return;
    g.phaseIndex = idx;
    const ph = C.PHASES[idx];
    // La fase efectiva aplica la dificultad elegida; el arranque (0-10 s) no cambia.
    const d = g.diff;
    const maxActive = idx === 0 ? ph.maxActive : Math.max(1, ph.maxActive + d.maxActiveDelta);
    g.ph = Object.assign({}, ph, {
      maxActive,
      minActive: ph.minActive ? Math.max(1, Math.min(maxActive, ph.minActive + d.maxActiveDelta)) : ph.minActive,
      interval: ph.interval.map((x) => x * d.interval),
      blockChance: (ph.blockChance || 0) * d.block,
    });
    g.phaseSpawns = 0;
    g.phaseRepairs = 0;
    g.spawnTimer = ph.firstAt;
    g.forcedType = ph.firstType || null;
    emit(g, 'phase', { index: idx, label: ph.label, peak: !!ph.peak });
  }

  function updateScheduler(g, dt) {
    const ph = g.ph;
    g.spawnTimer -= dt;
    // En las fases altas se garantiza un mínimo de alarmas simultáneas.
    if (ph.minActive && g.activeEvents.length < ph.minActive) g.spawnTimer = Math.min(g.spawnTimer, 1.2);
    if (g.spawnTimer > 0) return;
    if (ph.maxTotal != null && g.phaseSpawns >= ph.maxTotal) {
      g.spawnTimer = Infinity;
      return;
    }
    const type = g.activeEvents.length < ph.maxActive ? pickType(g, ph) : null;
    if (!type) {
      g.spawnTimer = 0.5;
      return;
    }
    spawnEvent(g, type, ph);
    g.spawnTimer = between(g.rng, ph.interval);
  }

  // ------------------------------------------------------- Contabilidad

  function addCause(g, cause, vol) {
    g.stats.byCause[cause] = (g.stats.byCause[cause] || 0) + vol;
  }

  function accountTick(g) {
    const dt = C.TICK;
    const s = g.stats;
    g.ticks++;

    const causes = [];
    for (const k of VK) {
      const v = g.vars[k];
      const status = varStatus(g, k);
      const dir = status === 'low' || status === 'high' ? status : null;
      v.outTicks = dir ? (dir === v.dir ? v.outTicks + 1 : 1) : 0;
      v.dir = dir;
      const prevCause = v.discarding ? v.cause : null;
      v.discarding = !!dir && !g.lineStopped && v.outTicks > C.GRACE_TICKS;
      v.cause = v.discarding ? k + '_' + dir : null;
      if (v.discarding) {
        causes.push(v.cause);
        if (v.cause !== prevCause) {
          s.episodes[v.cause] = (s.episodes[v.cause] || 0) + 1;
          emit(g, 'discardStart', { variable: k, dir });
        }
      }
    }

    const vol = g.lineStopped ? 0 : effective(g, 'flow') * dt;
    s.processed += vol;
    if (causes.length) {
      s.discarded += vol;
      g.second.discarded += vol;
      for (const c of causes) addCause(g, c, vol / causes.length);
    } else {
      s.approved += vol;
      g.second.approved += vol;
    }
    g.discardingNow = causes.length > 0;

    // Anti-trampa: válvula al mínimo demasiado tiempo => paro de línea.
    const LS = C.LINE_STOP;
    if (!g.lineStopped) {
      g.lowFlowTicks = effective(g, 'flow') <= LS.threshold ? g.lowFlowTicks + 1 : 0;
      if (g.lowFlowTicks * dt > LS.time + 1e-9) {
        g.lineStopped = true;
        g.lineStopTicks = Math.round(LS.duration / dt);
        g.lowFlowTicks = 0;
        s.lineStops++;
        emit(g, 'lineStop', {});
      }
    } else if (--g.lineStopTicks <= 0) {
      g.lineStopped = false;
      s.processed += LS.purgeHL;
      s.discarded += LS.purgeHL;
      g.second.discarded += LS.purgeHL;
      addCause(g, 'lineStop', LS.purgeHL);
      s.episodes.lineStop = (s.episodes.lineStop || 0) + 1;
      g.vars.flow.value = C.VARS.flow.ideal;
      emit(g, 'lineRestart', { purge: LS.purgeHL });
    }

    // Paro de planta opcional.
    const PS = C.PLANT_STOP;
    if (PS.enabled) {
      const reds = alarms(g).filter((a) => a.severity === 'red').length;
      g.redTicks = reds >= PS.minRed ? g.redTicks + 1 : 0;
      if (g.redTicks * dt >= PS.time - 1e-9) end(g, 'plant');
    }

    if (++g.second.ticks >= 10) {
      emit(g, 'volume', { approved: g.second.approved, discarded: g.second.discarded });
      g.second = { ticks: 0, approved: 0, discarded: 0 };
    }
  }

  function end(g, reason) {
    if (g.over) return;
    g.over = true;
    g.endReason = reason;
    g.player.operating = null;
    emit(g, 'end', { reason });
  }

  // ---------------------------------------------------------- Bucle

  function step(g, dt, input) {
    if (g.over) return;
    input = input || EMPTY_INPUT;
    dt = Math.min(dt, 0.1);
    g.time += dt;
    for (const e of g.activeEvents) if (e.mg && e.mg.type === 'hold') e.mg.active = false;
    updatePhase(g);
    updatePlayer(g, dt, input);
    updateStation(g, dt, input);
    updateEvents(g, dt);
    if (g.scheduler) updateScheduler(g, dt);
    g.tickAcc += dt;
    while (g.tickAcc >= C.TICK - 1e-9 && g.ticks < g.totalTicks && !g.over) {
      g.tickAcc -= C.TICK;
      accountTick(g);
    }
    if (!g.over && g.ticks >= g.totalTicks) end(g, 'time');
  }

  // ------------------------------------------------------------ Resumen

  function results(g) {
    const s = g.stats;
    const efficiency = s.processed > 0 ? (s.approved / s.processed) * 100 : 0;
    const causes = Object.keys(s.byCause)
      .map((c) => ({ cause: c, label: causeLabel(c), hl: s.byCause[c], episodes: s.episodes[c] || 0 }))
      .filter((c) => c.hl > 1e-6)
      .sort((a, b) => b.hl - a.hl);
    const main = causes[0] || null;
    let mainLabel = null;
    if (main) mainLabel = main.label + (main.episodes >= 3 && main.cause !== 'lineStop' ? ' intermitente' : '');
    let rank = C.RANKS.find((r) => efficiency >= r.min).rank;
    if (g.endReason === 'plant') rank = 'C';
    return {
      processed: s.processed,
      approved: s.approved,
      discarded: s.discarded,
      efficiency,
      causes,
      mainCause: main ? main.cause : null,
      mainCauseLabel: mainLabel,
      rank,
      endReason: g.endReason,
      spawned: s.spawned,
      resolved: s.resolved,
      lineStops: s.lineStops,
      duration: g.ticks * C.TICK,
    };
  }

  function summaryText(r) {
    const cause = r.mainCauseLabel ? `Causa principal: ${r.mainCauseLabel}.` : 'Causa principal: ninguna, turno limpio.';
    return (
      `Pasaron ${fmt(r.processed, 1)} HL. Aprobados: ${fmt(r.approved, 1)} HL. ` +
      `Desechados: ${fmt(r.discarded, 1)} HL. Eficiencia: ${fmt(r.efficiency, 1)}%. ${cause} Rango ${r.rank}.`
    );
  }

  PF.Sim = {
    createGame,
    step,
    effective,
    display,
    varStatus,
    alarms,
    isBlocked,
    isStuck,
    stationEvents,
    activeRepair,
    nearestStation,
    phase,
    timeLeft,
    results,
    summaryText,
    causeLabel,
    makeRng,
    fmt,
  };
})();

// Efectos de sonido sintetizados con WebAudio (sin archivos externos).
(function () {
  'use strict';
  const PF = globalThis.PF || (globalThis.PF = {});

  let ctx = null;
  let master = null;
  let muted = false;
  let siren = null;
  let lastTick = 0;

  function init() {
    if (ctx) {
      if (ctx.state === 'suspended') ctx.resume();
      return;
    }
    const AC = globalThis.AudioContext || globalThis.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = muted ? 0 : 0.5;
    master.connect(ctx.destination);
  }

  function tone({ freq = 440, to = null, type = 'square', dur = 0.12, vol = 0.15, delay = 0 }) {
    if (!ctx) return;
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (to) osc.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(master);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  const sfx = {
    alarm() {
      tone({ freq: 880, dur: 0.1, vol: 0.12 });
      tone({ freq: 660, dur: 0.12, vol: 0.12, delay: 0.12 });
    },
    discardStart() {
      tone({ freq: 220, to: 140, type: 'sawtooth', dur: 0.25, vol: 0.1 });
    },
    resolved() {
      tone({ freq: 523, type: 'triangle', dur: 0.1, vol: 0.18 });
      tone({ freq: 784, type: 'triangle', dur: 0.16, vol: 0.18, delay: 0.08 });
    },
    blip() {
      tone({ freq: 1040, type: 'triangle', dur: 0.06, vol: 0.12 });
    },
    error() {
      tone({ freq: 160, type: 'square', dur: 0.18, vol: 0.12 });
    },
    // Burbuja "¡Esto no va así!": dos notas descendentes tipo "uh-oh".
    oops() {
      tone({ freq: 420, type: 'triangle', dur: 0.14, vol: 0.16 });
      tone({ freq: 300, type: 'triangle', dur: 0.22, vol: 0.16, delay: 0.15 });
    },
    enter() {
      tone({ freq: 340, type: 'triangle', dur: 0.06, vol: 0.1 });
    },
    denied() {
      tone({ freq: 120, type: 'sawtooth', dur: 0.2, vol: 0.12 });
    },
    blocked() {
      tone({ freq: 90, to: 60, type: 'sawtooth', dur: 0.35, vol: 0.14 });
    },
    lineStop() {
      tone({ freq: 300, to: 60, type: 'sawtooth', dur: 0.8, vol: 0.18 });
    },
    end() {
      tone({ freq: 392, type: 'triangle', dur: 0.2, vol: 0.18 });
      tone({ freq: 523, type: 'triangle', dur: 0.2, vol: 0.18, delay: 0.18 });
      tone({ freq: 659, type: 'triangle', dur: 0.4, vol: 0.18, delay: 0.36 });
    },
    adjust() {
      if (!ctx || ctx.currentTime - lastTick < 0.08) return;
      lastTick = ctx.currentTime;
      tone({ freq: 1800, type: 'square', dur: 0.015, vol: 0.04 });
    },
  };

  // Sirena continua de hora pico: oscilador con LFO sobre la frecuencia.
  function setSiren(on) {
    if (!ctx) return;
    if (on && !siren) {
      const osc = ctx.createOscillator();
      const lfo = ctx.createOscillator();
      const lfoGain = ctx.createGain();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.value = 620;
      lfo.frequency.value = 1.6;
      lfoGain.gain.value = 180;
      gain.gain.value = 0.035;
      lfo.connect(lfoGain).connect(osc.frequency);
      osc.connect(gain).connect(master);
      osc.start();
      lfo.start();
      siren = { osc, lfo };
    } else if (!on && siren) {
      siren.osc.stop();
      siren.lfo.stop();
      siren = null;
    }
  }

  function setMuted(m) {
    muted = m;
    if (master) master.gain.value = muted ? 0 : 0.5;
  }

  PF.Audio = {
    init,
    play(name) {
      if (sfx[name]) sfx[name]();
    },
    setSiren,
    setMuted,
    isMuted: () => muted,
  };
})();
