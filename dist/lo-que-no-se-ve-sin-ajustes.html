    <script>
// Supervisor de Turno: administración del turno de envasado con LEF, GLY y OSE.
// 6 turnos: cada turno de 12 h se simula en 6 s y luego hay 30, 40 o 50 s para responder
// (se elige en la configuración, aparte de la dificultad). El juego espera la respuesta;
// solo avanza solo si se acaba ese tiempo. Dos modos:
//  · Diagnóstico de turno: lee el tablero y decide qué KPI detecta la gran caída
//    (LEF, GLY, OSE o ninguno si el turno fue excelente) y con quién atacarla.
//  · ¿Qué KPIs caen?: en el reporte de fin de turno, marca TODOS los KPIs que afecta
//    cada pérdida (interna → LEF, GLY y OSE · planificada/externa → GLY y OSE ·
//    no programada → solo OSE), porque una misma pérdida baja varios KPIs.
// Los KPI se calculan siempre con las causas reales: los reportes pueden estar sin
// verificar o equivocados, pero los números no mienten.
(function () {
  'use strict';
  const PF = globalThis.PF || (globalThis.PF = {});
  const D = PF.Draw;
  const B = PF.Bubble;
  const K = PF.KPI;
  const T = D.T;
  const ACCENT = '#5fc8e8';

  const SHIFTS = 6;
  const SIM_S = 6; // 12 h simuladas en 6 s
  const ANSWER_TIMES = [30, 40, 50];
  const REVEAL_S = 6; // tras agotar el tiempo, la solución se ve unos segundos y el juego sigue
  const MODES = { diag: 'Diagnóstico de turno', kpi: '¿Qué KPIs caen?' };
  const KPI_KEYS = ['LEF', 'GLY', 'OSE'];
  // Puntos por pérdida clasificada: 15 por cada KPI bien decidido (marcado o no) + 5 si están los tres.
  const ITEM_POINTS = { perKpi: 15, exact: 5 };

  const DIFF = {
    facil: { decoy: 0, unverified: 0, wrong: 0, jokers: 3, tags: true, gapHints: true, lineAlways: true, colorTimeline: true, labels: true, itemsB: 3, traps: 0 },
    normal: { decoy: 0.5, unverified: 0.35, wrong: 0, jokers: 2, tags: false, gapHints: false, lineAlways: false, colorTimeline: false, labels: true, itemsB: 4, traps: 1 },
    dificil: { decoy: 1, unverified: 0.25, wrong: 0.3, jokers: 1, tags: false, gapHints: false, lineAlways: false, colorTimeline: false, labels: false, itemsB: 4, traps: 2 },
  };

  // Botones en rombo, igual que la cara del mando y en el orden LEF ≥ GLY ≥ OSE:
  // arriba LEF (△/Y), izquierda GLY (□/X), derecha OSE (○/B), abajo OK o "los tres" (✕/A).
  const SLOTS = {
    LEF: { key: '↑', pad: 'y', pos: 'top' },
    GLY: { key: '←', pad: 'x', pos: 'left' },
    OSE: { key: '→', pad: 'b', pos: 'right' },
    OK: { key: '↓', pad: 'a', pos: 'bottom' },
  };
  const SLOT_CAT = { LEF: 'int', GLY: 'pe', OSE: 'ns', OK: 'ok' };
  // Diagnóstico expresado como el KPI que detecta primero la gran caída.
  const DIAG_KPI = { int: 'LEF', pe: 'GLY', ns: 'OSE', ok: 'NINGUNO' };
  const POS_INDEX = { left: 0, top: 1, right: 2 };
  const CTRL = {
    joker: { key: 'C', pad: 'lb' },
    view: { key: 'V', pad: 'rb' },
    help: { key: 'H', pad: 'select' },
  };
  const ROWS = ['LEF', 'GLY', 'OSE'];

  const PANEL = {
    kpi: { x: 16, y: 76, w: 400, h: 562 },
    center: { x: 428, y: 76, w: 420, h: 562 },
    dec: { x: 860, y: 76, w: 404, h: 562 },
  };
  const MSG = { x: 8, y: 646, w: 1264, h: 66 };
  const MACHINES = ['Depaletizadora', 'Lavadora', 'Llenadora', 'Pasteurizador', 'Etiquetadora', 'Paletizadora'];

  // Pérdidas que pueden ocupar horas en el turno (23 y 24 son errores de dato).
  const TIMED = K.LOSSES.filter((d) => !d.noHours);
  // El diagnóstico usa los ítems de un solo KPI (1-18); los que "pueden caer en más de
  // uno" quedan como trampas del modo "¿Qué KPIs caen?".
  const DIAG_POOL = TIMED.filter((d) => !d.mixed);

  // ------------------------------------------------------------- Estado

  function create(diffId = 'normal', opts = {}) {
    const cfg = DIFF[diffId] || DIFF.normal;
    const mode = MODES[opts.mode] ? opts.mode : 'diag';
    const answerTime = ANSWER_TIMES.includes(+opts.answerTime) ? +opts.answerTime : 40;
    const s = {
      id: 'admin',
      mode,
      diff: diffId,
      cfg,
      rng: D.makeRng(opts.seed),
      answerTime,
      // El reloj del HUD es el tiempo para responder del turno en curso.
      duration: answerTime,
      timeLeft: answerTime,
      over: false,
      index: -1,
      shift: null,
      jokers: cfg.jokers,
      view: 'line',
      help: false,
      bubble: B.create(),
      floats: [],
      banner: null,
      lastType: [],
      stats: {
        points: 0,
        max: 0,
        diagOk: 0,
        actionOk: 0,
        unanswered: 0,
        timeouts: 0,
        jokersUsed: 0,
        // ¿Qué KPIs caen?: pérdidas con los tres KPIs bien decididos y decisiones por KPI.
        exact: 0,
        classified: 0,
        kpis: { LEF: { ok: 0, total: 0 }, GLY: { ok: 0, total: 0 }, OSE: { ok: 0, total: 0 } },
        confusions: {},
      },
    };
    nextShift(s);
    s.update = (dt, input) => update(s, dt, input);
    s.draw = (r) => draw(s, r);
    s.report = () => report(s);
    return s;
  }

  function rint(rng, n) {
    return Math.floor(rng() * n);
  }

  function pick(rng, list) {
    return list[rint(rng, list.length)];
  }

  function round1(x) {
    return Math.round(x * 10) / 10;
  }

  function fmtH(h) {
    return `${h.toFixed(1).replace('.', ',')} h`;
  }

  function clockLabel(h) {
    const m = Math.round(h * 60);
    return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
  }

  // Reparte las pérdidas a lo largo de las 12 h sin solaparse.
  function schedule(rng, losses) {
    const timed = losses.filter((l) => !l.def.noHours);
    const order = D.shuffle(rng, timed);
    const busy = order.reduce((a, l) => a + l.hours, 0);
    const free = Math.max(0.5, K.HOURS - busy - 0.3);
    const cuts = order.map(() => rng());
    const total = cuts.reduce((a, b) => a + b, 0) + rng() + 0.2;
    let t = 0.15;
    order.forEach((l, i) => {
      t += (cuts[i] / total) * free;
      l.start = round1(t);
      t = l.start + l.hours;
    });
    // Los errores de dato no ocupan tiempo: se reportan al final del turno.
    for (const l of losses) if (l.def.noHours) l.start = K.HOURS - 0.01;
    return losses.slice().sort((a, b) => a.start - b.start);
  }

  // Reporte del operador para cada pérdida: correcto, sin verificar o equivocado.
  function makeReports(s, losses) {
    const { cfg, rng } = s;
    return losses.map((l) => {
      let status = 'ok';
      if (!l.def.base && !l.def.noHours) {
        const x = rng();
        if (x < cfg.wrong) status = 'wrong';
        else if (x < cfg.wrong + cfg.unverified) status = 'unverified';
      }
      const fake = status === 'wrong' ? pick(rng, TIMED.filter((d) => d.cat !== l.def.cat && !d.base)) : null;
      return { loss: l, status, fake, verified: false };
    });
  }

  function genDiag(s) {
    const { rng, cfg } = s;
    // Variedad: no repetir el mismo tipo tres veces seguidas.
    const types = ['ok', 'int', 'pe', 'ns', 'int', 'pe'];
    let type;
    do type = pick(rng, types);
    while (s.lastType.length >= 2 && s.lastType.slice(-2).every((x) => x === type));
    s.lastType.push(type);

    const losses = [];
    const used = new Set();
    const take = (cat, hours, id = null) => {
      const pool = DIAG_POOL.filter((d) => (id ? d.id === id : d.cat === cat && !d.base && !used.has(d.id)));
      const def = pick(rng, pool);
      used.add(def.id);
      const l = { def, hours: Math.max(0.1, round1(hours)) };
      losses.push(l);
      return l;
    };
    if (rng() < 0.85) take('pe', 0.5, 'cambio-estandar');
    const others = ['int', 'pe', 'ns'].filter((c) => c !== type);
    if (type === 'ok') {
      if (rng() < 0.7) take('int', 0.1 + rng() * 0.2);
      if (rng() < 0.4) take('pe', 0.1 + rng() * 0.2);
      // Un turno real nunca es perfecto: al menos una pérdida pequeña.
      if (!losses.length) take('int', 0.1 + rng() * 0.2);
    } else {
      const total = 1.7 + rng() * 1.1;
      const parts = type === 'int' ? 1 + rint(rng, 3) : 1 + rint(rng, 2);
      let left = total;
      for (let i = 0; i < parts; i++) {
        const h = i === parts - 1 ? left : Math.max(0.4, left * (0.35 + rng() * 0.3));
        take(type, h);
        left -= h;
      }
      // Ruido: alguna pérdida interna pequeña, casi siempre presente.
      if (type !== 'int' && rng() < 0.6) take('int', 0.1 + rng() * 0.2);
      // Señuelo: otra pérdida de tamaño medio que acerca las brechas.
      if (rng() < cfg.decoy) take(pick(rng, others), 0.6 + rng() * 0.4);
    }
    // La causa dominante debe destacar en el tablero por al menos 5 puntos.
    if (type !== 'ok') {
      for (let i = 0; i < 20; i++) {
        const g = K.gaps(K.kpis(losses.map((l) => ({ ...l, start: 0 }))));
        const second = Math.max(...others.map((c) => g[c]));
        if (g[type] >= 0.12 && g[type] - second >= 0.05) break;
        const main = losses.find((l) => l.def.cat === type);
        main.hours = round1(main.hours + 0.3);
      }
    }
    const sched = schedule(rng, losses);
    const truth = K.diagnose(K.kpis(sched));
    // Con quién se ataca: el dueño de la pérdida más grande de la causa dominante.
    let owner = 'none';
    if (truth !== 'ok') owner = sched.filter((l) => l.def.cat === truth).sort((a, b) => b.hours - a.hours)[0].def.owner;
    const wrong = D.shuffle(
      rng,
      Object.keys(K.OWNERS).filter((o) => o !== owner)
    ).slice(0, 2);
    const options = D.shuffle(rng, [owner, ...wrong]);
    return { type: truth, losses: sched, reports: makeReports(s, sched), owner, options };
  }

  function genKpi(s) {
    const { rng, cfg } = s;
    const used = new Set();
    const defs = [];
    // Trampas: los ítems que "pueden caer en más de un KPI" (difícil incluye los errores de dato).
    const trapPool = K.LOSSES.filter((d) => d.mixed && (s.diff === 'dificil' || !d.noHours));
    for (const def of D.shuffle(rng, trapPool).slice(0, cfg.traps)) {
      used.add(def.id);
      defs.push(def);
    }
    const cats = D.shuffle(rng, ['int', 'pe', 'ns']);
    let ci = 0;
    while (defs.length < cfg.itemsB) {
      const cat = cats[ci++ % 3];
      const pool = K.LOSSES.filter((d) => d.cat === cat && !d.mixed && !used.has(d.id));
      const def = pick(rng, pool);
      used.add(def.id);
      defs.push(def);
    }
    const losses = schedule(
      rng,
      defs.map((def) => ({ def, hours: def.noHours ? 0 : round1(0.3 + rng() * 1.2) }))
    );
    return { type: null, losses, reports: makeReports(s, losses), answers: losses.map(() => null), cursor: 0, sel: emptySel() };
  }

  function emptySel() {
    return { LEF: false, GLY: false, OSE: false };
  }

  function nextShift(s) {
    s.index++;
    if (s.index >= SHIFTS) {
      s.over = true;
      s.timeLeft = 0;
      return;
    }
    const sh = s.mode === 'diag' ? genDiag(s) : genKpi(s);
    Object.assign(sh, { t: 0, wait: 0, phase: 'run', ff: false, timedOut: false, doneT: 0, diag: null, action: null, clock: 0 });
    s.shift = sh;
    s.view = 'line';
    s.timeLeft = s.answerTime;
    B.clear(s.bubble);
    s.banner = D.makeBanner(
      `TURNO ${s.index + 1} DE ${SHIFTS} · 12 h en ${SIM_S} s`,
      ACCENT,
      s.mode === 'diag' ? 'Responde: ¿qué KPI detecta la caída?' : 'Al final, clasifica cada pérdida',
      1.3
    );
  }

  // Terminó la simulación de las 12 h (en diagnóstico se puede responder antes).
  function simDone(sh) {
    return sh.t >= SIM_S || sh.clock >= K.HOURS;
  }

  // El turno queda resuelto: la explicación se queda en pantalla hasta pulsar Continuar.
  function finish(s) {
    const sh = s.shift;
    sh.phase = 'done';
    sh.doneT = REVEAL_S;
    if (s.bubble.cur) s.bubble.cur.life = s.bubble.cur.max = 1e6;
  }

  // Se muestran las causas reales (brechas y horas por tipo): en diagnóstico tras responder;
  // en "¿Qué KPIs caen?" solo al terminar, para no regalar las respuestas.
  function revealed(s) {
    const sh = s.shift;
    if (!sh) return false;
    return s.mode === 'kpi' ? sh.phase === 'done' : sh.phase === 'action' || sh.phase === 'done';
  }

  // Etiquetas de tipo en los reportes (solo fácil y solo en diagnóstico).
  function tagged(s) {
    return s.cfg.tags && s.mode === 'diag';
  }

  function activeLoss(sh) {
    return sh.losses.find((l) => !l.def.noHours && sh.clock >= l.start && sh.clock < l.start + l.hours) || null;
  }

  // ------------------------------------------------------------- Actualización

  function update(s, dt, input) {
    if (s.over) return;
    const P = input.pressed;
    const pad = input.pad || { pressed: [] };
    const pp = pad.pressed;
    const hit = (keys, btns) => keys.some((k) => P.includes(k)) || btns.some((b) => pp.includes(b));

    const clicks = input.clicks || [];
    const tapped = (rc) => clicks.some((c) => inside(c, rc));
    // La ayuda congela el turno; se cierra con el mismo botón, B o tocando la pantalla.
    if (s.help) {
      if (hit(['help', 'cancel'], ['select', 'b']) || clicks.length) s.help = false;
      return;
    }
    if (hit(['help'], ['select']) || tapped(HELP_TAP)) {
      s.help = true;
      return;
    }

    const sh = s.shift;
    sh.t += dt;
    B.update(s.bubble, dt);
    s.floats = D.floatsUpdate(s.floats, dt);
    D.tickBanner(s, dt);
    // Reloj del turno simulado: 12 h en SIM_S segundos (acelera si respondes antes).
    const target = Math.min(K.HOURS, (sh.t / SIM_S) * K.HOURS);
    sh.clock = sh.ff ? Math.min(K.HOURS, sh.clock + dt * 18) : Math.max(sh.clock, target);

    if (sh.phase === 'done') {
      // Continuar: Enter/Espacio, ✕/A o clic en el botón. Si se agotó el tiempo, sigue solo.
      const next = hit(['confirm', 'space'], ['a']) || (input.clicks || []).some((c) => inside(c, continueRect()));
      if (sh.timedOut) sh.doneT -= dt;
      if (next || (sh.timedOut && sh.doneT <= 0)) {
        nextShift(s);
        D.sfx('blip');
      }
      return;
    }
    // El tiempo para responder corre cuando terminan las 12 h simuladas.
    if (simDone(sh)) sh.wait += dt;
    s.timeLeft = Math.max(0, s.answerTime - sh.wait);
    if (sh.wait >= s.answerTime) {
      timeout(s);
      return;
    }
    if (s.mode === 'kpi' && sh.phase === 'run' && sh.clock >= K.HOURS) {
      sh.phase = 'report';
      s.view = 'report';
      D.sfx('alarm');
    }

    if ((hit(['tab', 'view'], ['rb']) || tapped(toolRect(1))) && !s.cfg.lineAlways && sh.phase === 'run') {
      s.view = s.view === 'line' ? 'reports' : 'line';
      D.sfx('blip');
    }
    if (hit(['joker'], ['lb']) || tapped(toolRect(0))) useJoker(s);

    // Teclado: flechas o 1-4. Mando: △ □ ○ ✕ (Y X B A) o la cruceta. Se procesan en orden
    // (en "¿Qué KPIs caen?" se pueden marcar varios y confirmar en el mismo instante).
    const KEY_SLOT = { up: 'LEF', 1: 'LEF', left: 'GLY', 2: 'GLY', right: 'OSE', 3: 'OSE', down: 'OK', 4: 'OK' };
    const PAD_SLOT = { y: 'LEF', up: 'LEF', x: 'GLY', left: 'GLY', b: 'OSE', right: 'OSE', a: 'OK', down: 'OK' };
    if (s.mode === 'kpi') KEY_SLOT.confirm = 'OK';
    const slots = [...P.map((k) => KEY_SLOT[k]), ...pp.map((b) => PAD_SLOT[b])].filter(Boolean);
    for (const c of input.clicks || []) {
      const slot = Object.entries(diamond()).find(([, rc]) => inside(c, rc));
      if (slot) slots.push(slot[0]);
    }
    for (const slot of s.mode === 'kpi' ? slots : slots.slice(0, 1)) {
      if (s.shift !== sh || s.over) break;
      answer(s, slot);
    }
  }

  // Zonas tocables (pantallas táctiles y ratón): "ayuda" del HUD y las herramientas.
  const HELP_TAP = { x: 1170, y: 34, w: 110, h: 30 };
  function toolRect(i) {
    const rc = PANEL.dec;
    return { x: rc.x + 8, y: rc.y + 440 + i * 30, w: rc.w - 16, h: 30 };
  }

  function inside(p, rc) {
    return p.x >= rc.x && p.x <= rc.x + rc.w && p.y >= rc.y && p.y <= rc.y + rc.h;
  }

  function useJoker(s) {
    const sh = s.shift;
    if (s.jokers <= 0) {
      B.say(s.bubble, 'Ya no te quedan llamadas para verificar en este juego.', { kind: 'tip', life: 2.5 });
      return;
    }
    const pending = sh.reports.filter((r) => !r.verified && r.loss.start <= sh.clock);
    if (!pending.length) {
      B.say(s.bubble, 'No hay reportes por verificar todavía: espera a que pase algo en la línea.', { kind: 'tip', life: 2.5 });
      return;
    }
    s.jokers--;
    s.stats.jokersUsed++;
    let fixed = 0;
    for (const r of pending) {
      r.verified = true;
      if (r.status !== 'ok') fixed++;
    }
    if (!s.cfg.lineAlways && sh.phase === 'run') s.view = 'reports';
    B.say(s.bubble, fixed ? `Llamaste y verificaste: ${fixed} ${fixed === 1 ? 'reporte estaba' : 'reportes estaban'} sin confirmar o mal informados. Ya ves la causa real.` : 'Llamaste y verificaste: los reportes eran correctos.', { kind: 'ok', title: 'Verificado', life: 4 });
    D.sfx('resolved');
  }

  function answer(s, slot) {
    const sh = s.shift;
    if (s.mode === 'diag') {
      if (sh.phase === 'run') diagAnswer(s, SLOT_CAT[slot]);
      else if (sh.phase === 'action' && slot !== 'OK') actionAnswer(s, sh.options[POS_INDEX[SLOTS[slot].pos]]);
    } else if (sh.phase === 'report') {
      if (slot === 'OK') confirmItem(s);
      else {
        // Varias opciones: △ □ ○ (o ↑ ← →) marcan y desmarcan; ✕ / ↓ / ENTER confirma.
        sh.sel[slot] = !sh.sel[slot];
        D.sfx('blip');
      }
    }
  }

  function diagAnswer(s, cat) {
    const sh = s.shift;
    sh.diag = cat;
    sh.ff = true;
    sh.phase = 'action';
    s.stats.max += 100;
    const truth = sh.type;
    const d = K.DIAG[truth];
    if (cat === truth) {
      s.stats.diagOk++;
      s.stats.points += 100;
      D.floatAdd(s.floats, 1062, 290, '+100', T.ok, 24);
      B.say(s.bubble, `${diagSaid(truth)} ${K.DIAG_WHY[truth]}`, { kind: 'ok', life: 8 });
      D.sfx('resolved');
    } else {
      const key = `${DIAG_KPI[cat]} en vez de ${DIAG_KPI[truth]}`;
      s.stats.confusions[key] = (s.stats.confusions[key] || 0) + 1;
      const said = cat === 'ok' ? 'No es "ninguno"' : `No es el ${DIAG_KPI[cat]}`;
      const why = diagSaid(truth);
      B.say(s.bubble, `${said}: ${why[0].toLowerCase()}${why.slice(1)} Patrón: ${d.pattern}. ${K.DIAG_WHY[truth]}`, { life: 10 });
    }
  }

  // "La gran caída la detecta el LEF (problema interno de la línea)."
  function diagSaid(type) {
    const d = K.DIAG[type];
    return type === 'ok' ? `Ningún KPI cae: ${d.label.toLowerCase()}.` : `La gran caída la detecta el ${DIAG_KPI[type]} (${d.label.toLowerCase()}).`;
  }

  function actionAnswer(s, owner) {
    const sh = s.shift;
    sh.action = owner;
    s.stats.max += 50;
    const correct = sh.owner;
    const why = sh.type === 'ok' ? 'Turno excelente: no hay pérdida grande que atacar; se estandariza lo que funcionó.' : K.CATS[sh.type].power;
    if (owner === correct) {
      s.stats.actionOk++;
      s.stats.points += 50;
      D.floatAdd(s.floats, 1062, 290, '+50', T.ok, 22);
      if (!(s.bubble.cur && s.bubble.cur.kind === 'error')) B.say(s.bubble, why, { kind: 'ok', title: 'Bien dirigido', life: 3 });
      D.sfx('blip');
    } else {
      B.say(s.bubble, `La pérdida principal se ataca con ${ownerLabel(correct)}, no con ${ownerLabel(owner)}. ${why}`);
    }
    finish(s);
  }

  function ownerLabel(o) {
    return o === 'none' ? 'nadie: estandarizar y mantener' : K.OWNERS[o];
  }

  // "LEF, GLY y OSE" · "GLY y OSE" · "solo el OSE".
  function kpiList(list) {
    if (list.length === 1) return `solo el ${list[0]}`;
    return `${list.slice(0, -1).join(', ')} y ${list[list.length - 1]}`;
  }

  function confirmItem(s) {
    const sh = s.shift;
    const chosen = KPI_KEYS.filter((k) => sh.sel[k]);
    if (!chosen.length) {
      B.say(s.bubble, 'Marca al menos un KPI: toda pérdida afecta como mínimo a uno. Luego confirma.', { kind: 'tip', life: 3 });
      return;
    }
    const i = sh.cursor;
    const l = sh.losses[i];
    const truth = K.affects(l.def);
    sh.answers[i] = chosen;
    sh.sel = emptySel();
    s.stats.max += ITEM_POINTS.perKpi * 3 + ITEM_POINTS.exact;
    s.stats.classified++;
    const extra = chosen.filter((k) => !truth.includes(k));
    const missing = truth.filter((k) => !chosen.includes(k));
    for (const k of KPI_KEYS) {
      s.stats.kpis[k].total++;
      if (chosen.includes(k) === truth.includes(k)) s.stats.kpis[k].ok++;
    }
    const exact = !extra.length && !missing.length;
    const pts = ITEM_POINTS.perKpi * (3 - extra.length - missing.length) + (exact ? ITEM_POINTS.exact : 0);
    s.stats.points += pts;
    if (pts) D.floatAdd(s.floats, 1062, 290, `+${pts}`, exact ? T.ok : T.warn, 22);
    // En los ítems "que pueden caer en más de un KPI" se explica primero el caso concreto.
    const why = l.def.mixed && !l.def.noHours ? `${l.def.explain} ${K.affectsWhy(l.def)}` : K.affectsWhy(l.def);
    const verb = l.def.distort ? 'Distorsiona a' : 'Afecta a';
    if (exact) {
      s.stats.exact++;
      B.say(s.bubble, `${verb} ${kpiList(truth)}. ${why}`, { kind: 'ok', life: 6 });
      D.sfx('resolved');
    } else {
      // Clave corta para el reporte: "LEF de más · planificada", "faltó OSE · interna".
      const cat = l.def.distort ? 'registro' : { int: 'interna', pe: 'planificada', ns: 'no programada', all: 'dato' }[l.def.cat];
      for (const k of extra) {
        const key = `${k} de más · ${cat}`;
        s.stats.confusions[key] = (s.stats.confusions[key] || 0) + 1;
      }
      for (const k of missing) {
        const key = `faltó ${k} · ${cat}`;
        s.stats.confusions[key] = (s.stats.confusions[key] || 0) + 1;
      }
      const parts = [];
      if (extra.length) parts.push(`marcaste ${extra.join(' y ')} de más`);
      if (missing.length) parts.push(`te faltó ${missing.join(' y ')}`);
      B.say(s.bubble, `${verb} ${kpiList(truth)}: ${parts.join(' y ')}. ${why}`, { life: 9 });
    }
    sh.cursor++;
    if (sh.cursor >= sh.losses.length) finish(s);
  }

  // Se acabó el tiempo para responder: lo que falta cuenta como fallo, se muestra la
  // solución unos segundos y el juego avanza solo.
  function timeout(s) {
    const sh = s.shift;
    s.stats.timeouts++;
    if (s.mode === 'diag') {
      if (sh.phase === 'run') {
        s.stats.max += 150;
        s.stats.unanswered++;
        B.say(s.bubble, `Se acabó el tiempo. ${diagSaid(sh.type)} Patrón: ${K.DIAG[sh.type].pattern}. Se ataca con ${ownerLabel(sh.owner)}.`, { kind: 'tip', title: 'Tiempo agotado' });
      } else if (sh.phase === 'action') {
        s.stats.max += 50;
        B.say(s.bubble, `Se acabó el tiempo sin elegir con quién atacarla: era con ${ownerLabel(sh.owner)}.`, { kind: 'tip', title: 'Tiempo agotado' });
      }
    } else {
      for (let i = sh.cursor; i < sh.losses.length; i++) {
        s.stats.max += ITEM_POINTS.perKpi * 3 + ITEM_POINTS.exact;
        for (const k of KPI_KEYS) s.stats.kpis[k].total++;
      }
      if (sh.cursor < sh.losses.length) {
        s.stats.unanswered += sh.losses.length - sh.cursor;
        B.say(s.bubble, 'Se acabó el tiempo con pérdidas sin clasificar: cuentan como fallos. Mira la solución en el reporte.', { kind: 'tip', title: 'Tiempo agotado' });
      }
      sh.cursor = sh.losses.length;
    }
    sh.ff = true;
    finish(s);
    sh.timedOut = true;
  }

  // ------------------------------------------------------------- Dibujo

  function draw(s, r) {
    const ctx = r.ctx;
    const t = r.t;
    D.begin(r);
    ctx.fillStyle = T.bg;
    ctx.fillRect(0, 0, D.VIEW.width, D.VIEW.height);
    if (s.shift) {
      drawKpiPanel(s, ctx);
      drawCenter(s, ctx, t);
      drawDecision(s, ctx, r);
    }
    D.floatsDraw(ctx, s.floats);
    // Las explicaciones son largas: si hay una, usa todo el ancho de la barra.
    B.bar(ctx, MSG, { bubble: s.bubble, notices: s.bubble.cur ? [] : [s.banner], t, split: 0.72 });
    D.hud(ctx, t, {
      title: 'SUPERVISOR DE TURNO',
      diff: s.diff,
      timeLeft: s.timeLeft,
      duration: s.duration,
      accent: ACCENT,
      stats: [
        { label: 'Turno', value: `${Math.min(SHIFTS, s.index + 1)}/${SHIFTS}`, width: 100 },
        { label: 'Puntos', value: s.stats.points, color: T.ok, width: 110 },
        { label: MODES[s.mode], value: '', width: 10, mono: false },
      ],
    });
    D.hints(ctx, [[CTRL.help, 'ayuda']], 1266, 50, { size: 11, align: 'right', ink: T.dim, color: '#6e5a48' });
    if (s.help) drawHelp(ctx);
  }

  function panelTitle(ctx, rc, title, sub = null) {
    D.panel(ctx, rc.x, rc.y, rc.w, rc.h, { fill: '#100c0c', edge: '#2e2420', radius: 12 });
    ctx.fillStyle = ACCENT;
    D.roundRect(ctx, rc.x, rc.y, rc.w, 34, 12);
    ctx.fill();
    ctx.fillRect(rc.x, rc.y + 20, rc.w, 14);
    D.text(ctx, title, rc.x + 14, rc.y + 23, { size: 16, weight: 800, color: '#0c1418' });
    if (sub) D.text(ctx, sub, rc.x + rc.w - 14, rc.y + 23, { size: 13, weight: 700, color: '#0c1418', align: 'right' });
  }

  function kpiColor(v) {
    if (v == null) return T.faint;
    return v >= 0.9 ? T.ok : v >= 0.8 ? T.warn : T.red;
  }

  function drawKpiPanel(s, ctx) {
    const rc = PANEL.kpi;
    const sh = s.shift;
    panelTitle(ctx, rc, 'TABLERO KPI · LÍNEA 2', `turno ${s.index + 1}/${SHIFTS}`);
    const x = rc.x + 16;
    const w = rc.w - 32;
    // Reloj y línea de tiempo del turno.
    D.text(ctx, `Hora ${clockLabel(sh.clock)} de 12:00`, x, rc.y + 60, { size: 15, weight: 700, color: T.ink, family: D.MONO });
    const ty = rc.y + 70;
    ctx.fillStyle = '#1f2a1f';
    D.roundRect(ctx, x, ty, w, 16, 5);
    ctx.fill();
    const showCat = s.cfg.colorTimeline || revealed(s);
    for (const l of sh.losses) {
      if (l.def.noHours || l.start > sh.clock) continue;
      const a = x + (l.start / K.HOURS) * w;
      const b = x + (Math.min(sh.clock, l.start + l.hours) / K.HOURS) * w;
      ctx.fillStyle = showCat ? K.CATS[l.def.cat].color : '#8a7a6a';
      ctx.fillRect(a, ty, Math.max(2, b - a), 16);
    }
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + (sh.clock / K.HOURS) * w - 1, ty - 4, 2, 24);
    D.text(ctx, showCat ? 'pérdidas por tipo' : 'pérdidas (causa sin clasificar)', x, ty + 32, { size: 11, color: T.faint });

    const k = K.kpis(sh.losses, Math.max(0.01, sh.clock));
    const showGaps = s.cfg.gapHints || revealed(s);
    // Orden LEF ≥ GLY ≥ OSE: cada barra muestra la brecha que detecta primero.
    const rows = [
      ['LEF', 'EPT / tiempo de operación (LET)', k.lef, 1, 'int'],
      ['GLY', 'EPT / tiempo programado', k.gly, k.lef ?? 1, 'pe'],
      ['OSE', 'EPT / tiempo total', k.ose, k.gly ?? k.lef ?? 1, 'ns'],
    ];
    const bx = x;
    const bw = w;
    const pos = (v) => bx + Math.max(0, Math.min(1, (v - 0.5) / 0.5)) * bw;
    rows.forEach(([name, sub, v, above, cat], i) => {
      const y = rc.y + 136 + i * 92;
      D.text(ctx, name, x, y + 24, { size: 30, weight: 800, color: T.ink });
      D.text(ctx, sub, x + 70, y + 22, { size: 12, color: T.dim });
      D.text(ctx, K.pct(v), x + w, y + 26, { size: 26, weight: 700, color: kpiColor(v), family: D.MONO, align: 'right' });
      const yb = y + 38;
      ctx.fillStyle = '#241c18';
      D.roundRect(ctx, bx, yb, bw, 24, 6);
      ctx.fill();
      if (v != null) {
        ctx.fillStyle = kpiColor(v);
        D.roundRect(ctx, bx, yb, pos(v) - bx, 24, 6);
        ctx.fill();
        // Brecha: lo que este KPI detecta respecto al anterior.
        if (showGaps && above - v > 0.002) {
          ctx.fillStyle = K.CATS[cat].color;
          ctx.globalAlpha = 0.85;
          ctx.fillRect(pos(v), yb, pos(above) - pos(v), 24);
          ctx.globalAlpha = 1;
          D.text(ctx, `−${((above - v) * 100).toFixed(1).replace('.', ',')} pts · ${K.CATS[cat].short.toLowerCase()}`, x + w, yb + 42, { size: 12, weight: 700, color: K.CATS[cat].color, align: 'right' });
        }
      }
      for (const m of [0.6, 0.7, 0.8, 0.9]) {
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fillRect(pos(m), yb, 1, 24);
      }
    });
    D.text(ctx, sh.clock < K.HOURS ? 'acumulado hasta la hora actual · escala 50–100 %' : 'turno completo · escala 50–100 %', x, rc.y + 136 + 3 * 92 - 8, { size: 11, color: T.faint });

    const y0 = rc.y + 440;
    if (revealed(s)) {
      const kf = K.kpis(sh.losses);
      D.text(ctx, 'HORAS PERDIDAS EN EL TURNO', x, y0, { size: 12, weight: 800, color: T.dim });
      ['int', 'pe', 'ns'].forEach((c, i) => {
        const yy = y0 + 22 + i * 22;
        ctx.fillStyle = K.CATS[c].color;
        ctx.fillRect(x, yy - 10, 12, 12);
        D.text(ctx, `${K.CATS[c].short} → la detecta ${K.CATS[c].kpi}`, x + 20, yy, { size: 14, weight: 600 });
        D.text(ctx, fmtH(kf[c]), x + w, yy, { size: 14, weight: 700, color: K.CATS[c].color, align: 'right', family: D.MONO });
      });
      D.text(ctx, 'Mismo numerador (EPT) → LEF ≥ GLY ≥ OSE', x, y0 + 100, { size: 11, color: T.faint });
    } else if (s.cfg.gapHints && s.mode === 'diag') {
      D.text(ctx, 'REGLA RÁPIDA', x, y0, { size: 12, weight: 800, color: T.dim });
      const rules = [
        ['LEF bajo (arrastra a GLY y OSE)', 'interno', K.CATS.int.color],
        ['LEF alto · GLY bajo', 'planificada / externa', K.CATS.pe.color],
        ['LEF y GLY altos · OSE bajo', 'sin programar', K.CATS.ns.color],
        ['todo alto (≥ 90 %)', 'excelente', T.ok],
      ];
      rules.forEach(([a, b, c], i) => {
        D.text(ctx, a, x, y0 + 22 + i * 21, { size: 13, weight: 600 });
        D.text(ctx, `→ ${b}`, x + w, y0 + 22 + i * 21, { size: 13, weight: 800, color: c, align: 'right' });
      });
    } else {
      D.text(ctx, 'LEF ≥ GLY ≥ OSE', x, y0 + 20, { size: 20, weight: 800, color: T.ink });
      D.paragraph(ctx, 'Mismo numerador (EPT), distinto denominador. Busca la brecha más grande: LEF = interna · LEF→GLY = planificada o externa · GLY→OSE = sin programar.', x, y0 + 46, w, { size: 13, color: T.dim });
    }
  }

  function drawCenter(s, ctx, t) {
    const rc = PANEL.center;
    const sh = s.shift;
    if (s.mode === 'kpi' && sh.phase !== 'run') {
      drawEndReport(s, ctx);
      return;
    }
    if (s.cfg.lineAlways) {
      panelTitle(ctx, rc, 'VER LA LÍNEA · REPORTES');
      drawLine(s, ctx, { x: rc.x + 10, y: rc.y + 44, w: rc.w - 20, h: 210 }, t);
      drawReports(s, ctx, { x: rc.x + 10, y: rc.y + 264, w: rc.w - 20, h: rc.h - 274 });
      return;
    }
    panelTitle(ctx, rc, s.view === 'line' ? 'VER LA LÍNEA' : 'REPORTES DEL TURNO');
    D.hints(ctx, [[CTRL.view, s.view === 'line' ? 'reportes' : 'ver la línea']], rc.x + rc.w - 12, rc.y + 17, { size: 11, align: 'right', ink: '#0c1418', color: '#0c1418', keyInk: ACCENT });
    if (s.view === 'line') {
      drawLine(s, ctx, { x: rc.x + 10, y: rc.y + 44, w: rc.w - 20, h: 260 }, t);
      D.paragraph(ctx, 'Lo que ves aquí es la causa real, en vivo. Los reportes los escriben los operadores y pueden llegar tarde, sin verificar o equivocados.', rc.x + 16, rc.y + 340, rc.w - 32, { size: 14, color: T.dim });
      const n = sh.reports.filter((r) => r.loss.start <= sh.clock).length;
      D.text(ctx, `${n} reportes recibidos`, rc.x + 16, rc.y + 420, { size: 14, weight: 700, color: ACCENT });
    } else {
      drawReports(s, ctx, { x: rc.x + 10, y: rc.y + 44, w: rc.w - 20, h: rc.h - 54 });
    }
  }

  // Texto que muestra un reporte según su estado (y si ya se verificó).
  function reportText(s, rep) {
    if (rep.verified || rep.status === 'ok' || revealed(s)) return rep.loss.def.name;
    if (rep.status === 'unverified') return 'Línea detenida · causa por confirmar';
    return rep.fake.name;
  }

  function reportBadge(s, rep) {
    if (rep.verified) return rep.status === 'wrong' ? ['✖ estaba mal informado', T.red] : ['✔ verificado', T.ok];
    if (rep.status === 'unverified') return ['? sin verificar', T.warn];
    // En difícil todo reporte de operador llega sin verificar: no se distinguen los erróneos.
    if (s.cfg.wrong > 0 && !rep.loss.def.base && !rep.loss.def.noHours) return ['? reporte de operador', T.warn];
    return null;
  }

  function drawReports(s, ctx, rc) {
    const sh = s.shift;
    const list = sh.reports.filter((r) => !r.loss.def.noHours && r.loss.start <= sh.clock);
    if (!list.length) D.text(ctx, 'Sin reportes todavía.', rc.x + 6, rc.y + 24, { size: 14, color: T.faint });
    list.slice(-6).forEach((rep, i) => {
      const y = rc.y + i * 46;
      const l = rep.loss;
      ctx.fillStyle = '#1a1412';
      D.roundRect(ctx, rc.x, y, rc.w, 40, 6);
      ctx.fill();
      const known = rep.verified || rep.status === 'ok';
      if (tagged(s) || (known && revealed(s))) {
        ctx.fillStyle = K.CATS[l.def.cat].color;
        ctx.fillRect(rc.x, y, 5, 40);
      }
      D.text(ctx, clockLabel(l.start), rc.x + 12, y + 17, { size: 13, weight: 700, color: T.dim, family: D.MONO });
      const dur = Math.min(l.hours, Math.max(0, sh.clock - l.start));
      D.text(ctx, fmtH(dur), rc.x + rc.w - 10, y + 17, { size: 13, weight: 700, color: T.dim, align: 'right', family: D.MONO });
      ctx.font = D.font(14, 700);
      const full = reportText(s, rep);
      let txt = full;
      while (ctx.measureText(txt).width > rc.w - 130 && txt.length > 4) txt = txt.slice(0, -2);
      if (txt !== full) txt += '…';
      D.text(ctx, txt, rc.x + 62, y + 17, { size: 14, weight: 700, color: known ? T.ink : '#ffd9a8' });
      const badge = reportBadge(s, rep);
      if (rep.verified && rep.status === 'wrong') {
        ctx.font = D.font(11, 600);
        let said = `reportado: ${rep.fake.name}`;
        while (ctx.measureText(said).width > rc.w - 200 && said.length > 12) said = said.slice(0, -2);
        D.text(ctx, said.length < `reportado: ${rep.fake.name}`.length ? said + '…' : said, rc.x + 62, y + 34, { size: 11, color: T.red });
      }
      else if (tagged(s)) D.text(ctx, `${K.CATS[l.def.cat].name} → ${K.CATS[l.def.cat].kpi}`, rc.x + 62, y + 34, { size: 11, color: K.CATS[l.def.cat].color });
      if (badge) D.text(ctx, badge[0], rc.x + rc.w - 10, y + 34, { size: 11, weight: 700, color: badge[1], align: 'right' });
    });
  }

  // Vista de la línea: máquinas, botellas y la causa real de la pérdida en curso.
  function drawLine(s, ctx, rc, t) {
    const sh = s.shift;
    const loss = activeLoss(sh);
    const cat = loss && loss.def.cat;
    const color = cat ? K.CATS[cat].color : T.ok;
    ctx.fillStyle = '#0c0a09';
    D.roundRect(ctx, rc.x, rc.y, rc.w, rc.h, 8);
    ctx.fill();
    const n = MACHINES.length;
    const mw = (rc.w - 20 - (n - 1) * 6) / n;
    const my = rc.y + 40;
    const mh = 64;
    const vis = loss ? loss.def.visual : null;
    // Sin programar (o sin gente): la línea está apagada.
    const dark = cat === 'ns' || vis === 'nostaff';
    // Las pérdidas de velocidad y rechazo no paran la línea.
    const flowing = !loss || vis === 'slow' || vis === 'reject';
    const cy = my + mh + 26;
    ctx.fillStyle = '#2b2320';
    ctx.fillRect(rc.x + 10, cy, rc.w - 20, 10);
    const speed = !loss ? 60 : vis === 'slow' ? 18 : flowing ? 45 : 0;
    const emptyIn = vis === 'material' || vis === 'beer';
    for (let i = 0; i < 18; i++) {
      let bx = rc.x + 14 + ((i * 22 + t * speed) % (rc.w - 30));
      if (emptyIn && bx < rc.x + rc.w * 0.45) continue;
      if (vis === 'jam' && i % 3 === 0) bx += 4;
      ctx.fillStyle = dark ? '#3a3230' : vis === 'reject' && i % 5 === 0 ? T.red : '#c98a2a';
      ctx.fillRect(bx, cy - 10 + ((vis === 'jam' || vis === 'micro') && i % 4 === 0 ? -6 : 0), 7, 10);
    }
    MACHINES.forEach((name, i) => {
      const x = rc.x + 10 + i * (mw + 6);
      const hitHere = loss && (loss.def.machine === i || loss.def.machine === -1);
      let fill = dark ? '#1c1715' : '#3b3431';
      let edge = '#0d0807';
      if (hitHere && !dark) {
        const blink = Math.floor(t * 4) % 2 === 0;
        fill = cat === 'int' ? (blink ? '#6a1d16' : '#3b1a16') : '#4a3416';
        edge = color;
      }
      ctx.fillStyle = fill;
      D.roundRect(ctx, x, my, mw, mh, 6);
      ctx.fill();
      ctx.strokeStyle = edge;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = !loss ? T.ok : hitHere ? color : dark ? '#3a3230' : flowing ? T.ok : T.warn;
      ctx.beginPath();
      ctx.arc(x + mw / 2, my + 14, 6, 0, Math.PI * 2);
      ctx.fill();
      D.text(ctx, name.slice(0, 7) + (name.length > 7 ? '.' : ''), x + mw / 2, my + mh - 10, { size: 10, weight: 700, color: T.dim, align: 'center' });
      if (hitHere && !dark) drawCause(ctx, vis, x + mw / 2, my + 38, color, t);
    });
    // Rótulo de estado (en difícil solo el color y la animación).
    let label = 'LÍNEA PRODUCIENDO';
    if (loss) label = s.cfg.labels ? loss.def.name.toUpperCase() : cat === 'int' ? 'ALARMA EN LA LÍNEA' : cat === 'pe' ? 'PARADA · PLANIFICADA O ESPERANDO' : 'LÍNEA SIN PROGRAMAR';
    if (dark && loss) drawCause(ctx, vis, rc.x + rc.w / 2, my + 38, color, t);
    ctx.font = D.font(14, 800);
    const lw = Math.min(rc.w - 20, ctx.measureText(label).width + 30);
    ctx.fillStyle = loss ? color : '#1f3a1f';
    D.roundRect(ctx, rc.x + (rc.w - lw) / 2, rc.y + 8, lw, 24, 12);
    ctx.fill();
    ctx.save();
    ctx.beginPath();
    ctx.rect(rc.x + 10, rc.y + 8, rc.w - 20, 24);
    ctx.clip();
    D.text(ctx, label, rc.x + rc.w / 2, rc.y + 25, { size: 14, weight: 800, color: loss ? '#140c09' : T.ok, align: 'center' });
    ctx.restore();
    if (rc.h > 220) {
      D.text(ctx, loss ? `Desde las ${clockLabel(loss.start)} · ${fmtH(Math.max(0, sh.clock - loss.start))}` : 'Sin pérdidas en este momento', rc.x + rc.w / 2, cy + 44, { size: 13, color: T.dim, align: 'center' });
    }
  }

  // Ícono simple de la causa sobre la máquina afectada.
  function drawCause(ctx, vis, x, y, color, t) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = color;
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    const bob = Math.sin(t * 5) * 2;
    if (vis === 'breakdown' || vis === 'adjust' || vis === 'changeover' || vis === 'pm' || vis === 'project') {
      // Llave inglesa (con reloj si es ajuste o exceso).
      ctx.rotate(-0.6 + Math.sin(t * 6) * 0.2);
      ctx.fillRect(-3, -2, 6, 18);
      ctx.beginPath();
      ctx.arc(0, -6, 8, Math.PI * 0.2, Math.PI * 1.8);
      ctx.stroke();
      if (vis === 'adjust') {
        ctx.rotate(0.6);
        ctx.beginPath();
        ctx.arc(16, -10, 7, 0, Math.PI * 2);
        ctx.stroke();
      }
    } else if (vis === 'electrical') {
      ctx.beginPath();
      ctx.moveTo(4, -14 + bob);
      ctx.lineTo(-6, 2 + bob);
      ctx.lineTo(1, 2 + bob);
      ctx.lineTo(-4, 14 + bob);
      ctx.lineTo(7, -2 + bob);
      ctx.lineTo(0, -2 + bob);
      ctx.closePath();
      ctx.fill();
    } else if (vis === 'micro' || vis === 'jam' || vis === 'slow') {
      D.text(ctx, vis === 'slow' ? '◔' : '!', 0, 8 + bob, { size: 22, weight: 800, color, align: 'center' });
    } else if (vis === 'reject') {
      D.text(ctx, '✖', 0, 8 + bob, { size: 20, weight: 800, color, align: 'center' });
    } else if (vis === 'material') {
      // Camión: falta material de envase.
      ctx.fillRect(-12, -6 + bob, 18, 12);
      ctx.fillRect(6, -2 + bob, 7, 8);
      ctx.fillStyle = '#140c09';
      ctx.beginPath();
      ctx.arc(-6, 7 + bob, 3, 0, Math.PI * 2);
      ctx.arc(8, 7 + bob, 3, 0, Math.PI * 2);
      ctx.fill();
    } else if (vis === 'beer') {
      // Tanque de cerveza vacío.
      D.roundRect(ctx, -9, -13, 18, 26, 6);
      ctx.stroke();
      ctx.fillRect(-6, 6, 12, 4);
    } else if (vis === 'utility') {
      D.roundRect(ctx, -6, -12, 12, 24, 5);
      ctx.fill();
    } else if (vis === 'cip') {
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.arc(-8 + i * 6, -6 + ((t * 20 + i * 7) % 16), 3, 0, Math.PI * 2);
        ctx.stroke();
      }
    } else if (vis === 'nostaff') {
      // Persona ausente.
      ctx.beginPath();
      ctx.arc(0, -8, 5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-8, 12);
      ctx.quadraticCurveTo(0, -2, 8, 12);
      ctx.stroke();
    } else {
      // Sin programar / aguas arriba: calendario.
      ctx.strokeRect(-12, -10, 24, 20);
      ctx.fillRect(-12, -10, 24, 6);
      if (vis === 'upstream') D.text(ctx, '!', 0, 9, { size: 13, weight: 800, color, align: 'center' });
    }
    ctx.restore();
  }

  function drawEndReport(s, ctx) {
    const rc = PANEL.center;
    const sh = s.shift;
    panelTitle(ctx, rc, 'REPORTE DE FIN DE TURNO', 'lo que falló');
    D.text(ctx, '¿Qué KPIs afecta? Marca todos los que caen', rc.x + 16, rc.y + 58, { size: 16, weight: 800, color: ACCENT });
    sh.losses.forEach((l, i) => {
      const rep = sh.reports[i];
      const y = rc.y + 74 + i * 84;
      const cur = sh.phase === 'report' && i === sh.cursor;
      const ans = sh.answers[i];
      const truth = K.affects(l.def);
      D.panel(ctx, rc.x + 10, y, rc.w - 20, 76, { fill: cur ? '#16262c' : '#1a1412', edge: cur ? ACCENT : '#2e2420', radius: 8, glow: cur ? ACCENT : null });
      if (cur) D.text(ctx, '▶', rc.x + 22, y + 30, { size: 16, weight: 800, color: ACCENT });
      ctx.font = D.font(15, 700);
      const lines = D.wrap(ctx, reportText(s, rep), rc.w - 150).slice(0, 2);
      lines.forEach((ln, j) => D.text(ctx, ln, rc.x + 40, y + 24 + j * 18, { size: 15, weight: 700, color: rep.verified || rep.status === 'ok' ? T.ink : '#ffd9a8' }));
      D.text(ctx, l.def.noHours ? 'dato' : fmtH(l.hours), rc.x + 40, y + 66, { size: 12, color: T.dim, family: D.MONO });
      const badge = reportBadge(s, rep);
      if (badge) D.text(ctx, badge[0], rc.x + 100, y + 66, { size: 11, weight: 700, color: badge[1] });
      // Respuesta: una casilla por KPI (verde = bien marcado, rojo = de más, naranja = faltó).
      drawKpiMarks(ctx, rc.x + rc.w - 92, y + 14, { truth, ans, cur, sel: sh.sel, done: sh.phase === 'done' });
    });
  }

  function drawKpiMarks(ctx, x, y, { truth, ans, cur, sel, done }) {
    KPI_KEYS.forEach((k, j) => {
      const bx = x + j * 26;
      const inTruth = truth.includes(k);
      let fill = '#1e1814';
      let edge = '#3a2e26';
      let ink = T.faint;
      if (ans) {
        const marked = ans.includes(k);
        if (marked && inTruth) [fill, edge, ink] = [T.okDark, T.ok, T.ok];
        else if (marked) [fill, edge, ink] = ['#4a1410', T.red, T.red];
        else if (inTruth) [fill, edge, ink] = ['#2a2018', T.warn, T.warn];
      } else if (done) {
        if (inTruth) [fill, edge, ink] = ['#2a2018', T.warn, T.warn];
      } else if (cur && sel[k]) [fill, edge, ink] = ['#16323a', ACCENT, ACCENT];
      else if (cur) [edge, ink] = ['#2e5560', T.dim];
      D.panel(ctx, bx, y, 22, 46, { fill, edge, radius: 6 });
      D.text(ctx, k[0], bx + 11, y + 20, { size: 15, weight: 800, color: ink, align: 'center' });
      const mark = ans ? (ans.includes(k) ? (inTruth ? '✔' : '✖') : inTruth ? '!' : '') : cur && sel[k] ? '✔' : done && inTruth ? '!' : '';
      if (mark) D.text(ctx, mark, bx + 11, y + 39, { size: 12, weight: 800, color: ink, align: 'center' });
    });
    if (ans && ans.length === truth.length && ans.every((k) => truth.includes(k))) D.text(ctx, 'bien', x + 37, y + 60, { size: 11, weight: 800, color: T.ok, align: 'center' });
  }

  // Rectángulos del rombo de respuestas (también para el ratón).
  function diamond() {
    const rc = PANEL.dec;
    const w = 176;
    const h = 66;
    const cx = rc.x + rc.w / 2;
    const cy = rc.y + 200;
    return {
      LEF: { x: cx - w / 2, y: cy - h - 40, w, h },
      GLY: { x: rc.x + 14, y: cy - h / 2, w, h },
      OSE: { x: rc.x + rc.w - 14 - w, y: cy - h / 2, w, h },
      OK: { x: cx - w / 2, y: cy + 40, w, h },
    };
  }

  function slotLabels(s) {
    const sh = s.shift;
    if (s.mode === 'kpi') {
      // Casillas: se marcan varias y luego se confirma.
      const box = (k) => `${sh.sel[k] ? '☑' : '☐'} ${k}`;
      const n = KPI_KEYS.filter((k) => sh.sel[k]).length;
      return {
        LEF: [box('LEF'), sh.sel.LEF ? 'marcado: cae' : 'márcalo si cae', K.CATS.int.color],
        GLY: [box('GLY'), sh.sel.GLY ? 'marcado: cae' : 'márcalo si cae', K.CATS.pe.color],
        OSE: [box('OSE'), sh.sel.OSE ? 'marcado: cae' : 'márcalo si cae', K.CATS.ns.color],
        OK: ['CONFIRMAR', n ? `${n} KPI${n > 1 ? 's' : ''} marcado${n > 1 ? 's' : ''}` : 'marca al menos uno', T.ok],
      };
    }
    if (sh.phase === 'run' || (sh.phase === 'done' && !sh.diag)) {
      // ¿Qué KPI detecta la gran caída? El subtítulo recuerda el patrón.
      return {
        LEF: ['LEF', 'cae el LEF y arrastra', K.CATS.int.color],
        GLY: ['GLY', 'LEF alto · GLY bajo', K.CATS.pe.color],
        OSE: ['OSE', 'LEF y GLY altos · OSE bajo', K.CATS.ns.color],
        OK: ['NINGUNO', 'turno excelente (≥ 90 %)', T.ok],
      };
    }
    // Acción: con quién se ataca la pérdida principal (izquierda, arriba, derecha).
    const lab = (o) => (o === 'none' ? ['ESTANDARIZAR', 'y mantener lo que funcionó', T.ok] : [ownerShort(o), ownerHint(o), ACCENT]);
    const out = {};
    for (const [slot, def] of Object.entries(SLOTS)) if (def.pos in POS_INDEX) out[slot] = lab(sh.options[POS_INDEX[def.pos]]);
    return out;
  }

  function ownerShort(o) {
    return { mantenimiento: 'MANTENIMIENTO', operacion: 'OPERACIÓN', smed: 'EQUIPO SMED', calidad: 'CALIDAD', abastecimiento: 'ABASTECIMIENTO', elaboracion: 'ELABORACIÓN', utilities: 'UTILITIES', planificacion: 'PLANIFICACIÓN' }[o];
  }

  function ownerHint(o) {
    return {
      mantenimiento: 'fallas y preventivos',
      operacion: 'en el poder de la línea',
      smed: 'cambios de formato más cortos',
      calidad: 'frecuencia y duración del CIP',
      abastecimiento: 'materiales de envase',
      elaboracion: 'filtración, bodega, cocimiento',
      utilities: 'energía, vapor, CO₂, aire',
      planificacion: 'programa, ventas y capacidad',
    }[o];
  }

  function drawDecision(s, ctx, r) {
    const rc = PANEL.dec;
    const sh = s.shift;
    let title = s.mode === 'kpi' ? '¿QUÉ KPIs AFECTA?' : sh.phase === 'run' ? '¿QUÉ KPI DETECTA LA CAÍDA?' : '¿CON QUIÉN LA ATACAS?';
    if (sh.phase === 'done') title = 'RESULTADO DEL TURNO';
    panelTitle(ctx, rc, title);
    let help = '';
    if (s.mode === 'diag') help = sh.phase === 'run' ? 'Elige el KPI que detecta primero la gran caída, o NINGUNO si el turno fue excelente.' : sh.phase === 'action' ? 'Elige con quién atacar la pérdida principal.' : '';
    else help = sh.phase === 'run' ? 'Observa la línea: el reporte llega al final del turno.' : sh.phase === 'report' ? 'Una pérdida puede bajar varios KPIs: marca todos los que caen y confirma.' : '';
    if (help) D.paragraph(ctx, help, rc.x + 16, rc.y + 56, rc.w - 32, { size: 13, color: T.dim });

    const labels = slotLabels(s);
    const active = (s.mode === 'diag' && (sh.phase === 'run' || sh.phase === 'action')) || (s.mode === 'kpi' && sh.phase === 'report');
    for (const [slot, rcB] of Object.entries(diamond())) {
      const lab = labels[slot];
      if (!lab) continue;
      const marked = s.mode === 'kpi' && active && sh.sel[slot];
      D.panel(ctx, rcB.x, rcB.y, rcB.w, rcB.h, { fill: marked ? '#2a2a1a' : '#1a1412', edge: active ? lab[2] : '#2e2420', radius: 10, glow: active ? lab[2] : null });
      if (marked) {
        ctx.save();
        ctx.globalAlpha = 0.22;
        ctx.fillStyle = lab[2];
        D.roundRect(ctx, rcB.x, rcB.y, rcB.w, rcB.h, 10);
        ctx.fill();
        ctx.restore();
      }
      ctx.globalAlpha = active ? 1 : 0.45;
      const cw = D.control(ctx, SLOTS[slot], rcB.x + 10, rcB.y + rcB.h / 2, { size: 13, color: lab[2] });
      ctx.font = D.font(16, 800);
      let main = lab[0];
      while (ctx.measureText(main).width > rcB.w - cw - 26 && main.length > 4) main = main.slice(0, -2);
      if (main !== lab[0]) main += '.';
      D.text(ctx, main, rcB.x + cw + 18, rcB.y + 29, { size: 16, weight: 800, color: lab[2] });
      D.text(ctx, lab[1], rcB.x + cw + 18, rcB.y + 48, { size: 11, weight: 600, color: T.dim });
      ctx.globalAlpha = 1;
    }

    // Fácil: la regla para marcar, bajo el rombo.
    if (s.mode === 'kpi' && sh.phase === 'report' && s.cfg.gapHints) {
      const y = rc.y + 330;
      D.text(ctx, 'REGLA: mismo numerador (EPT)', rc.x + 16, y, { size: 12, weight: 800, color: T.dim });
      [
        ['Interna', 'LEF + GLY + OSE', K.CATS.int.color],
        ['Planificada / externa', 'GLY + OSE', K.CATS.pe.color],
        ['No programada', 'solo OSE', K.CATS.ns.color],
        ['Error de dato', 'según el dato', K.CATS.all.color],
      ].forEach(([a, b, c], i) => {
        D.text(ctx, a, rc.x + 16, y + 20 + i * 19, { size: 13, weight: 700, color: c });
        D.text(ctx, b, rc.x + rc.w - 16, y + 20 + i * 19, { size: 13, weight: 800, color: T.ink, align: 'right' });
      });
    }

    // Resultado del turno (modo diagnóstico).
    if (s.mode === 'diag' && sh.phase === 'done') {
      const ok = sh.diag === sh.type;
      const none = !sh.diag;
      const d = K.DIAG[sh.type];
      const y = rc.y + 330;
      const edge = ok ? T.ok : none ? T.warn : T.red;
      D.panel(ctx, rc.x + 14, y, rc.w - 28, 74, { fill: ok ? T.okDark : none ? '#2a2018' : '#3a1410', edge, radius: 10 });
      D.text(ctx, ok ? '✔ DIAGNÓSTICO CORRECTO' : none ? '⏱ SIN RESPUESTA A TIEMPO' : '✖ DIAGNÓSTICO INCORRECTO', rc.x + 28, y + 26, { size: 16, weight: 800, color: edge });
      D.text(ctx, `Era: ${DIAG_KPI[sh.type]} · ${d.label}`, rc.x + 28, y + 48, { size: 14, weight: 700, color: d.color });

// conectan) y la ruta correcta de cada situación, en orden.
// Los ID (COM, DEL…) son solo referencia interna: en pantalla siempre va el texto completo.
(function () {

      info: 'El procedimiento de emergencia está en ACADIA: QUI-SEG-SOP-0085.',
      icon: 'sop',
    },
  };

  const ROUTES = {
    S1: ['COM', 'DEL', 'EPP', 'KIT', 'SOP260'],
    S2: ['COM', 'LAV', 'DUC', 'MSDS'],
    S3: ['COM', 'ALA', 'EXT', 'GAB', 'SOP092'],
    S4: ['COM', 'SIR', 'SAL', 'PTO', 'SOP085'],
  };

  // Ítems que aparecen en la guía junto a una situación pero no son un paso de su ruta.
  const EXTRAS = { S3: ['DET'] };

  // Situaciones en cuya ruta aparece un ítem.
  function situationsOf(itemId) {
    return Object.keys(ROUTES).filter((s) => ROUTES[s].includes(itemId) || (EXTRAS[s] || []).includes(itemId));
  }

  // Explicación de por qué `itemId` no va como paso `step` de la ruta de `sitId`.
  // reveal: decir cuál es el paso correcto.
  function whyWrong(sitId, step, itemId, reveal) {
    const route = ROUTES[sitId];
    const sit = SITUATIONS[sitId];
    const it = ITEMS[itemId];
    const expected = ITEMS[route[step]];
    const prev = step > 0 ? ITEMS[route[step - 1]] : null;
    const next = reveal ? (prev ? ` Después de «${prev.text}» va «${expected.text}».` : ` Se empieza por «${expected.text}».`) : '';
    if (step === 0) return `Toda ruta de reacción empieza por «${ITEMS.COM.text}»: primero se da aviso.`;
    if (itemId === 'DET') return `«${it.text}» detecta por sí solo: no es un paso de la ruta.${next}`;
    const later = route.indexOf(itemId);
    if (later > step) return `«${it.text}» sí es parte de la ruta, pero todavía no: falta ${later - step === 1 ? 'un paso' : `${later - step} pasos`} antes.${next}`;
    if (itemId.startsWith('SOP')) {
      const owner = situationsOf(itemId)[0];
      if (sitId === 'S2') return `«${sit.name}» no tiene procedimiento ACADIA en la guía: su ruta termina en «${ITEMS.MSDS.text}». «${it.text}» es de «${SITUATIONS[owner].name}».${next}`;
      return `«${it.text}» es el procedimiento de «${SITUATIONS[owner].name}», no de «${sit.name}».${next}`;
    }
    const others = situationsOf(itemId).filter((s) => s !== sitId);
    if (others.length) return `«${it.text}» es de la ruta «${SITUATIONS[others[0]].name}», no de «${sit.name}».${next}`;
    return `«${it.text}» no va en la ruta de «${sit.name}».${next}`;
  }

  PF.Reaction = { SITUATIONS, ITEMS, ROUTES, EXTRAS, situationsOf, whyWrong };
})();

        errors: 0,
        guide: 0,
        perSit: Object.fromEntries(Object.keys(R.SITUATIONS).map((k) => [k, { errors: 0, done: false }])),
        confusions: {},
      },
    };
    nextRound(s);
    s.update = (dt, input) => update(s, dt, input);
    s.draw = (r) => draw(s, r);
    s.report = () => report(s);
    return s;
  }

  function nextRound(s) {
    s.round++;
    if (s.round >= s.order.length) {
      s.over = true;
      return;
    }
    s.sit = s.order[s.round];
    s.step = 0;
    s.path = [];
    s.stepErrors = 0;
    s.phase = 'play';
    s.dots = layout(s);
    // El cursor empieza en el punto más cercano al inicio de la ruta.
    s.cursor = nearest(s.dots, START);
    B.clear(s.bubble);
    const sit = R.SITUATIONS[s.sit];
    s.banner = D.makeBanner(`SITUACIÓN ${s.round + 1} DE ${s.order.length}`, sit.color, sit.name, 1.6);
  }

  // Puntos del tablero: en Fácil, la ruta y unos señuelos; en Normal y Difícil, todos.
  function layout(s) {
    const route = R.ROUTES[s.sit];
    let ids;
    if (s.cfg.all) ids = Object.keys(R.ITEMS);
    else {
      const extras = R.EXTRAS[s.sit] || [];
      const others = D.shuffle(
        s.rng,
        Object.keys(R.ITEMS).filter((id) => !route.includes(id) && !extras.includes(id))
      );
      ids = [...route, ...extras, ...others.slice(0, s.cfg.decoys)];
    }
    const cells = D.shuffle(
      s.rng,
      Array.from({ length: COLS * ROWS }, (_, i) => i)
    );
    const cw = BOARD.w / COLS;
    const ch = (BOARD.h - 44) / ROWS;
    return D.shuffle(s.rng, ids).map((id, i) => {
      const c = cells[i];
      const col = c % COLS;
      const row = Math.floor(c / COLS);
      return {
        id,
        x: BOARD.x + cw * (col + 0.5) + (s.rng() - 0.5) * 26,
        y: BOARD.y + 82 + ch * row + (s.rng() - 0.5) * 10,
      };
    });
  }

  function nearest(dots, p) {
    let best = 0;
    let bd = Infinity;
    dots.forEach((d, i) => {
      const dd = Math.hypot(d.x - p.x, d.y - p.y);
      if (dd < bd) {
        bd = dd;
        best = i;
      }
    });
    return best;
  }

  // Siguiente punto en una dirección (el más cercano dentro de un cono).
  function moveCursor(s, dx, dy) {
    const from = s.dots[s.cursor];
    let best = -1;
    let bs = Infinity;
    s.dots.forEach((d, i) => {
      if (i === s.cursor) return;
      const vx = d.x - from.x;
      const vy = d.y - from.y;
      const along = vx * dx + vy * dy;
      if (along < 20) return;
      const across = Math.abs(vx * dy - vy * dx);
      const score = along + across * 2.2;
      if (score < bs) {
        bs = score;
        best = i;
      }
    });
    if (best >= 0) {
      s.cursor = best;
      D.sfx('blip');
    }
  }

  // ------------------------------------------------------------- Actualización

  function update(s, dt, input) {
    if (s.over) return;
    const P = input.pressed || [];
    const pp = (input.pad && input.pad.pressed) || [];
    const hit = (keys, btns) => keys.some((k) => P.includes(k)) || btns.some((b) => pp.includes(b));

    // La guía congela el tiempo; se cierra con el mismo botón, B o tocando la pantalla.
    const clicks = input.clicks || [];
    if (s.help) {
      if (hit(['help', 'cancel'], ['select', 'b']) || clicks.length) s.help = false;
      return;
    }
    if (hit(['help'], ['select']) || clicks.some((c) => inside(c, GUIDE_TAP))) {
      toggleGuide(s);
      return;
    }

    B.update(s.bubble, dt);
    s.floats = D.floatsUpdate(s.floats, dt);
    D.tickBanner(s, dt);

    if (s.phase === 'summary') {
      // La ruta completa queda a la vista hasta pulsar Continuar.
      const click = (input.clicks || []).some((c) => inside(c, continueRect()));
      if (hit(['confirm', 'space', 'interact'], ['a']) || click) {
        nextRound(s);
        D.sfx('enter');
      }
      return;
    }

    s.timeLeft = Math.max(0, s.timeLeft - dt);
    if (s.timeLeft <= 0) {
      s.over = true;
      return;
    }

    if (hit(['up'], ['up', 'lsUp'])) moveCursor(s, 0, -1);
    else if (hit(['down'], ['down', 'lsDown'])) moveCursor(s, 0, 1);
    else if (hit(['left'], ['left', 'lsLeft'])) moveCursor(s, -1, 0);
    else if (hit(['right'], ['right', 'lsRight'])) moveCursor(s, 1, 0);

    const m = input.mouse;
    if (m && m.moved) {
      const i = dotAt(s, m);
      if (i >= 0) s.cursor = i;
    }
    for (const c of input.clicks || []) {
      const i = dotAt(s, c);
      if (i >= 0) {
        s.cursor = i;
        link(s, i);
        return;
      }
    }
    if (hit(['confirm', 'space', 'interact'], ['a'])) link(s, s.cursor);
  }

  function toggleGuide(s) {
    s.help = !s.help;
    if (s.help && !s.over) {
      s.stats.guide++;
      s.stats.points -= s.cfg.guideCost;
    }
  }

  // "guía" en el HUD: también se abre tocándola.
  const GUIDE_TAP = { x: 1170, y: 34, w: 110, h: 30 };

  function inside(p, rc) {
    return p.x >= rc.x && p.x <= rc.x + rc.w && p.y >= rc.y && p.y <= rc.y + rc.h;
  }

  // Punto bajo el ratón (incluye su rótulo).
  function dotAt(s, p) {
    return s.dots.findIndex((d) => p.x >= d.x - 76 && p.x <= d.x + 76 && p.y >= d.y - 32 && p.y <= d.y + 82);
  }

  function link(s, i) {
    if (s.phase !== 'play') return;
    const dot = s.dots[i];
    const route = R.ROUTES[s.sit];
    const item = R.ITEMS[dot.id];
    if (s.path.includes(dot.id)) {
      B.say(s.bubble, `«${item.text}» ya está conectado en esta ruta.`, { kind: 'tip', life: 2.5 });
      return;
    }
    if (route[s.step] === dot.id) {
      s.path.push(dot.id);
      s.step++;
      s.stepErrors = 0;
      s.stats.correct++;
      s.stats.points += POINTS;
      D.floatAdd(s.floats, dot.x, dot.y - 40, `+${POINTS}`, T.ok, 20);
      D.sfx('resolved');
      if (s.step >= route.length) {
        s.stats.perSit[s.sit].done = true;
        s.phase = 'summary';
        B.say(s.bubble, `Ruta completa: ${R.SITUATIONS[s.sit].name}. ${item.info}`, { kind: 'ok', title: '¡Ruta completa!', life: 1e6 });
      } else B.say(s.bubble, `${s.step}. ${item.text}: ${item.info}`, { kind: 'ok', title: 'Correcto', life: 7 });
      return;
    }
    s.stepErrors++;
    s.stats.errors++;
    s.stats.perSit[s.sit].errors++;
    s.stats.points -= ERROR_COST;
    const expected = R.ITEMS[route[s.step]].text;
    const key = `«${item.text}» en vez de «${expected}»`;
    s.stats.confusions[key] = (s.stats.confusions[key] || 0) + 1;
    B.say(s.bubble, R.whyWrong(s.sit, s.step, dot.id, s.stepErrors >= s.cfg.reveal), { life: 9 });
  }

  // Tras varios errores en el mismo paso, el punto correcto parpadea.
  function hinted(s) {
    return s.phase === 'play' && s.stepErrors >= s.cfg.reveal;
  }

  // ------------------------------------------------------------- Dibujo

  function draw(s, r) {
    const ctx = r.ctx;
    const t = r.t;
    D.begin(r);
    ctx.fillStyle = T.bg;
    ctx.fillRect(0, 0, D.VIEW.width, D.VIEW.height);
    if (s.sit) {
      drawLeft(s, ctx);
      drawBoard(s, ctx, t);
      if (s.phase === 'summary') drawSummary(s, ctx, t);
    }
    D.floatsDraw(ctx, s.floats);
    B.bar(ctx, MSG, { bubble: s.bubble, notices: s.bubble.cur ? [] : [s.banner], t, split: 0.7 });
    D.hud(ctx, t, {
      title: 'GUÍA RÁPIDA DE REACCIÓN',
      diff: s.diff,
      timeLeft: s.timeLeft,
      duration: s.duration,
      accent: ACCENT,
      stats: [
        { label: 'Situación', value: `${Math.min(s.order.length, s.round + 1)}/${s.order.length}`, width: 120 },
        { label: 'Puntos', value: Math.max(0, s.stats.points), color: T.ok, width: 110 },
        { label: 'Errores', value: s.stats.errors, color: s.stats.errors ? T.red : T.ink, width: 100 },
      ],
    });
    D.hints(ctx, [[CTRL.guide, 'guía']], 1266, 50, { size: 11, align: 'right', ink: T.dim, color: '#6e5a48' });
    if (s.help) drawGuide(s, ctx);
  }

  function panelTitle(ctx, rc, title, sub, color = ACCENT) {
    D.panel(ctx, rc.x, rc.y, rc.w, rc.h, { fill: '#100c0a', edge: '#2e2420', radius: 12 });
    ctx.fillStyle = color;
    D.roundRect(ctx, rc.x, rc.y, rc.w, 34, 12);
    ctx.fill();
    ctx.fillRect(rc.x, rc.y + 20, rc.w, 14);
    D.text(ctx, title, rc.x + 14, rc.y + 23, { size: 16, weight: 800, color: '#15100a' });
    if (sub) D.text(ctx, sub, rc.x + rc.w - 14, rc.y + 23, { size: 13, weight: 700, color: '#15100a', align: 'right' });
  }

  function drawLeft(s, ctx) {
    const rc = LEFT;
    const sit = R.SITUATIONS[s.sit];
    const route = R.ROUTES[s.sit];
    panelTitle(ctx, rc, 'SITUACIÓN', `${s.round + 1} de ${s.order.length}`, sit.color);
    // Punto de inicio de la ruta.
    ctx.save();
    ctx.shadowColor = sit.color;
    ctx.shadowBlur = 18;
    ctx.fillStyle = '#f4efe6';
    ctx.beginPath();
    ctx.arc(START.x, START.y, 52, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = sit.color;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(START.x, START.y, 52, 0, Math.PI * 2);
    ctx.stroke();
    picto(ctx, sit.icon, START.x, START.y, 40);
    ctx.font = D.font(22, 800);
    const nl = D.wrap(ctx, sit.name.toUpperCase(), rc.w - 30);
    nl.forEach((l, i) => D.text(ctx, l, START.x, 258 + i * 26, { size: 22, weight: 800, color: sit.color, align: 'center' }));

    let y = 258 + nl.length * 26 + 18;
    D.text(ctx, 'RUTA DE REACCIÓN', rc.x + 16, y, { size: 13, weight: 800, color: T.dim });
    if (s.cfg.steps) D.text(ctx, `paso ${Math.min(s.step + 1, route.length)} de ${route.length}`, rc.x + rc.w - 16, y, { size: 13, weight: 700, color: T.dim, align: 'right' });
    y += 14;
    const shown = s.cfg.steps ? route.length : Math.min(route.length, s.path.length + 1);
    for (let i = 0; i < shown; i++) {
      const done = i < s.path.length;
      const cur = i === s.path.length && s.phase === 'play';
      const rowH = 50;
      D.panel(ctx, rc.x + 10, y, rc.w - 20, rowH - 6, { fill: done ? '#14200f' : cur ? '#231a10' : '#17110d', edge: done ? sit.color : cur ? ACCENT : '#2e2420', radius: 8 });
      ctx.fillStyle = done ? sit.color : cur ? ACCENT : '#3a2e26';
      ctx.beginPath();
      ctx.arc(rc.x + 32, y + (rowH - 6) / 2, 12, 0, Math.PI * 2);
      ctx.fill();
      D.text(ctx, String(i + 1), rc.x + 32, y + (rowH - 6) / 2 + 5, { size: 13, weight: 800, color: '#15100a', align: 'center' });
      if (done) D.paragraph(ctx, R.ITEMS[s.path[i]].text, rc.x + 52, y + 18, rc.w - 72, { size: 13, weight: 700, color: T.ink, lineHeight: 15, maxLines: 2 });
      else D.text(ctx, cur ? '¿Qué sigue?' : '?', rc.x + 52, y + 27, { size: 14, weight: 700, color: cur ? ACCENT : T.faint });
      y += rowH;
    }
    if (!s.cfg.steps && s.phase === 'play') D.text(ctx, 'En Difícil no sabes cuántos pasos quedan.', rc.x + 16, y + 14, { size: 12, color: T.faint });
  }

  function drawBoard(s, ctx, t) {
    const sit = R.SITUATIONS[s.sit];
    panelTitle(ctx, BOARD, 'UNE LOS PUNTOS EN ORDEN', 'de la situación al procedimiento');
    // Líneas de la ruta (estilo "une los puntos").
    const pts = [START, ...s.path.map((id) => s.dots.find((d) => d.id === id))];
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = sit.color;
    ctx.lineWidth = 6;
    ctx.shadowColor = sit.color;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
    ctx.stroke();
    ctx.restore();
    // Línea elástica hasta el punto seleccionado.
    if (s.phase === 'play') {
      const last = pts[pts.length - 1];
      const cur = s.dots[s.cursor];
      ctx.save();
      ctx.strokeStyle = 'rgba(242,193,78,0.7)';
      ctx.lineWidth = 3;
      ctx.setLineDash([10, 8]);
      ctx.lineDashOffset = -t * 30;
      ctx.beginPath();
      ctx.moveTo(last.x, last.y);
      ctx.lineTo(cur.x, cur.y);
      ctx.stroke();
      ctx.restore();
    }
    const expected = R.ROUTES[s.sit][s.step];
    s.dots.forEach((d, i) => {
      const order = s.path.indexOf(d.id);
      drawDot(s, ctx, d, {
        selected: i === s.cursor && s.phase === 'play',
        order,
        color: sit.color,
        hint: hinted(s) && d.id === expected,
        t,
      });
    });
  }

  function drawDot(s, ctx, d, { selected, order, color, hint, t }) {
    const item = R.ITEMS[d.id];
    const done = order >= 0;
    const r = s.cfg.pictos ? 30 : 14;
    if (hint) {
      ctx.save();
      ctx.strokeStyle = ACCENT;
      ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 8);
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(d.x, d.y, r + 12, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    ctx.save();
    if (selected) {
      ctx.shadowColor = ACCENT;
      ctx.shadowBlur = 22;
    }
    ctx.fillStyle = s.cfg.pictos ? '#f4efe6' : done ? color : '#2a211c';
    ctx.beginPath();
    ctx.arc(d.x, d.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = selected ? ACCENT : done ? color : '#5a4a40';
    ctx.lineWidth = selected ? 5 : 3;
    ctx.beginPath();
    ctx.arc(d.x, d.y, r, 0, Math.PI * 2);
    ctx.stroke();
    if (s.cfg.pictos) picto(ctx, item.icon, d.x, d.y, r * 0.78);
    if (done) {
      // Número del paso, como en los dibujos de "une los puntos".
      const bx = d.x + r * 0.78;
      const by = d.y - r * 0.78;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(bx, by, 11, 0, Math.PI * 2);
      ctx.fill();
      D.text(ctx, String(order + 1), bx, by + 5, { size: 13, weight: 800, color: '#15100a', align: 'center' });
    }
    ctx.font = D.font(13, 700);
    const lines = D.wrap(ctx, item.text, 168).slice(0, 3);
    const ly = d.y + r + 16;
    if (selected) {
      const w = Math.max(...lines.map((l) => ctx.measureText(l).width)) + 14;
      D.panel(ctx, d.x - w / 2, ly - 13, w, lines.length * 15 + 8, { fill: '#2a1f12', edge: ACCENT, radius: 6 });
    }
    lines.forEach((l, j) => D.text(ctx, l, d.x, ly + j * 15, { size: 13, weight: 700, color: selected ? '#fff3d6' : done ? color : T.ink, align: 'center' }));
  }

  function continueRect() {
    return { x: BOARD.x + BOARD.w / 2 - 170, y: BOARD.y + BOARD.h - 62, w: 340, h: 46 };
  }

  // Ruta completa, como una fila de la guía: situación → pasos, con lo que se hace en cada uno.
  function drawSummary(s, ctx, t) {
    const sit = R.SITUATIONS[s.sit];
    const route = R.ROUTES[s.sit];
    const rc = BOARD;
    ctx.fillStyle = 'rgba(8,5,4,0.88)';
    ctx.fillRect(rc.x, rc.y + 34, rc.w, rc.h - 34);
    D.text(ctx, `RUTA DE REACCIÓN · ${sit.name.toUpperCase()}`, rc.x + rc.w / 2, rc.y + 70, { size: 20, weight: 800, color: sit.color, align: 'center' });
    const n = route.length;
    const cw = 160;
    const gap = 22;
    const x0 = rc.x + (rc.w - (n * cw + (n - 1) * gap)) / 2;
    route.forEach((id, i) => {
      const item = R.ITEMS[id];
      const x = x0 + i * (cw + gap);
      const y = rc.y + 90;
      D.panel(ctx, x, y, cw, 150, { fill: '#f4efe6', edge: sit.color, radius: 10 });
      picto(ctx, item.icon, x + cw / 2, y + 44, 30);
      D.paragraph(ctx, item.text, x + cw / 2, y + 96, cw - 14, { size: 13, weight: 800, color: '#2a170d', align: 'center', lineHeight: 15, maxLines: 3 });
      if (i < n - 1) D.text(ctx, '➜', x + cw + gap / 2, y + 80, { size: 20, weight: 800, color: ACCENT, align: 'center' });
    });
    let y = rc.y + 270;
    route.forEach((id, i) => {
      const item = R.ITEMS[id];
      D.text(ctx, `${i + 1}.`, rc.x + 40, y, { size: 14, weight: 800, color: sit.color });
      y += D.paragraph(ctx, item.info, rc.x + 64, y, rc.w - 104, { size: 14, color: T.ink, maxLines: 2 }) + 6;
    });
    const errs = s.stats.perSit[s.sit].errors;
    D.text(ctx, errs ? `Errores en esta ruta: ${errs}` : 'Ruta sin errores', rc.x + rc.w / 2, rc.y + rc.h - 76, { size: 14, weight: 800, color: errs ? T.warn : T.ok, align: 'center' });
    const b = continueRect();
    const pulse = 0.75 + 0.25 * Math.sin(t * 5);
    D.panel(ctx, b.x, b.y, b.w, b.h, { fill: ACCENT, edge: ACCENT, radius: 10, glow: pulse > 0.85 ? ACCENT : null });
    const last = s.round + 1 >= s.order.length;
    const w = D.control(ctx, CTRL.link, b.x + 14, b.y + b.h / 2, { size: 13, color: '#15100a', keyInk: ACCENT });
    D.text(ctx, last ? 'VER REPORTE FINAL' : 'SIGUIENTE SITUACIÓN', b.x + w + 26, b.y + 30, { size: 18, weight: 800, color: '#15100a' });
  }

  // Guía completa (como el afiche). Consultarla congela el tiempo; en Normal y Difícil resta puntos.
  function drawGuide(s, ctx) {
    ctx.fillStyle = 'rgba(8,4,3,0.92)';
    ctx.fillRect(0, 0, D.VIEW.width, D.VIEW.height);
    D.panel(ctx, 24, 20, 1232, 680, { fill: '#1c2030', edge: ACCENT, radius: 12 });
    D.text(ctx, 'GUÍA RÁPIDA DE REACCIÓN', 640, 64, { size: 34, weight: 800, color: '#f4efe6', align: 'center' });
    const keys = Object.keys(R.SITUATIONS);
    keys.forEach((k, i) => {
      const sit = R.SITUATIONS[k];
      const route = R.ROUTES[k];
      const y = 92 + i * 142;
      ctx.fillStyle = '#f4efe6';
      ctx.beginPath();
      ctx.arc(80, y + 56, 34, 0, Math.PI * 2);
      ctx.fill();
      picto(ctx, sit.icon, 80, y + 56, 26);
      D.paragraph(ctx, sit.name.toUpperCase(), 124, y + 44, 150, { size: 15, weight: 800, color: sit.color, lineHeight: 17, maxLines: 3 });
      route.forEach((id, j) => {
        const item = R.ITEMS[id];
        const x = 290 + j * 190;
        D.panel(ctx, x, y + 4, 166, 124, { fill: '#f4efe6', edge: sit.color, radius: 8 });
        picto(ctx, item.icon, x + 83, y + 40, 26);
        D.paragraph(ctx, item.text, x + 83, y + 86, 156, { size: 12, weight: 800, color: '#2a170d', align: 'center', lineHeight: 14, maxLines: 3 });
        if (j < route.length - 1) D.text(ctx, '➜', x + 178, y + 70, { size: 16, weight: 800, color: ACCENT, align: 'center' });
      });
    });
    const cost = s.cfg.guideCost ? `Cada consulta resta ${s.cfg.guideCost} puntos · ` : '';
    D.hints(ctx, [[CTRL.guide, `${cost}volver al juego (el tiempo está en pausa)`]], 640, 680, { size: 14, align: 'center', ink: '#f4efe6', color: ACCENT });
  }

  // ------------------------------------------------------------- Pictogramas

  function poly(ctx, pts, fill) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.closePath();
    ctx.fill();
  }

  function circle(ctx, x, y, r, fill) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function rect(ctx, x, y, w, h, fill, r = 0) {
    ctx.fillStyle = fill;
    if (r) {
      D.roundRect(ctx, x, y, w, h, r);
      ctx.fill();
    } else ctx.fillRect(x, y, w, h);
  }

  // Dibuja el pictograma `kind` centrado en (x, y); s ≈ radio.
  function picto(ctx, kind, x, y, s) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s / 30, s / 30);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    switch (kind) {
      case 'megaphone':
        poly(ctx, [[-14, -6], [12, -20], [12, 20], [-14, 6]], '#e0245e');
        rect(ctx, -22, -7, 9, 14, '#8a1538', 2);
        rect(ctx, -14, 6, 6, 12, '#555', 2);
        ctx.strokeStyle = '#f2b705';
        ctx.lineWidth = 3;
        for (const a of [-0.5, 0, 0.5]) {
          ctx.beginPath();
          ctx.moveTo(17 + Math.cos(a) * 2, Math.sin(a) * 14);
          ctx.lineTo(17 + Math.cos(a) * 10, Math.sin(a) * 24);

    const rank = D.rankFor(score);
    const rows = Object.keys(R.SITUATIONS).map((k) => {
      const p = st.perSit[k];
      const value = p.done ? (p.errors ? `${p.errors} ${p.errors === 1 ? 'error' : 'errores'}` : 'sin errores') : 'sin terminar';

    const done = Object.values(st.perSit).filter((p) => p.done).length;
    const used = s.duration - s.timeLeft;
    rows.push(['Consultas a la guía', String(st.guide), st.guide ? T.warn : T.ok]);

    rows.push(['Puntuación de Calidad', `${score}/100`, D.rankColor(rank)]);

  function lockedDiff() {
    return settings.difficulty ? D.DIFFICULTIES.findIndex((d) => d.id === settings.difficulty) : -1;
  }

    const lock = lockedDiff();
    return D.DIFFICULTIES[lock >= 0 ? lock : diffSel].id;

  // Opciones extra del juego (duración, modo, tiempo de respuesta…): valor elegido o el de por defecto.

  let setupFocus = -1;

  function choiceIndex(row) {
    const c = S.choicesOf(game())[row];
    if (!c) return -1;
    const i = (choiceSel[game().id] || [])[row] ?? c.index;
    return Math.max(0, Math.min(c.values.length - 1, i));

    const row = Math.max(0, setupFocus);

    if (!c) return;

  // ↑ ↓ recorre las dificultades y después las filas de opciones (si hay más de una).

  function moveFocus(delta) {
    const rows = S.choicesOf(game()).length;

    const pos = setupFocus >= 0 ? 3 + setupFocus : diffSel;
