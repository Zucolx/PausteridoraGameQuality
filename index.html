<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pasteurizadora Flash: Turno 60</title>
    <meta name="description" content="Juego frenético de 60 segundos: opera una pasteurizadora flash y evita que la cerveza se vaya a descarte." />
    <style>
      /* Fuentes locales (SIL OFL, ver assets/fonts/): el juego no necesita conexión. */
      @font-face {
        font-family: 'Rajdhani';
        font-weight: 500;
        src: url(assets/fonts/rajdhani-500.woff2) format('woff2');
      }
      @font-face {
        font-family: 'Rajdhani';
        font-weight: 600;
        src: url(assets/fonts/rajdhani-600.woff2) format('woff2');
      }
      @font-face {
        font-family: 'Rajdhani';
        font-weight: 700 900;
        src: url(assets/fonts/rajdhani-700.woff2) format('woff2');
      }
      @font-face {
        font-family: 'Share Tech Mono';
        font-weight: 400 700;
        src: url(assets/fonts/share-tech-mono-400.woff2) format('woff2');
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0e12;
        overflow: hidden;
      }
      canvas {
        display: block;
        outline: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0" aria-label="Pasteurizadora Flash: Turno 60"></canvas>
    <script src="src/config.js"></script>
    <script src="src/minigames.js"></script>
    <script src="src/sim.js"></script>
    <script src="src/audio.js"></script>
    <script src="src/render.js"></script>
    <script src="src/main.js"></script>
  </body>
</html>
